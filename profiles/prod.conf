# Built-in profile: prod -- what the metropolis cluster actually runs today.
#
# TRANSCRIBED FROM A LIVE CONFIG, not designed: read off pve1's
# /etc/zfs-snapshot-all/jobs.pve1.v4.conf on 2026-08-25. Every schedule,
# retention, threshold and quiesce value below is the value that host is using
# right now. The only differences from that file are spelling, and they are
# named at the bottom.
#
# HOW THIS DIFFERS FROM `default`, in one sentence: `default` creates ONE family
# and prunes it with four counters (a GFS ladder); this profile creates FOUR
# families, each with its own prefix, its own cadence and its own retention.
# Both shapes are legitimate and they answer different questions -- "keep a
# tidy ladder of one series" versus "keep four series I can name".
#
# WHY EACH TIER CARRIES BOTH send_schedule AND prune_schedule: because that is
# how production is written. A tier here is self-contained -- it creates its own
# family and it prunes its own family -- so there is no separate ladder section.

[profile]
	description = odwzorowanie produkcji metropolis: cztery rodziny, kazda z wlasna retencja
	version     = 1

# ---- HOURLY: cheap, frequent, NOT quiesced -----------------------------------
# No quiesce on purpose. An hourly freeze would stall every guest 24 times a day
# to buy consistency that the daily tier already provides once.
[template:hourly]
	send_schedule  = 37 * * * *
	prefix         = automated_hourly_
	notify_word    = snapshot
	prune_schedule = 51 * * * *
	pattern        = automated_hourly
	keep           = 24
	monitor_warn   = 90m
	monitor_crit   = 3h

# ---- DAILY: the coherent one -------------------------------------------------
# `quiesce = auto` is what the owner calls "koherentny": the guest is frozen
# (qemu-guest-agent for VMs, a flush for containers) so the snapshot is
# filesystem-consistent rather than crash-consistent.
#
# TODAY, A FAILED FREEZE MEANS NO SNAPSHOT AT ALL (snapsend exits 5). For this
# tier that costs the durable artifact, not one of twenty-four -- which is the
# whole reason docs/design/quiesce-degrade.md exists. When that patch lands, the
# opt-in goes HERE, on this line: `quiesce = auto,degrade`. Nothing else in this
# profile has to move, which is what "prepared for the patch" means.
[template:daily]
	send_schedule  = 11 0 * * *
	prefix         = automated_daily_
	notify_word    = snapshot
	prune_schedule = 53 0 * * *
	pattern        = automated_daily
	keep           = 7
	quiesce        = auto
	monitor_warn   = 30h
	monitor_crit   = 48h

# ---- WEEKLY ------------------------------------------------------------------
[template:weekly]
	send_schedule  = 31 0 * * 0
	prefix         = automated_weekly_
	notify_word    = snapshot
	prune_schedule = 55 0 * * 0
	pattern        = automated_weekly
	keep           = 4
	quiesce        = auto
	monitor_warn   = 9d
	monitor_crit   = 12d

# ---- MONTHLY -----------------------------------------------------------------
# Deliberately NO monitor_warn/monitor_crit. The thresholds were removed on
# pve1 on 2026-07-22: a 35d/45d monitor fired every 15 minutes against five
# vm-disk datasets, which is 480 checks a day to tell you nothing. Pruning was
# unaffected. Transcribed as it is, including the absence -- a profile that
# quietly restored those thresholds would restore the flood with them.
[template:monthly]
	send_schedule  = 41 0 1 * *
	prefix         = automated_monthly_
	notify_word    = snapshot
	prune_schedule = 57 0 1 * *
	pattern        = automated_monthly
	keep           = 6
	quiesce        = auto

# ---- WHAT EVERY GENERATED SECTION INHERITS -----------------------------------
# All four tiers on every dataset, exactly as pve1 writes
# `use_template = hourly,daily,weekly,monthly`.
#
# NO [prune] BLOCK, and that is the substantive difference from `default`: each
# tier prunes its own family through its own prune_schedule, so there is no
# separate ladder section to emit. `default` needs one because its four
# counters share a single family.
[dataset]
	use_template = hourly,daily,weekly,monthly

# ---- RESERVED FAMILIES -------------------------------------------------------
# Identical to `default`, and identical on purpose: these are config-wide floors
# shared by every relationship in a file, not this profile's opinion. Two
# profiles declaring the same family with the same keep deduplicate; declaring
# it with a different keep must be refused.
[excluded:__replicate_]
	keep = 2

[excluded:vzdump]
	keep = 2

[excluded:__migration__]
	keep = 2

# ---- DIFFERENCES FROM THE LIVE FILE, ALL OF THEM ------------------------------
#
# 1. `keep = 24` here is written `keep = 24` on pve1 too -- but pve1's tier is
#    named `[template:hourly]` bare, while a profile's names are namespaced
#    (`profile__prod__hourly`) and the generator can no longer derive the
#    counter letter from them. The renderer derives it here instead, from the
#    tier's cadence, and emits `retain = -H24`. Same retention, and the
#    ergonomic spelling survives.
#
# 2. pve1's dataset sections carry `flags = -v 3` (log verbosity). That is not
#    policy and does not belong to a profile -- it is the only flag those
#    sections carry, and there is no bandwidth, compression or cipher anywhere
#    in that file.
#
# 3. pve1 names its datasets and its target; a profile never does. Source,
#    target, account, keys and endpoint belong to the relationship.
