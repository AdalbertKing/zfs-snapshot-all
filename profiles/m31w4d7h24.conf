# Built-in profile: m31w4d7h24 -- 31 months, 4 weeks, 7 days, 24 hours,
# counted in SNAPSHOTS.
#
# THE NAME IS THE RETENTION and the case is the shape: lowercase means FOUR
# FAMILIES, one per tier, each with its own prefix, its own counter and its own
# `delsnaps` line. See profiles/README.md.
#
# NO SUFFIX, WHICH IS THE WHOLE POINT OF THIS FILE. A bare name means the
# catalogue default -- the flat count -- and here that default was chosen rather
# than inherited. `keep = 24` on the hourly family means "the 24 NEWEST hourly
# snapshots", full stop: delsnaps sorts by date, keeps the top N and never asks
# how old anything is.
#
# WHY THAT MATTERS, measured on pve10 2026-09-04 against the real delsnaps.sh:
# a GFS rung is anchored on the WALL CLOCK (`GFS_NOW` defaults to `date +%s`),
# and the header of delsnaps.sh says what follows from that -- "anything older
# than the outermost requested rung is deleted". Six snapshots, one prune run,
# a machine that had been off for thirty days:
#
#   flat  -H24 -D7      6 of 6 survive
#   -G    -H24 -D7      0 of 6 survive          <- rc=0, no warning, silent
#   -G    -H24 -D30     1 of 6 survives
#
# A ladder thins by TIME BUCKET, so a family whose newest member has aged past
# the ladder's reach is deleted entirely, quietly, on the first prune after the
# machine comes back. Owner, 2026-09-04: "zostaw 24 godzinowe, 7 dziennych ...
# niewazne jak dawno serwer byl w szafie". Only the flat count does that, and
# that is why this profile has no `gfs = yes` anywhere in it.
#
# ONE COUNTER PER FAMILY, NOT ONE SUM. In flat mode delsnaps ADDS the letters
# together -- `calculate_keep_count()` is `keep_years + keep_months + ... +
# keep_hours` -- so a single line carrying -M31 -W4 -D7 -H24 would keep the 66
# newest snapshots of ONE family and nothing else: about three days of hourlies,
# and no history at all. The four tiers are therefore four separate families
# with four separate prefixes and four separate prune lines, each counting only
# its own.
#
# FOUR FAMILIES ALSO BECAUSE QUIESCE CANNOT BE PER-TIER ON ONE. On a single
# family the "daily" snapshot IS one of the twenty-four hourly ones a counter
# decided to keep, so freezing the daily set would mean freezing all twenty-four
# -- every guest on the host stalled 24 times a day. Separate families let the
# expensive tiers be coherent and leave the cheap one alone.
#
# WHAT IT COSTS, and it is the honest other half of the measurement above: a
# flat count bounds retention by NUMBER, so it says nothing about SPREAD. After
# a catch-up burst -- three snapshots inside one hour, which is what a resumed
# job looks like -- `-H24` keeps the 24 newest, and those 24 can span minutes
# instead of a day. A ladder would have kept one per hourly bucket. If your
# hosts never go dark for longer than a tier's reach and bursts are the thing
# you fear, reach for m12w4d7h24-gfs instead.
#
# WHEN TO REACH FOR IT: a machine that is powered down for stretches -- a lab
# node, a cold spare, an office box over a long shutdown, anything that is not
# on around the clock -- where coming back to an empty snapshot family is worse
# than coming back to twenty-four hourlies that are all a month old.

[profile]
	description = 31 miesiecy + 4 tygodnie + 7 dni + 24 godziny, cztery rodziny, licznik sztuk (przestoj nie kasuje)
	version     = 1

# ---- HOURLY: cheap, frequent, NEVER quiesced --------------------------------
[template:hourly]
	send_schedule  = 1 * * * *
	prefix         = automated_hourly_
	notify_word    = snapshot
	prune_schedule = 21 * * * *
	pattern        = automated_hourly
	keep           = 24
	monitor_warn   = 90m
	monitor_crit   = 150m

# ---- DAILY ------------------------------------------------------------------
[template:daily]
	send_schedule  = 11 1 * * *
	prefix         = automated_daily_
	notify_word    = snapshot
	prune_schedule = 31 1 * * *
	pattern        = automated_daily
	keep           = 7
	quiesce        = auto,degrade
	monitor_warn   = 30h
	monitor_crit   = 48h

# ---- WEEKLY -----------------------------------------------------------------
# Sunday. Thresholds sized to THAT cadence: a weekly job is legitimately seven
# days old the moment before it runs, so anything at or below the gap would
# alarm on a healthy job every cycle and never on a fault. gen-cron refuses those.
[template:weekly]
	send_schedule  = 21 2 * * 0
	prefix         = automated_weekly_
	notify_word    = snapshot
	prune_schedule = 41 2 * * 0
	pattern        = automated_weekly
	keep           = 4
	quiesce        = auto,degrade
	monitor_warn   = 8d
	monitor_crit   = 10d

# ---- MONTHLY ----------------------------------------------------------------
# 31 of them is a little over two and a half years, and the number is the
# owner's: the tier that answers "what did this look like before the change" is
# the one worth paying for, and a monthly snapshot costs almost nothing on a
# dataset that already carries the three tiers above it.
[template:monthly]
	send_schedule  = 31 3 1 * *
	prefix         = automated_monthly_
	notify_word    = snapshot
	prune_schedule = 51 3 1 * *
	pattern        = automated_monthly
	keep           = 31
	quiesce        = auto,degrade
	monitor_warn   = 35d
	monitor_crit   = 40d

# ---- WHAT EVERY GENERATED SECTION INHERITS ----------------------------------
# NO [prune] BLOCK: each tier prunes its own family through its own
# prune_schedule and its own counter. A [prune:] section is for the single-family
# ladder shape and cannot express four independent counters anyway -- a
# [prune:<path>] header can exist only once per dataset.
[dataset]
	use_template = hourly,daily,weekly,monthly

# ---- RESERVED FAMILIES ------------------------------------------------------
# __replicate_ is pvesr's, vzdump is the backup job's, __migration__ belongs to
# a live migration. None of them ours to delete, so they are fenced rather than
# left to a counter that does not know what they are.
[excluded:__replicate_]
	keep = 2

[excluded:vzdump]
	keep = 2

[excluded:__migration__]
	keep = 2
