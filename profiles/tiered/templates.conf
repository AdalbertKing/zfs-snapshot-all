# Profile "tiered" — one snapshot FAMILY per tier, flat per-tier counters.
#
# The contrast with the built-in "default" profile is the whole point:
#
#   default   ONE family (automated_hourly_) and ONE cascading GFS ladder that
#             re-buckets it by elapsed time. Compact, and the ladder is the only
#             thing that has to be right.
#   tiered    FOUR families (automated_hourly_/daily_/weekly_/monthly_), each
#             created on its own cadence and pruned by its own flat counter.
#
# This is a transcription of what the production hosts have been running by
# hand since long before profiles existed, and the reason to prefer it is not
# retention arithmetic -- it is that THE TIER NAME IS A HUMAN-READABLE
# CONSISTENCY CONTRACT. `automated_daily_2026-08-20_00-17-01` says, in the
# name, which policy produced it. Under a single-family ladder every snapshot
# is named `automated_hourly_` and which ones survived is a property of the
# ladder's arithmetic, recoverable only by re-running it.
#
# That contract carries real weight with quiesce. quiesce FAILS CLOSED: if the
# guest could not be frozen, snapsend.sh does not take the snapshot. So on this
# profile the existence of an `automated_daily_` snapshot is itself the evidence
# that the freeze succeeded -- no coherence flag, no sidecar, no marking
# mechanism, which was considered and explicitly rejected. The name is the
# record.
#
# SEND tiers and KEEP tiers are separate sections on purpose. In a relationship
# the [dataset:] section pulls and the [prune:] section prunes the collector's
# own copy, so one template cannot serve both -- and a template carrying both
# send_schedule and prune_schedule would additionally have to satisfy
# gen-cron's create/prune agreement check on its own.
#
# 'retain' rather than 'keep': gen-cron derives a counter LETTER from the tier
# NAME (hourly->H, daily->D, ...), and these tiers are named keep_hourly, not
# hourly, so `keep = 24` would fail with "no retain-flag letter known". Same
# reason the default profile spells it out.

# ---- SEND tiers: what gets created, and when ----------------------------------
# Schedules are staggered off the hour and off each other so that on a Sunday
# the 1st -- when all four fire -- they queue rather than collide on the same
# dataset's snapshot lock.

[template:tier_hourly]
	send_schedule  = 7 * * * *
	prefix         = automated_hourly_
	notify_word    = backup

# quiesce from daily upwards, NEVER on hourly. A freeze is a real write stall
# inside the guest; paying it 24 times a day to protect a snapshot that lives
# 24 hours is a bad trade, while paying it once a day for the copy that is
# actually kept for a week is a good one. Hourly stays crash-consistent by
# design, not by omission.
[template:tier_daily]
	send_schedule  = 17 0 * * *
	prefix         = automated_daily_
	notify_word    = backup
	quiesce        = auto

[template:tier_weekly]
	send_schedule  = 27 0 * * 0
	prefix         = automated_weekly_
	notify_word    = backup
	quiesce        = auto

[template:tier_monthly]
	send_schedule  = 37 0 1 * *
	prefix         = automated_monthly_
	notify_word    = backup
	quiesce        = auto

# ---- KEEP tiers: what survives, and what is watched ---------------------------
# Each keep tier prunes exactly the family its matching send tier creates, so
# every pattern is the send tier's prefix without the trailing underscore --
# delsnaps.sh matches by literal prefix, so automated_daily matches
# automated_daily_2026-08-20_00-17-01 and nothing else. No two patterns here are
# a prefix of one another, which is what lets all four run against the same
# scope without gen-cron's overlap check refusing them.

[template:keep_hourly]
	prune_schedule = 47 * * * *
	pattern        = automated_hourly
	retain         = -H24
	notify_word    = prune
	monitor_warn   = 90m
	monitor_crit   = 150m

[template:keep_daily]
	prune_schedule = 49 0 * * *
	pattern        = automated_daily
	retain         = -D7
	notify_word    = prune
	monitor_warn   = 30h
	monitor_crit   = 48h

[template:keep_weekly]
	prune_schedule = 51 0 * * 0
	pattern        = automated_weekly
	retain         = -W4
	notify_word    = prune
	monitor_warn   = 9d
	monitor_crit   = 12d

# No monitor on monthly, deliberately. A staleness check on a 30-day cadence
# has to be given a ~35d/45d threshold, and it runs on the monitor schedule
# (*/15 by default) the whole time -- production removed exactly this monitor
# on 2026-07-22 after it fired against every dataset using the tier. A monthly
# family that stops arriving is visible in the daily and weekly monitors of the
# same dataset long before a monthly threshold would notice.
[template:keep_monthly]
	prune_schedule = 53 0 1 * *
	pattern        = automated_monthly
	retain         = -M6
	notify_word    = prune
