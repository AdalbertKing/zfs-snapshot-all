# Built-in PASSIVE profile (declared passivity, LAB-E 2026-08-23).
#
# The relationship ADOPTS the newest existing snapshot, whatever a foreign
# system called it, and stamps nothing on the source. Hence:
#   * the send tier has NO prefix -- Phase 3.5's deliberate prefixless case;
#     with -e (added by the emitter from the PASSIVE declaration) that is a
#     passive pickup, not a bare-timestamp create;
#   * every monitor watches "the newest snapshot of ANYTHING" -- pattern '-'
#     is check-snap-age.sh's explicit any-mode; exclusions arrive separately
#     through monitor_exclude, never by recognising prefixes;
#   * retention on the COPY is a prefixless GFS ladder (gfs_pattern omitted);
#     the SOURCE keeps no prune at all -- the foreign family's owner keeps
#     sole retention authority, exactly the rule the sync chain learned when
#     two writers destroyed a family in 80 minutes.
[template:passive_hourly]
	send_schedule  = 1 * * * *
	notify_word    = backup

[template:passive_keep_hourly]
	prune_schedule = 21 * * * *
	pattern        = -
	retain         = -H24
	notify_word    = prune
	monitor_warn   = 90m
	monitor_crit   = 150m

[template:passive_keep_daily]
	prune_schedule = 21 * * * *
	pattern        = -
	retain         = -D7
	notify_word    = prune

[template:passive_keep_weekly]
	prune_schedule = 21 * * * *
	pattern        = -
	retain         = -W4
	notify_word    = prune

[template:passive_keep_monthly]
	prune_schedule = 21 * * * *
	pattern        = -
	retain         = -M12
	notify_word    = prune

# RESERVED FAMILIES -- the floors every deployment on this estate carries.
#
# These were a hardcoded list inside zfs-backup.sh until 2026-08-25, which made
# the one policy every relationship runs under the one policy no profile could
# describe: "what does a default deployment do" was a question you answered by
# reading the code. Owner decision: they belong to the profile, so they are
# written here, with exactly the values the code used to hardwire.
#
# They are NOT namespaced. A [excluded:] section is config-wide policy shared by
# every relationship in the file -- two profiles naming the same family mean the
# same family, and rewriting the name would produce two floors for one thing.
#
# What they do: gen-cron resolves every [excluded:] into one PROTECT_FLAGS
# fragment and pastes it onto every generated prune line, so a family listed
# here keeps its newest `keep` snapshots whatever the retention ladder says.
# __replicate_ is pvesr's, vzdump is the backup job's, __migration__ belongs to
# a live migration -- none of them are ours to delete, and a prune that took
# them would break replication, backups or a migration in flight.

[excluded:__replicate_]
	keep = 2

[excluded:vzdump]
	keep = 2

[excluded:__migration__]
	keep = 2
