# Built-in PASSIVE profile (declared passivity, LAB-E 2026-08-23).
#
# The relationship ADOPTS the newest existing snapshot, whatever a foreign
# system called it, and stamps nothing on the source. Hence:
#   * the send tier has NO prefix -- Phase 3.5's deliberate prefixless case;
#     with -e (added by the emitter from the PASSIVE declaration) that is a
#     passive pickup, not a bare-timestamp create;
#   * every monitor watches "the newest snapshot of ANYTHING" -- pattern '-'
#     is check-snap-age.sh's explicit any-mode; exclusions arrive separately
#     through monitor_exclude, never by recognising prefixes;
#   * retention on the COPY is a prefixless GFS ladder (gfs_pattern omitted);
#     the SOURCE keeps no prune at all -- the foreign family's owner keeps
#     sole retention authority, exactly the rule the sync chain learned when
#     two writers destroyed a family in 80 minutes.
[template:passive_hourly]
	send_schedule  = 1 * * * *
	notify_word    = backup

[template:passive_keep_hourly]
	prune_schedule = 21 * * * *
	pattern        = -
	retain         = -H24
	notify_word    = prune
	monitor_warn   = 90m
	monitor_crit   = 150m

[template:passive_keep_daily]
	prune_schedule = 21 * * * *
	pattern        = -
	retain         = -D7
	notify_word    = prune

[template:passive_keep_weekly]
	prune_schedule = 21 * * * *
	pattern        = -
	retain         = -W4
	notify_word    = prune

[template:passive_keep_monthly]
	prune_schedule = 21 * * * *
	pattern        = -
	retain         = -M12
	notify_word    = prune
