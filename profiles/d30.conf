# Built-in profile: d30 -- 30 daily, and no hourly at all.
#
# THE FILE NAME IS THE RETENTION: thirty daily counters. The absence of an `h`
# in the name is a statement, not an omission -- this profile takes ONE snapshot
# a day and keeps thirty of them.
#
# THE CASE OF THE NAME IS THE SHAPE (owner rule, 2026-08-27): lowercase means
# one family per tier, each pruned by its own counter -- the shape `prod` uses.
# An uppercase `D30` would be a GFS ladder, the shape `default` uses. With a
# single tier the two would render almost the same line; the case is still
# written the way the rule says, because a naming convention that is only
# honoured where it visibly matters is not a convention.
#
# WHY A PROFILE WITHOUT HOURLIES: because on some datasets an hourly snapshot is
# noise rather than safety. Archives, media, anything written in batches: 24
# snapshots a day of a tree that changed once buys nothing and costs a listing
# nobody can read.
#
# AND IT IS COHERENT. A daily-only profile can quiesce without the argument the
# hourly tier forces everywhere else: the freeze is paid once a day, not
# twenty-four times. `quiesce = auto` freezes the guest (qemu-guest-agent for a
# VM, a flush for a container) so the snapshot is filesystem-consistent.
#
# This profile refused to quiesce until 2026-08-27, and the reason it gave was
# that a failed freeze cost the whole day -- one tier, one chance. That cost is
# what the owner's direction of that date removed: a freeze that cannot be taken
# now stamps `automated_daily_crash_<timestamp>` anyway and exits 8, so the day
# is never lost, only labelled. The objection is gone, so the refusal went with
# it. `,strict` is the way back for data where a crash-consistent copy is
# genuinely worthless. See docs/design/quiesce-degrade.md.
#
# WHEN TO REACH FOR IT: datasets where "yesterday" is fine and "an hour ago" is
# not worth the clutter. If you need finer grain, d30h24 keeps the same month
# with hourlies on top.

[profile]
	description = 30 dobowych, bez godzinowych, koherentne
	version     = 1

# ---- DAILY: the only tier, and the coherent one ------------------------------
[template:daily]
	send_schedule  = 11 1 * * *
	prefix         = automated_daily_
	notify_word    = snapshot
	prune_schedule = 31 1 * * *
	pattern        = automated_daily
	keep           = 30
	quiesce        = auto,degrade
	monitor_warn   = 30h
	monitor_crit   = 48h

# ---- WHAT EVERY GENERATED SECTION INHERITS -----------------------------------
# NO [prune] BLOCK: the tier prunes its own family through its own
# prune_schedule, so there is no separate ladder section to emit.
[dataset]
	use_template = daily

# ---- RESERVED FAMILIES -------------------------------------------------------
# Config-wide floors, identical in every shipped profile and identical on
# purpose: they are not this profile's opinion. __replicate_ is pvesr's, vzdump
# is the backup job's, __migration__ belongs to a live migration -- none of them
# ours to delete.
[excluded:__replicate_]
	keep = 2

[excluded:vzdump]
	keep = 2

[excluded:__migration__]
	keep = 2
