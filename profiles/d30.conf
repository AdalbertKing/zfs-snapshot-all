# Built-in profile: d30 -- 30 daily, and no hourly at all.
#
# THE FILE NAME IS THE RETENTION: thirty daily counters. The absence of an `h`
# in the name is a statement, not an omission -- this profile takes ONE snapshot
# a day and keeps thirty of them.
#
# WHY A PROFILE WITHOUT HOURLIES: because on some datasets an hourly snapshot is
# noise rather than safety. Archives, media, anything written in batches: 24
# snapshots a day of a tree that changed once buys nothing and costs a listing
# that nobody can read. It also removes the one tier that this estate has to
# argue about elsewhere -- an hourly freeze is too expensive to pay 24 times a
# day, so a daily-only profile can quiesce without a caveat.
#
# THE SNAPSHOT IS STILL CREATED DAILY, at 01:11, and the family is still
# `automated_daily_`. A ladder with a single counter is still a ladder: one
# `delsnaps -G` call, one family, one number.
#
# WHEN TO REACH FOR IT: datasets where "yesterday" is fine and "an hour ago" is
# not worth the clutter. If you need finer grain, d30h24 keeps the same month
# with hourlies on top.

[profile]
	description = 30 dobowych, bez godzinowych
	version     = 1

# ---- CREATE ------------------------------------------------------------------
# Not `quiesce = auto` by default, deliberately. Freezing a guest is the host's
# decision and not every dataset under this profile even holds one; a
# relationship that wants coherence asks for it, and the profile does not
# presume. See docs/design/quiesce-degrade.md for what a failed freeze costs
# today -- on a once-a-day tier it costs the whole day.
[template:daily_create]
	send_schedule  = 11 1 * * *
	prefix         = automated_daily_
	notify_word    = backup

# ---- RETENTION: one counter, one family --------------------------------------
[template:keep_daily]
	prune_schedule = 31 1 * * *
	pattern        = automated_daily
	keep           = 30
	notify_word    = prune
	monitor_warn   = 30h
	monitor_crit   = 48h

# ---- WHAT EVERY GENERATED SECTION INHERITS -----------------------------------
[dataset]
	use_template = daily_create

[prune]
	use_template = keep_daily
	gfs          = yes
	gfs_pattern  = automated_

# ---- RESERVED FAMILIES -------------------------------------------------------
[excluded:__replicate_]
	keep = 2

[excluded:vzdump]
	keep = 2

[excluded:__migration__]
	keep = 2
