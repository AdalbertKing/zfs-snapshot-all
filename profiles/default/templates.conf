# Built-in default profile — native CONFIG v4 template sections.
# Slice A: fixture only. No runtime path consumes this file yet.
# Keep this text semantically identical to the policy currently hardcoded in
# zfs-backup.sh until Slice B extracts that hardcode.

[template:standard_hourly]
	send_schedule  = 1 * * * *
	prefix         = automated_hourly_
	notify_word    = backup

[template:keep_hourly]
	prune_schedule = 21 * * * *
	pattern        = automated_hourly
	retain         = -H24
	notify_word    = prune
	monitor_warn   = 90m
	monitor_crit   = 150m

[template:keep_daily]
	prune_schedule = 21 * * * *
	pattern        = automated_hourly
	retain         = -D7
	notify_word    = prune

[template:keep_weekly]
	prune_schedule = 21 * * * *
	pattern        = automated_hourly
	retain         = -W4
	notify_word    = prune

[template:keep_monthly]
	prune_schedule = 21 * * * *
	pattern        = automated_hourly
	retain         = -M12
	notify_word    = prune
