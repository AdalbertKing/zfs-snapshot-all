# Built-in default profile — native CONFIG v4 template sections.
#
# This IS the policy now. The Slice A note that used to sit here said "fixture
# only, no runtime path consumes this file yet" and told the reader to keep it
# semantically identical to a hardcode in zfs-backup.sh. Slice B1 moved the
# runtime onto this file; the hardcoded shell variables it was mirroring stayed
# behind unread until 2026-08-20, when they were deleted. There is nothing left
# to mirror.
#
# 'retain =', never 'keep =', and that is not a style choice: gen-cron.sh
# derives a counter letter from the CANONICAL tier name (hourly -> -H, daily ->
# -D, ...). These tiers are named standard_/keep_<tier> so they cannot collide
# with a host's own hand-written hourly/daily templates in the same config, so
# 'keep = 24' here would fail with "no retain-flag letter known for tier
# 'keep_hourly'". Found live, REV-20260730-001, fix commit 7ebfbf7.

[template:standard_hourly]
	send_schedule  = 1 * * * *
	prefix         = automated_hourly_
	notify_word    = backup

[template:keep_hourly]
	prune_schedule = 21 * * * *
	pattern        = automated_hourly
	retain         = -H24
	notify_word    = prune
	monitor_warn   = 90m
	monitor_crit   = 150m

[template:keep_daily]
	prune_schedule = 21 * * * *
	pattern        = automated_hourly
	retain         = -D7
	notify_word    = prune

[template:keep_weekly]
	prune_schedule = 21 * * * *
	pattern        = automated_hourly
	retain         = -W4
	notify_word    = prune

[template:keep_monthly]
	prune_schedule = 21 * * * *
	pattern        = automated_hourly
	retain         = -M12
	notify_word    = prune

# RESERVED FAMILIES -- the floors every deployment on this estate carries.
#
# These were a hardcoded list inside zfs-backup.sh until 2026-08-25, which made
# the one policy every relationship runs under the one policy no profile could
# describe: "what does a default deployment do" was a question you answered by
# reading the code. Owner decision: they belong to the profile, so they are
# written here, with exactly the values the code used to hardwire.
#
# They are NOT namespaced. A [excluded:] section is config-wide policy shared by
# every relationship in the file -- two profiles naming the same family mean the
# same family, and rewriting the name would produce two floors for one thing.
#
# What they do: gen-cron resolves every [excluded:] into one PROTECT_FLAGS
# fragment and pastes it onto every generated prune line, so a family listed
# here keeps its newest `keep` snapshots whatever the retention ladder says.
# __replicate_ is pvesr's, vzdump is the backup job's, __migration__ belongs to
# a live migration -- none of them are ours to delete, and a prune that took
# them would break replication, backups or a migration in flight.

[excluded:__replicate_]
	keep = 2

[excluded:vzdump]
	keep = 2

[excluded:__migration__]
	keep = 2
