# Built-in profile: d7h24 -- 7 daily, 24 hourly. A week of cover.
#
# THE FILE NAME IS THE RETENTION: seven daily and twenty-four hourly, and there
# is nothing else to read. No weekly, no monthly, because the name does not
# claim any. An administrator picking a profile from `ls` should not have to
# open it to learn what it keeps.
#
# THE CASE OF THE NAME IS THE SHAPE (owner rule, 2026-08-27):
#
#   lowercase `d7h24` -> TWO FAMILIES. `automated_hourly_` stamped every hour
#   and pruned to 24; `automated_daily_` stamped once a day and pruned to 7.
#   Two independent series, the shape `prod` uses.
#
#   uppercase `D7H24` would be the GFS ladder -- ONE family, the daily counter
#   re-using snapshots the hourly counter already holds, which is what `default`
#   does. None is shipped yet; the case distinction exists so that when one is,
#   the two shapes are told apart from `ls`.
#
# WHY THIS ONE IS NOT A LADDER: a ladder cannot answer the coherence question.
# On a ladder the "daily" snapshot IS an hourly snapshot the counter decided to
# keep, so freezing it means freezing all twenty-four -- stalling every guest on
# the host 24 times a day. Two families let the expensive tier be expensive once.
#
# WHICH TIER IS COHERENT: the daily one, via `quiesce = auto` (a
# qemu-guest-agent freeze for a VM, a flush for a container). The hourly tier is
# deliberately NOT quiesced.
#
# WHAT A FAILED FREEZE COSTS: nothing but a name. Since 2026-08-27 the set is
# stamped anyway as `automated_daily_crash_<timestamp>` and the run exits 8, so
# cron reports it rather than filing it as clean. `,degrade` asks for what it
# would get anyway and is written out for legibility; `,strict` is the only
# qualifier that still changes anything -- no snapshot, run fails.
# See docs/design/quiesce-degrade.md.
#
# WHEN TO REACH FOR IT: datasets whose value is recent -- scratch, build
# artifacts, lab trees, anything you would restore from "this week or not at
# all". For a month, d30h24; for datasets where an hourly snapshot is noise
# rather than safety, d30.

[profile]
	description = 7 dobowych + 24 godzinowe, dwie rodziny, dobowe koherentne
	version     = 1

# ---- HOURLY: cheap, frequent, NOT quiesced -----------------------------------
[template:hourly]
	send_schedule  = 1 * * * *
	prefix         = automated_hourly_
	notify_word    = snapshot
	prune_schedule = 21 * * * *
	pattern        = automated_hourly
	keep           = 24
	monitor_warn   = 90m
	monitor_crit   = 150m

# ---- DAILY: the coherent one -------------------------------------------------
[template:daily]
	send_schedule  = 11 1 * * *
	prefix         = automated_daily_
	notify_word    = snapshot
	prune_schedule = 31 1 * * *
	pattern        = automated_daily
	keep           = 7
	quiesce        = auto,degrade
	monitor_warn   = 30h
	monitor_crit   = 48h

# ---- WHAT EVERY GENERATED SECTION INHERITS -----------------------------------
# NO [prune] BLOCK: each tier prunes its own family through its own
# prune_schedule, so there is no separate ladder section to emit.
[dataset]
	use_template = hourly,daily

# ---- RESERVED FAMILIES -------------------------------------------------------
# Config-wide floors, identical in every shipped profile and identical on
# purpose: they are not this profile's opinion. __replicate_ is pvesr's, vzdump
# is the backup job's, __migration__ belongs to a live migration -- none of them
# ours to delete.
[excluded:__replicate_]
	keep = 2

[excluded:vzdump]
	keep = 2

[excluded:__migration__]
	keep = 2
