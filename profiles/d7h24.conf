# Built-in profile: d7h24 -- 7 daily, 24 hourly. A week of cover.
#
# THE FILE NAME IS THE RETENTION. `d7h24` means seven daily counters and
# twenty-four hourly ones, and there is nothing else to read: no weekly, no
# monthly, because the name does not claim any. An administrator picking a
# profile from `ls` should not have to open it to learn what it keeps.
#
# SAME SHAPE AS `default`, cheaper counters. One family of snapshots
# (`automated_hourly_`) created every hour, pruned by a GFS ladder -- one
# `delsnaps -G` call whose counters decide how far back the series reaches. The
# same snapshots serve as both hourly and daily retention; nothing is stamped
# twice and nothing is copied twice.
#
# WHEN TO REACH FOR IT: datasets whose value is recent -- scratch, build
# artifacts, lab trees, anything you would restore from "this week or not at
# all". For a year of history use d30h24 or default; for datasets where an
# hourly snapshot is noise rather than safety, d30.

[profile]
	description = 7 dobowych + 24 godzinowe, jedna rodzina, drabina GFS
	version     = 1

# ---- CREATE ------------------------------------------------------------------
[template:hourly_create]
	send_schedule  = 1 * * * *
	prefix         = automated_hourly_
	notify_word    = backup

# ---- RETENTION: two counters, ONE family -------------------------------------
# Both prune the family the create tier makes -- that is what makes it a ladder
# rather than two independent series. `keep = N` is translated to the engine's
# flag (-H24, -D7) by the renderer, from the tier's cadence: the last word of
# its name.
[template:keep_hourly]
	prune_schedule = 21 * * * *
	pattern        = automated_hourly
	keep           = 24
	notify_word    = prune
	monitor_warn   = 90m
	monitor_crit   = 150m

[template:keep_daily]
	prune_schedule = 21 * * * *
	pattern        = automated_hourly
	keep           = 7
	notify_word    = prune

# ---- WHAT EVERY GENERATED SECTION INHERITS -----------------------------------
[dataset]
	use_template = hourly_create

[prune]
	use_template = keep_hourly,keep_daily
	gfs          = yes
	gfs_pattern  = automated_

# ---- RESERVED FAMILIES -------------------------------------------------------
# Config-wide floors, identical in every shipped profile and identical on
# purpose: they are not this profile's opinion. __replicate_ is pvesr's, vzdump
# is the backup job's, __migration__ belongs to a live migration -- none of them
# ours to delete.
[excluded:__replicate_]
	keep = 2

[excluded:vzdump]
	keep = 2

[excluded:__migration__]
	keep = 2
