# Built-in profile: m12w4d7h24-gfs -- 12 months, 4 weeks, 7 days, 24 hours,
# each family on its own GFS ladder.
#
# THE LEAN SIBLING of y5m12d31h24-gfs. Same four-family shape and the same
# rules; it drops the yearly tier and shortens the daily one from 31 to 7,
# adding a weekly rung in between. A month of cover instead of five years.
#
# FOUR FAMILIES, AND A LADDER ON EACH -- both halves deliberate.
#
# Four families, because ONE family cannot be quiesced per tier: on a single
# family the "daily" snapshot IS one of the twenty-four hourly ones a counter
# decided to keep, so freezing the daily set means freezing all twenty-four --
# every guest on the host stalled 24 times a day.
#
# A ladder on each (`gfs = yes` per tier, one -G line per family), because a
# flat count bounds retention by NUMBER and a ladder bounds it by TIME. After a
# catch-up burst those differ sharply: measured on pve9 with three snapshots
# taken inside one hour, flat -H2 kept the two newest -- two seconds of history
# -- while -G -H2 kept one per hourly bucket. `keep = 24` here means "one an
# hour for the last twenty-four hours", not "the twenty-four newest".
#
# WHICH TIERS ARE COHERENT: every tier except hourly, via `quiesce = auto`.
# The hourly tier is never quiesced -- the catalogue-wide rule, and what makes
# an hourly cadence affordable at all.
#
# WHAT A FAILED FREEZE COSTS: a name, not a snapshot. `,degrade` stamps the set
# anyway as `automated_<tier>_crash_<timestamp>` and exits 8, so the run is
# reported rather than filed as clean. See docs/design/quiesce-degrade.md.
#
# NOTHING IS SENT ANYWHERE: no `dst`, and a profile may not carry one. Pair it
# with `--target=''` for the single-host shape.
#
# WHEN TO REACH FOR IT: a host where a month of history is the honest answer and
# five years would be paying for tape in ZFS. For the long form, y5m12d31h24-gfs;
# for retention by age instead of by bucket, m12w4d7h24-age.

[profile]
	description = 12 miesiecy + 4 tygodnie + 7 dni + 24 godziny, cztery rodziny, kazda na wlasnej drabinie
	version     = 1

# ---- HOURLY: cheap, frequent, NEVER quiesced --------------------------------
[template:hourly]
	send_schedule  = 1 * * * *
	prefix         = automated_hourly_
	notify_word    = snapshot
	prune_schedule = 21 * * * *
	pattern        = automated_hourly
	gfs            = yes
	keep           = 24
	monitor_warn   = 90m
	monitor_crit   = 150m

# ---- DAILY ------------------------------------------------------------------
[template:daily]
	send_schedule  = 11 1 * * *
	prefix         = automated_daily_
	notify_word    = snapshot
	prune_schedule = 31 1 * * *
	pattern        = automated_daily
	gfs            = yes
	keep           = 7
	quiesce        = auto,degrade
	monitor_warn   = 30h
	monitor_crit   = 48h

# ---- WEEKLY -----------------------------------------------------------------
# Sunday. Thresholds sized to THAT cadence: a weekly job is legitimately seven
# days old the moment before it runs, so anything at or below the gap would
# alarm on a healthy job every cycle and never on a fault. gen-cron refuses those.
[template:weekly]
	send_schedule  = 21 2 * * 0
	prefix         = automated_weekly_
	notify_word    = snapshot
	prune_schedule = 41 2 * * 0
	pattern        = automated_weekly
	gfs            = yes
	keep           = 4
	quiesce        = auto,degrade
	monitor_warn   = 8d
	monitor_crit   = 10d

# ---- MONTHLY ----------------------------------------------------------------
[template:monthly]
	send_schedule  = 31 3 1 * *
	prefix         = automated_monthly_
	notify_word    = snapshot
	prune_schedule = 51 3 1 * *
	pattern        = automated_monthly
	gfs            = yes
	keep           = 12
	quiesce        = auto,degrade
	monitor_warn   = 35d
	monitor_crit   = 40d

# ---- WHAT EVERY GENERATED SECTION INHERITS ----------------------------------
# NO [prune] BLOCK: each tier prunes its own family through its own
# prune_schedule and its own -G. A [prune:] section could not express this shape
# anyway -- its gfs is ONE combined -G line over ONE family, and a
# [prune:<path>] header can exist only once per dataset.
[dataset]
	use_template = hourly,daily,weekly,monthly

# ---- RESERVED FAMILIES ------------------------------------------------------
# __replicate_ is pvesr's, vzdump is the backup job's, __migration__ belongs to
# a live migration. None of them ours to delete, so they are fenced rather than
# left to a counter that does not know what they are.
[excluded:__replicate_]
	keep = 2

[excluded:vzdump]
	keep = 2

[excluded:__migration__]
	keep = 2
