# Built-in profile: m12w4d7h24-age -- 12 months, 4 weeks, 7 days, 24 hours,
# BY AGE.
#
# THE LEAN SIBLING of y5m12d31h24-age, and the age counterpart of
# m12w4d7h24-gfs. Same four families, same coherence rule; what differs is how
# the bound is drawn.
#
#   flat count   -H24   the 24 newest
#   ladder    -G -H24   one per hourly bucket, for 24 hours
#   age          -h24   everything younger than 24 hours   <- this profile
#
# delsnaps' lowercase flags sum to a single threshold date and everything older
# than it is deleted; whatever is younger stays, however many there are.
#
# WHERE AGE AND COUNT PART COMPANY, measured on identical data (three snapshots
# inside one hour, which is what a catch-up burst looks like): flat kept two,
# the ladder kept one, age kept all three.
#
#   after a BURST age bounds the WINDOW but not the COUNT -- every snapshot from
#   the burst survives while it is young;
#   after DOWNTIME age keeps FEWER, because the survivors aged out while the job
#   was not running. An hourly family silent for two days is simply empty the
#   next morning, where a flat count would still hold its 24 from before.
#
# The second is the one to think about, and the staleness monitor is what tells
# you -- which is why every tier here carries monitor_warn/monitor_crit.
#
# WHICH TIERS ARE COHERENT: every tier except hourly, via `quiesce = auto`, and
# for the same reason as everywhere else in the catalogue -- separate families
# let the expensive tiers be expensive only as often as they run.
#
# WHAT A FAILED FREEZE COSTS: a name, not a snapshot. `,degrade` stamps the set
# as `automated_<tier>_crash_<timestamp>` and exits 8, so the run is reported.
# See docs/design/quiesce-degrade.md.
#
# NOTHING IS SENT ANYWHERE: no `dst`, and a profile may not carry one. Pair it
# with `--target=''` for the single-host shape.

[profile]
	description = 12 miesiecy + 4 tygodnie + 7 dni + 24 godziny WIEKU, cztery rodziny
	version     = 1

# ---- HOURLY: cheap, frequent, NEVER quiesced --------------------------------
[template:hourly]
	send_schedule  = 1 * * * *
	prefix         = automated_hourly_
	notify_word    = snapshot
	prune_schedule = 21 * * * *
	pattern        = automated_hourly
	retain         = -h24
	monitor_warn   = 90m
	monitor_crit   = 150m

# ---- DAILY ------------------------------------------------------------------
[template:daily]
	send_schedule  = 11 1 * * *
	prefix         = automated_daily_
	notify_word    = snapshot
	prune_schedule = 31 1 * * *
	pattern        = automated_daily
	retain         = -d7
	quiesce        = auto,degrade
	monitor_warn   = 30h
	monitor_crit   = 48h

# ---- WEEKLY -----------------------------------------------------------------
# Sunday. Thresholds sized to THAT cadence: a weekly job is legitimately seven
# days old the moment before it runs, so anything at or below the gap would
# alarm on a healthy job every cycle and never on a fault. gen-cron refuses those.
[template:weekly]
	send_schedule  = 21 2 * * 0
	prefix         = automated_weekly_
	notify_word    = snapshot
	prune_schedule = 41 2 * * 0
	pattern        = automated_weekly
	retain         = -w4
	quiesce        = auto,degrade
	monitor_warn   = 8d
	monitor_crit   = 10d

# ---- MONTHLY ----------------------------------------------------------------
[template:monthly]
	send_schedule  = 31 3 1 * *
	prefix         = automated_monthly_
	notify_word    = snapshot
	prune_schedule = 51 3 1 * *
	pattern        = automated_monthly
	retain         = -m12
	quiesce        = auto,degrade
	monitor_warn   = 35d
	monitor_crit   = 40d

# ---- WHAT EVERY GENERATED SECTION INHERITS ----------------------------------
# NO [prune] BLOCK: each tier prunes its own family through its own
# prune_schedule.
[dataset]
	use_template = hourly,daily,weekly,monthly

# ---- RESERVED FAMILIES ------------------------------------------------------
# __replicate_ is pvesr's, vzdump is the backup job's, __migration__ belongs to
# a live migration. None of them ours to delete, so they are fenced rather than
# left to a counter that does not know what they are.
[excluded:__replicate_]
	keep = 2

[excluded:vzdump]
	keep = 2

[excluded:__migration__]
	keep = 2
