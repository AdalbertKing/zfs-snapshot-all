# Built-in profile: M12W4D7H24 -- ONE family, one GFS ladder over it:
# one an hour for 24 hours, one a day for 7 days, one a week for 4 weeks, one a month
# for 12 months. Owner 2026-10-22: "bez wielu szczebli, bez rodziny, z samym prefiksem
# automated, ale GFS h24d7w4m12 -- GFS będzie dbał, żeby zostawały odpowiednie migawki,
# ale nie nazywamy ich specjalnie".
#
# UPPERCASE = one family (profiles/README.md). One tier makes every snapshot
# (automated_<timestamp>, hourly) and its ONE prune line counts the whole ladder:
# delsnaps -G -H24 -D7 -W4 -M12 over pattern automated_.
#
# What one family costs, said here so nobody finds it later:
#   - NO quiescing. The daily, weekly and monthly survivors ARE hourly snapshots, so a
#     freeze would be twenty-four a day or none; this profile takes none.
#   - A LADDER IS ANCHORED ON THE WALL CLOCK. After an outage longer than a rung's
#     reach, that rung's survivors are deleted on the next prune (measured 2026-09-04:
#     -G -H24 -D7 kept 0 of 6 after 30 days). After a month off only the monthly rung
#     keeps anything. The flat profiles (default, full, d7h24, d30h24) do not do that.
#   - pattern automated_ matches every automated_* family on the dataset, so this
#     relationship must not share datasets with a per-tier one; the wizard checks it at
#     Utwórz ("[drabina]").
[profile]
	description = jedna rodzina automated_, drabina GFS: 24 godz., 7 dni, 4 tyg., 12 mies.; bez zamrazania
	version     = 1

# ---- THE ONE TIER: makes every snapshot and prunes the whole ladder -------------
[template:hourly]
	send_schedule  = 1 * * * *
	prefix         = automated_
	notify_word    = snapshot
	prune_schedule = 21 * * * *
	pattern        = automated_
	gfs            = yes
	retain         = -H24 -D7 -W4 -M12
	monitor_warn   = 90m
	monitor_crit   = 150m

[dataset]
	use_template = hourly

# ---- RESERVED FAMILIES ------------------------------------------------------
# __replicate_ is pvesr's, vzdump is the backup job's, __migration__ belongs to
# a live migration. None of them ours to delete, so they are fenced rather than
# left to a counter that does not know what they are.
[excluded:__replicate_]
	keep = 2
[excluded:vzdump]
	keep = 2
[excluded:__migration__]
	keep = 2
