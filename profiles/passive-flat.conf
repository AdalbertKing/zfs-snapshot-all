# Built-in profile: passive-flat -- adopt somebody else's family, on a FLAT host.
#
# WHY THIS FILE EXISTS. `passive` adopts a family another tool stamps, and that
# was the only prefixless profile we shipped -- but it is a LADDER: its send tier
# does not prune, four `keep_*` tiers do. A collector whose other relationships
# use a family-per-tier profile (m12w4d7h24-gfs, m31w4d7h24 ...) reads as FLAT,
# and activation refuses a ladder profile there, correctly: the standard ladder
# is not installed on top of a flat host, so the relationship would copy forever
# and delete nothing. Measured on pve10, 2026-09-20, on a real sync relationship
# from a source that already carries its own `automated_*` family:
#
#   --profile=d30      -> gen-cron refuses: the tier would create 'automated_...'
#                         and prune 'automated_daily' -- the adopted family grows
#                         without bound (the coherence rule doing its job);
#   --profile=passive  -> activation refuses: "This host reads as FLAT ... NO
#                         RETENTION AT ALL".
#
# So passive consumption was unreachable on a flat collector. This profile is the
# missing piece and nothing more: the same adoption `passive` does, in the shape a
# flat host accepts -- ONE tier that both consumes and prunes.
#
# WHY ONE TIER, AND WHY ITS PATTERN IS 'automated'. Prefixless means this profile
# stamps nothing, so its prune cannot name a family of OURS -- it names the one it
# ADOPTS, and that family is automated_* because the source runs this same
# software. 'pattern = -' (CONFIG v4's "no pattern") is refused here, measured on
# pve10 2026-09-20: a tier carrying send_schedule is read as creating
# 'automated_...', so gen-cron's coherence rule says "nothing this tier creates is
# ever pruned by this tier, and the created family grows without bound". The
# pattern must be a prefix of what the tier would stamp, and 'automated' is both
# that and the truth about what is being kept.
#
# ONE tier, because a prefixless prune cannot tell the adopted tiers apart: four
# such tiers would all match the SAME snapshots with four different counters and
# the smallest would win -- four lines fighting over one family is not four tiers,
# it is one tier with a bug. So: one family, one counter, and the counter is FLAT.
# A count never deletes a family for being old, which matters most for the
# machines a passive relationship tends to watch (see the measurement in
# m31w4d7h24.conf -- a ladder wiped 6 of 6 after a month of downtime, silently).
#
# THE TIER IS NAMED _hourly AND THAT IS NOT COSMETIC: the retention letter is
# derived from the last word of the template name (profile_keep_to_retain), so a
# tier called passive_flat would have no letter and the profile would not render.
#
# THE NUMBER IS A STARTING POINT, not a law: 168 = seven days of hourlies from a
# source that snapshots every hour. Profiles are admin TEMPLATES -- copy this file
# under a new name and change `keep` rather than arguing with it.
#
# WHAT IT DOES NOT DO: it creates nothing on the source and prunes nothing there
# (retention on the source stays with whoever owns that family), and there is no
# freeze of ours to take, so it declares no quiesce -- same as `passive`.

[profile]
	description = pasywne przejmowanie cudzej rodziny, bezprefiksowo, na kolektorze PLASKIM (jeden szczebel, licznik sztuk)
	version     = 1

# ---- ADOPT AND PRUNE IN ONE TIER (what "flat" means) ------------------------
# No `prefix` line at all, and that omission is the declaration -- the same one
# `passive` makes. A blank `prefix =` is still refused; a value, an omitted field
# and an empty one are three distinct states on purpose.
[template:passive_flat_hourly]
	send_schedule  = 1 * * * *
	notify_word    = backup
	prune_schedule = 21 * * * *
	pattern        = automated
	keep           = 168
	monitor_warn   = 90m
	monitor_crit   = 150m

# NO [prune] BLOCK, and that omission is the flat shape itself: a [prune]
# fragment is what makes a profile a LADDER (profile_declares_ladder reads
# exactly that), and a ladder is what a flat host refuses. The tier above
# already carries prune_schedule/pattern/keep, so it prunes what it consumes --
# which is the whole definition of flat.
[dataset]
	use_template = passive_flat_hourly

# ---- RESERVED FAMILIES -------------------------------------------------------
# Identical to `default` and `passive` on purpose: these are config-wide floors,
# not this profile's opinion. Two profiles declaring the same family with the
# same keep deduplicate; a DIFFERENT keep must be refused, because one config
# cannot fence a family two ways.
[excluded:__replicate_]
	keep = 2

[excluded:vzdump]
	keep = 2

[excluded:__migration__]
	keep = 2
