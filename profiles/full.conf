# Built-in profile: full -- 24 hours + 7 days + 4 weeks + 12 months + 5 years, FLAT.
# Owner 2026-10-22: "h24d7w4m12y5 - płaski - tzw full". The long-history sibling of
# default (h24d7w4m3): the same four tiers and schedules, twelve monthly instead of
# three, and a yearly tier on top. Every tier makes and counts its own family with a
# flat count, which is the only counting that survives a long outage (see default.conf
# and profiles/README.md).
[profile]
	description = pelny: 5 lat + 12 miesiecy + 4 tygodnie + 7 dni + 24 godziny, kazdy szczebel swoja rodzina, liczenie plaskie
	version     = 1

# ---- HOURLY: cheap, frequent, NEVER quiesced --------------------------------
[template:hourly]
	send_schedule  = 1 * * * *
	prefix         = automated_hourly_
	notify_word    = snapshot
	prune_schedule = 21 * * * *
	pattern        = automated_hourly
	keep           = 24
	monitor_warn   = 90m
	monitor_crit   = 150m

# ---- DAILY ------------------------------------------------------------------
[template:daily]
	send_schedule  = 11 1 * * *
	prefix         = automated_daily_
	notify_word    = snapshot
	prune_schedule = 31 1 * * *
	pattern        = automated_daily
	keep           = 7
	quiesce        = auto,degrade
	monitor_warn   = 30h
	monitor_crit   = 48h

# ---- WEEKLY -----------------------------------------------------------------
# Sunday. Thresholds sized to THAT cadence: a weekly job is legitimately seven
# days old the moment before it runs, so anything at or below the gap would
# alarm on a healthy job every cycle and never on a fault. gen-cron refuses those.
[template:weekly]
	send_schedule  = 21 2 * * 0
	prefix         = automated_weekly_
	notify_word    = snapshot
	prune_schedule = 41 2 * * 0
	pattern        = automated_weekly
	keep           = 4
	quiesce        = auto,degrade
	monitor_warn   = 8d
	monitor_crit   = 10d

# ---- MONTHLY ----------------------------------------------------------------
[template:monthly]
	send_schedule  = 31 3 1 * *
	prefix         = automated_monthly_
	notify_word    = snapshot
	prune_schedule = 51 3 1 * *
	pattern        = automated_monthly
	keep           = 12
	quiesce        = auto,degrade
	monitor_warn   = 35d
	monitor_crit   = 40d

# ---- YEARLY: once a year, quiesced; its own minute (the monthly runs at 03:31 on
# the 1st, and the 1st of January is also a 1st) ------------------------------
[template:yearly]
	send_schedule  = 41 4 1 1 *
	prefix         = automated_yearly_
	notify_word    = snapshot
	prune_schedule = 1 5 1 1 *
	pattern        = automated_yearly
	keep           = 5
	quiesce        = auto,degrade
	monitor_warn   = 400d
	monitor_crit   = 430d

# ---- WHAT EVERY GENERATED SECTION INHERITS ----------------------------------
# NO [prune] BLOCK: each tier prunes its own family through its own
# prune_schedule and its own flat count. A [prune:] section could not express this
# shape anyway -- it is ONE line over ONE family, and a
# [prune:<path>] header can exist only once per dataset.
[dataset]
	use_template = hourly,daily,weekly,monthly,yearly

# ---- RESERVED FAMILIES ------------------------------------------------------
# __replicate_ is pvesr's, vzdump is the backup job's, __migration__ belongs to
# a live migration. None of them ours to delete, so they are fenced rather than
# left to a counter that does not know what they are.
[excluded:__replicate_]
	keep = 2

[excluded:vzdump]
	keep = 2

[excluded:__migration__]
	keep = 2
