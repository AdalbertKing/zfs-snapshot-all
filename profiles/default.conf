# Built-in profile: default -- the factory default (what a relationship gets when
# nobody chose a profile): 12 months + 4 weeks + 7 days + 24 hours.
#
# X27 (owner 2026-10-14, "a"): EVERY TIER MAKES AND COUNTS ITS OWN -- four families,
# each on its own GFS ladder; the same numbers the old one-family ladder kept, the
# same body as m12w4d7h24-gfs. The old ladder shape (one hourly family, keep_* tiers
# picking from it) has no place in a relationship's [relation:] block.
[profile]
	description = fabryczny: 12 miesiecy + 4 tygodnie + 7 dni + 24 godziny, kazdy szczebel swoja rodzina
	version     = 1

# ---- HOURLY: cheap, frequent, NEVER quiesced --------------------------------
[template:hourly]
	send_schedule  = 1 * * * *
	prefix         = automated_hourly_
	notify_word    = snapshot
	prune_schedule = 21 * * * *
	pattern        = automated_hourly
	gfs            = yes
	keep           = 24
	monitor_warn   = 90m
	monitor_crit   = 150m

# ---- DAILY ------------------------------------------------------------------
[template:daily]
	send_schedule  = 11 1 * * *
	prefix         = automated_daily_
	notify_word    = snapshot
	prune_schedule = 31 1 * * *
	pattern        = automated_daily
	gfs            = yes
	keep           = 7
	quiesce        = auto,degrade
	monitor_warn   = 30h
	monitor_crit   = 48h

# ---- WEEKLY -----------------------------------------------------------------
# Sunday. Thresholds sized to THAT cadence: a weekly job is legitimately seven
# days old the moment before it runs, so anything at or below the gap would
# alarm on a healthy job every cycle and never on a fault. gen-cron refuses those.
[template:weekly]
	send_schedule  = 21 2 * * 0
	prefix         = automated_weekly_
	notify_word    = snapshot
	prune_schedule = 41 2 * * 0
	pattern        = automated_weekly
	gfs            = yes
	keep           = 4
	quiesce        = auto,degrade
	monitor_warn   = 8d
	monitor_crit   = 10d

# ---- MONTHLY ----------------------------------------------------------------
[template:monthly]
	send_schedule  = 31 3 1 * *
	prefix         = automated_monthly_
	notify_word    = snapshot
	prune_schedule = 51 3 1 * *
	pattern        = automated_monthly
	gfs            = yes
	keep           = 12
	quiesce        = auto,degrade
	monitor_warn   = 35d
	monitor_crit   = 40d

# ---- WHAT EVERY GENERATED SECTION INHERITS ----------------------------------
# NO [prune] BLOCK: each tier prunes its own family through its own
# prune_schedule and its own -G. A [prune:] section could not express this shape
# anyway -- its gfs is ONE combined -G line over ONE family, and a
# [prune:<path>] header can exist only once per dataset.
[dataset]
	use_template = hourly,daily,weekly,monthly

# ---- RESERVED FAMILIES ------------------------------------------------------
# __replicate_ is pvesr's, vzdump is the backup job's, __migration__ belongs to
# a live migration. None of them ours to delete, so they are fenced rather than
# left to a counter that does not know what they are.
[excluded:__replicate_]
	keep = 2

[excluded:vzdump]
	keep = 2

[excluded:__migration__]
	keep = 2
