# Built-in profile: default -- the factory default (what a relationship gets when
# nobody chose a profile): 3 months + 4 weeks + 7 days + 24 hours.
#
# X27 (owner 2026-10-14, "a"): EVERY TIER MAKES AND COUNTS ITS OWN -- four families.
# The old ladder shape (one hourly family, keep_* tiers picking from it) has no place
# in a relationship's [relation:] block.
#
# FLAT, not GFS (owner 2026-10-22: "Zmień go z GFS na płaski i daj mu m3"). A GFS rung
# is anchored on the wall clock, so after a long outage -- a source switched off for a
# month while the collector keeps pruning its copies -- every tier whose reach is
# shorter than the outage is deleted on the next prune, rc 0, no mail (measured
# 2026-09-04: -G -H24 -D7 kept 0 of 6 after 30 days; profiles/README.md). A flat count
# keeps the N newest whatever their age: nothing new arrives, nothing is pushed out.
[profile]
	description = fabryczny: 3 miesiace + 4 tygodnie + 7 dni + 24 godziny, kazdy szczebel swoja rodzina, liczenie plaskie
	version     = 1

# ---- HOURLY: cheap, frequent, NEVER quiesced --------------------------------
[template:hourly]
	send_schedule  = 1 * * * *
	prefix         = automated_hourly_
	notify_word    = snapshot
	prune_schedule = 21 * * * *
	pattern        = automated_hourly
	keep           = 24
	monitor_warn   = 90m
	monitor_crit   = 150m

# ---- DAILY ------------------------------------------------------------------
[template:daily]
	send_schedule  = 11 1 * * *
	prefix         = automated_daily_
	notify_word    = snapshot
	prune_schedule = 31 1 * * *
	pattern        = automated_daily
	keep           = 7
	quiesce        = auto,degrade
	monitor_warn   = 30h
	monitor_crit   = 48h

# ---- WEEKLY -----------------------------------------------------------------
# Sunday. Thresholds sized to THAT cadence: a weekly job is legitimately seven
# days old the moment before it runs, so anything at or below the gap would
# alarm on a healthy job every cycle and never on a fault. gen-cron refuses those.
[template:weekly]
	send_schedule  = 21 2 * * 0
	prefix         = automated_weekly_
	notify_word    = snapshot
	prune_schedule = 41 2 * * 0
	pattern        = automated_weekly
	keep           = 4
	quiesce        = auto,degrade
	monitor_warn   = 8d
	monitor_crit   = 10d

# ---- MONTHLY ----------------------------------------------------------------
[template:monthly]
	send_schedule  = 31 3 1 * *
	prefix         = automated_monthly_
	notify_word    = snapshot
	prune_schedule = 51 3 1 * *
	pattern        = automated_monthly
	keep           = 3
	quiesce        = auto,degrade
	monitor_warn   = 35d
	monitor_crit   = 40d

# ---- WHAT EVERY GENERATED SECTION INHERITS ----------------------------------
# NO [prune] BLOCK: each tier prunes its own family through its own
# prune_schedule and its own flat count. A [prune:] section could not express this
# shape anyway -- it is ONE line over ONE family, and a
# [prune:<path>] header can exist only once per dataset.
[dataset]
	use_template = hourly,daily,weekly,monthly

# ---- RESERVED FAMILIES ------------------------------------------------------
# __replicate_ is pvesr's, vzdump is the backup job's, __migration__ belongs to
# a live migration. None of them ours to delete, so they are fenced rather than
# left to a counter that does not know what they are.
[excluded:__replicate_]
	keep = 2

[excluded:vzdump]
	keep = 2

[excluded:__migration__]
	keep = 2
