# Built-in profile: default -- hourly create, one GFS ladder over that family.
#
# THE LADDER SHAPE, and the one profile named in prose rather than by retention.
# `profiles/README.md` has the naming rule the retention-named files follow
# (lowercase = one family per tier, uppercase = ladder); this one predates it and
# keeps its name.
#
# NOTHING HERE IS QUIESCED, and that is a property of the shape rather than a
# policy choice: on a ladder the "daily" snapshot IS an hourly snapshot the
# counter decided to keep, so freezing it would mean freezing all twenty-four --
# every guest on the host stalled 24 times a day. A profile that wants a coherent
# daily copy needs separate families: d30h24-gfs, d7h24-gfs, d30 or prod.
#
# ONE FILE, NATIVE NAMES. An operator changes a retention here and nowhere
# else; the three internal artifacts the runtime consumes are produced from
# this by lib-profile.sh, and are a compilation target rather than something to
# edit.
#
# WHAT THIS PROFILE ACTUALLY DOES, in one sentence: it creates ONE family of
# snapshots (`automated_hourly_`) and prunes that single family with FOUR
# counters, so the same snapshots serve as hourly, daily, weekly and monthly
# retention. That is the GFS ladder -- `delsnaps.sh -G "automated_" -H24 -D7
# -W4 -M12` in one call -- and it is why creation and retention are separate
# sections here rather than fused into one "tier".

[profile]
	description = godzinowy create + drabina GFS na tej samej rodzinie
	version     = 1

# ---- CREATE ------------------------------------------------------------------
[template:standard_hourly]
	send_schedule  = 1 * * * *
	prefix         = automated_hourly_
	notify_word    = backup

# ---- RETENTION: four counters, ONE family ------------------------------------
# `keep = N` is the ergonomic spelling and is translated here to the flag the
# engine takes (`-H24`), using the tier's cadence -- the last word of its name.
# The generator cannot do that translation itself for a profile, because these
# names are namespaced (`profile__default__keep_hourly`) before they reach it.
#
# Every one of the four names `pattern = automated_hourly`: they prune the same
# family the create tier makes. That is the ladder.
[template:keep_hourly]
	prune_schedule = 21 * * * *
	pattern        = automated_hourly
	keep           = 24
	notify_word    = prune
	monitor_warn   = 90m
	monitor_crit   = 150m

[template:keep_daily]
	prune_schedule = 21 * * * *
	pattern        = automated_hourly
	keep           = 7
	notify_word    = prune

[template:keep_weekly]
	prune_schedule = 21 * * * *
	pattern        = automated_hourly
	keep           = 4
	notify_word    = prune

[template:keep_monthly]
	prune_schedule = 21 * * * *
	pattern        = automated_hourly
	keep           = 12
	notify_word    = prune

# ---- WHAT EVERY GENERATED SECTION INHERITS -----------------------------------
# Pathless on purpose: the path belongs to the relationship, never to the
# policy. These are the defaults copied into each [dataset:]/[prune:] this
# profile creates.
[dataset]
	use_template = standard_hourly

[prune]
	use_template = keep_hourly,keep_daily,keep_weekly,keep_monthly
	gfs          = yes
	gfs_pattern  = automated_

# ---- RESERVED FAMILIES -------------------------------------------------------
# The floors every deployment on this estate carries. They were a hardcoded
# list inside zfs-backup.sh until 2026-08-25, which made the one policy every
# relationship runs under the one policy no profile could describe.
#
# NOT namespaced, deliberately: these are config-wide and two profiles naming
# __replicate_ mean the same family. So they compose by AGREEMENT (identical
# declarations deduplicate; conflicting ones must be refused), never by
# concatenation the way templates do.
#
# __replicate_ is pvesr's, vzdump is the backup job's, __migration__ belongs to
# a live migration. None of them are ours to delete.
[excluded:__replicate_]
	keep = 2

[excluded:vzdump]
	keep = 2

[excluded:__migration__]
	keep = 2
