# Built-in profile: d30h24 -- 30 daily, 24 hourly. A month of cover.
#
# THE FILE NAME IS THE RETENTION: thirty daily and twenty-four hourly, and
# nothing else. No weekly, no monthly -- if the name does not claim it, the
# profile does not keep it.
#
# THE CASE OF THE NAME IS THE SHAPE (owner rule, 2026-08-27):
#
#   lowercase `d30h24` -> TWO FAMILIES. `automated_hourly_` is stamped every
#   hour and pruned to 24; `automated_daily_` is stamped once a day and pruned
#   to 30. Two independent series, each with its own prefix, its own cadence and
#   its own retention -- the shape `prod` uses.
#
#   uppercase `D30H24` would be the GFS ladder: ONE family stamped hourly, with
#   the daily counter re-using the snapshots the hourly counter already holds.
#   That is what `default` does. No uppercase profile is shipped yet; the case
#   distinction exists so that when one is, an administrator reading `ls` can
#   tell the two shapes apart without opening either file.
#
# WHY THIS ONE IS NOT A LADDER: because a ladder cannot answer the coherence
# question. On a ladder the "daily" snapshot IS an hourly snapshot the counter
# decided to keep, so freezing the daily one means freezing all twenty-four --
# which stalls every guest on the host 24 times a day. Two families let the
# expensive tier be expensive once.
#
# WHICH TIER IS COHERENT: the daily one. `quiesce = auto` freezes the guest
# (qemu-guest-agent for a VM, a flush for a container) so the snapshot is
# filesystem-consistent. The hourly tier is deliberately NOT quiesced -- it is
# the cheap, frequent one, and the coherent copy it would buy already exists
# once a day.
#
# WHAT A FAILED FREEZE COSTS: nothing but a name. Since the owner's direction of
# 2026-08-27 a freeze that cannot be taken no longer means no snapshot -- the
# set is stamped anyway as `automated_daily_crash_<timestamp>`, so the
# consistency class is readable six months later, and the run exits 8 so cron
# reports it instead of filing it as clean. `,degrade` below asks for exactly
# what it would get anyway; it is written out because on a cron line read at 3am
# spelled-out intent beats an implied default. `,strict` is the opposite and the
# only qualifier that still changes anything: no snapshot, run fails.
# See docs/design/quiesce-degrade.md.
#
# WHEN TO REACH FOR IT: the ordinary choice for data you would miss. A month is
# long enough to notice a slow corruption and short enough that nobody has to
# think about pool growth. For a year on a single family, `default`.

[profile]
	description = 30 dobowych + 24 godzinowe, dwie rodziny, dobowe koherentne
	version     = 1

# ---- HOURLY: cheap, frequent, NOT quiesced -----------------------------------
[template:hourly]
	send_schedule  = 1 * * * *
	prefix         = automated_hourly_
	notify_word    = snapshot
	prune_schedule = 21 * * * *
	pattern        = automated_hourly
	keep           = 24
	monitor_warn   = 90m
	monitor_crit   = 150m

# ---- DAILY: the coherent one -------------------------------------------------
[template:daily]
	send_schedule  = 11 1 * * *
	prefix         = automated_daily_
	notify_word    = snapshot
	prune_schedule = 31 1 * * *
	pattern        = automated_daily
	keep           = 30
	quiesce        = auto,degrade
	monitor_warn   = 30h
	monitor_crit   = 48h

# ---- WHAT EVERY GENERATED SECTION INHERITS -----------------------------------
# NO [prune] BLOCK, and that is the whole difference from a ladder profile: each
# tier prunes its own family through its own prune_schedule, so there is no
# separate ladder section to emit. `default` needs one because its counters
# share a single family.
[dataset]
	use_template = hourly,daily

# ---- RESERVED FAMILIES -------------------------------------------------------
# Config-wide floors, identical in every shipped profile and identical on
# purpose: they are not this profile's opinion. __replicate_ is pvesr's, vzdump
# is the backup job's, __migration__ belongs to a live migration -- none of them
# ours to delete.
[excluded:__replicate_]
	keep = 2

[excluded:vzdump]
	keep = 2

[excluded:__migration__]
	keep = 2
