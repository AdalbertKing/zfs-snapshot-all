# Built-in profile: d30h24 -- 30 daily, 24 hourly. A month of cover.
#
# THE FILE NAME IS THE RETENTION, same rule as every profile named this way:
# thirty daily counters and twenty-four hourly ones, and nothing else. No
# weekly, no monthly -- if the name does not claim it, the profile does not
# keep it.
#
# WHY A MONTH OF DAILIES RATHER THAN WEEKS AND MONTHS: because thirty dailies
# are simpler to reason about than 4 weekly + 12 monthly, and on a single family
# they cost almost nothing extra -- a GFS ladder keeps the SAME snapshots under
# several counters, so raising the daily count reuses snapshots the hourly
# counter is already holding rather than stamping new ones.
#
# WHEN TO REACH FOR IT: the ordinary choice for data you would miss. A month is
# long enough to notice a slow corruption and short enough that nobody has to
# think about pool growth. For a year, `default` adds weekly and monthly
# counters on top of the same family.

[profile]
	description = 30 dobowych + 24 godzinowe, jedna rodzina, drabina GFS
	version     = 1

# ---- CREATE ------------------------------------------------------------------
[template:hourly_create]
	send_schedule  = 1 * * * *
	prefix         = automated_hourly_
	notify_word    = backup

# ---- RETENTION: two counters, ONE family -------------------------------------
[template:keep_hourly]
	prune_schedule = 21 * * * *
	pattern        = automated_hourly
	keep           = 24
	notify_word    = prune
	monitor_warn   = 90m
	monitor_crit   = 150m

[template:keep_daily]
	prune_schedule = 21 * * * *
	pattern        = automated_hourly
	keep           = 30
	notify_word    = prune

# ---- WHAT EVERY GENERATED SECTION INHERITS -----------------------------------
[dataset]
	use_template = hourly_create

[prune]
	use_template = keep_hourly,keep_daily
	gfs          = yes
	gfs_pattern  = automated_

# ---- RESERVED FAMILIES -------------------------------------------------------
[excluded:__replicate_]
	keep = 2

[excluded:vzdump]
	keep = 2

[excluded:__migration__]
	keep = 2
