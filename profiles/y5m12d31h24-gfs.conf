# Built-in profile: y5m12d31h24-gfs -- 5 yearly, 12 monthly, 31 daily, 24 hourly.
#
# THE NAME IS THE RETENTION, and the case is the shape: lowercase means FOUR
# FAMILIES, one per tier, each with its own prefix, its own counter and its own
# `delsnaps` line. See profiles/README.md.
#
# FOUR FAMILIES, AND A LADDER ON EACH. Both halves are deliberate and neither
# is available without the other.
#
# Four families, because ONE family cannot be quiesced per tier: on a single
# family the "daily" snapshot IS one of the twenty-four hourly ones a counter
# decided to keep, so freezing the daily set means freezing all twenty-four --
# every guest on the host stalled 24 times a day. Separate families let the
# expensive tiers be expensive exactly as often as they run.
#
# A ladder on each (`gfs = yes` per tier, one -G line per family), because a
# flat count bounds retention by NUMBER and a ladder bounds it by TIME. After a
# catch-up burst those differ sharply: measured on pve9, 2026-09-01, with three
# snapshots taken inside one hour, flat -H2 kept the two newest -- two seconds
# of history -- while -G -H2 kept one per hourly bucket. `keep = 24` here means
# "one an hour for the last twenty-four hours", not "the twenty-four newest",
# and that is the promise the file name makes.
#
# WHICH TIERS ARE COHERENT: every tier except hourly, via `quiesce = auto`
# (a qemu-guest-agent freeze for a VM, a flush for a container). The hourly tier
# is deliberately never quiesced -- that is the catalogue-wide rule, and it is
# what makes an hourly cadence affordable at all.
#
# WHAT A FAILED FREEZE COSTS: a name, not a snapshot. `,degrade` takes the set
# anyway, crash-consistent, stamped `automated_<tier>_crash_<timestamp>`, and
# exits 8 so cron reports it instead of filing it as clean. `,strict` is the way
# back for data where a crash-consistent copy is genuinely worthless.
# See docs/design/quiesce-degrade.md.
#
# NOTHING IS SENT ANYWHERE. There is no `dst` here and there must not be -- a
# profile never says where to; that belongs to the relationship. Used with a
# [dataset:] that carries no `dst`, each tier creates its family and prunes it
# in place, and the source keeps everything. That is the single-host shape.
#
# WHEN TO REACH FOR IT: a host whose own snapshots are the whole backup story --
# no peer, no replica -- and where a year of history is worth the space. For a
# month, d30h24; for a week, d7h24; for a copy that goes somewhere, pair it with
# a relationship instead.

[profile]
	description = 5 rocznych + 12 miesiecznych + 31 dobowych + 24 godzinowe, cztery rodziny, wszystkie poza godzinowa koherentne
	version     = 1

# ---- HOURLY: cheap, frequent, NEVER quiesced --------------------------------
[template:hourly]
	send_schedule  = 1 * * * *
	prefix         = automated_hourly_
	notify_word    = snapshot
	prune_schedule = 21 * * * *
	pattern        = automated_hourly
	gfs            = yes
	keep           = 24
	monitor_warn   = 90m
	monitor_crit   = 150m

# ---- DAILY: the first coherent tier -----------------------------------------
[template:daily]
	send_schedule  = 11 1 * * *
	prefix         = automated_daily_
	notify_word    = snapshot
	prune_schedule = 31 1 * * *
	pattern        = automated_daily
	gfs            = yes
	keep           = 31
	quiesce        = auto,degrade
	monitor_warn   = 30h
	monitor_crit   = 48h

# ---- MONTHLY ----------------------------------------------------------------
# Runs on the 1st. The staleness thresholds are sized to THAT cadence, not to a
# comfortable-looking number: a monthly job is legitimately 31 days old the
# moment before it runs, so a threshold at or below the gap would alarm on a
# healthy job every cycle and never on a fault. gen-cron refuses those outright.
[template:monthly]
	send_schedule  = 21 2 1 * *
	prefix         = automated_monthly_
	notify_word    = snapshot
	prune_schedule = 41 2 1 * *
	pattern        = automated_monthly
	gfs            = yes
	keep           = 12
	quiesce        = auto,degrade
	monitor_warn   = 35d
	monitor_crit   = 40d

# ---- YEARLY -----------------------------------------------------------------
# Runs on 1 January. Same threshold reasoning, one order of magnitude out.
[template:yearly]
	send_schedule  = 31 3 1 1 *
	prefix         = automated_yearly_
	notify_word    = snapshot
	prune_schedule = 51 3 1 1 *
	pattern        = automated_yearly
	gfs            = yes
	keep           = 5
	quiesce        = auto,degrade
	monitor_warn   = 400d
	monitor_crit   = 430d

# ---- WHAT EVERY GENERATED SECTION INHERITS ----------------------------------
# NO [prune] BLOCK: each tier prunes its own family through its own
# prune_schedule and its own -G, so there is no separate section to emit. A
# [prune:] section could not express this shape anyway -- its gfs is ONE
# combined -G line over ONE family, and a [prune:<path>] header can exist only
# once per dataset, so four ladders on one dataset have nowhere to live there.
[dataset]
	use_template = hourly,daily,monthly,yearly

# ---- RESERVED FAMILIES ------------------------------------------------------
# The floors every deployment on this estate carries, and on a Proxmox host they
# are not optional: __replicate_ is pvesr's, vzdump is the backup job's,
# __migration__ belongs to a live migration. None of them are ours to delete, so
# they are fenced with keep = 2 rather than left to a counter that does not know
# what they are.
[excluded:__replicate_]
	keep = 2

[excluded:vzdump]
	keep = 2

[excluded:__migration__]
	keep = 2
