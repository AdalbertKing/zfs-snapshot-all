# Built-in profile: y5m12d31h24-age -- 5 years, 12 months, 31 days, 24 hours,
# BY AGE.
#
# THE SAME FOUR FAMILIES AS y5m12d31h24, AND A DIFFERENT QUESTION ANSWERED.
# Its sibling bounds each family by TIME BUCKETS (`-G`, one snapshot an hour for
# twenty-four hours). This one bounds each family by AGE: delsnaps' lowercase
# flags sum to a single threshold date, and everything older than it is deleted.
# Whatever is younger stays, however many there are.
#
#   flat count   -H24   the 24 newest
#   ladder    -G -H24   one per hourly bucket, for 24 hours
#   age          -h24   everything younger than 24 hours   <- this profile
#
# WHICH TO REACH FOR. Age answers "how far back can I go", count answers "how
# many do I hold". They agree while the cadence is regular and part company at
# both edges:
#
#   after a BURST (a catch-up run making several snapshots in one hour) age
#   keeps all of them -- they are young -- so the snapshot COUNT is not bounded
#   by anything this profile says. The ladder would have collapsed them to one.
#
#   after DOWNTIME age keeps FEWER, because the survivors aged out while the
#   job was not running: an hourly family silent for two days is simply empty
#   the next morning, where a flat count would still hold its 24 from before
#   the outage.
#
# The second is the one to think about: with age retention, a job that stops
# running eventually leaves nothing behind, and the staleness monitor is what
# tells you -- which is why every tier here carries monitor_warn/monitor_crit.
#
# WHICH TIERS ARE COHERENT: every tier except hourly, via `quiesce = auto`,
# exactly as in the sibling and for the same reason -- separate families let the
# expensive tiers be expensive only as often as they run, and the hourly one is
# never worth a freeze.
#
# WHAT A FAILED FREEZE COSTS: a name, not a snapshot. `,degrade` stamps the set
# anyway as `automated_<tier>_crash_<timestamp>` and exits 8, so the run is
# reported rather than filed as clean. See docs/design/quiesce-degrade.md.
#
# NOTHING IS SENT ANYWHERE: no `dst`, and a profile may not carry one. Pair it
# with `--target=''` for the single-host shape, where the snapshots on the
# source are the whole backup story.

[profile]
	description = 5 lat + 12 miesiecy + 31 dni + 24 godziny WIEKU, cztery rodziny, wszystkie poza godzinowa koherentne
	version     = 1

# ---- HOURLY: cheap, frequent, NEVER quiesced --------------------------------
[template:hourly]
	send_schedule  = 1 * * * *
	prefix         = automated_hourly_
	notify_word    = snapshot
	prune_schedule = 21 * * * *
	pattern        = automated_hourly
	retain         = -h24
	monitor_warn   = 90m
	monitor_crit   = 150m

# ---- DAILY: the first coherent tier -----------------------------------------
[template:daily]
	send_schedule  = 11 1 * * *
	prefix         = automated_daily_
	notify_word    = snapshot
	prune_schedule = 31 1 * * *
	pattern        = automated_daily
	retain         = -d31
	quiesce        = auto,degrade
	monitor_warn   = 30h
	monitor_crit   = 48h

# ---- MONTHLY ----------------------------------------------------------------
# Runs on the 1st. The staleness thresholds are sized to THAT cadence, not to a
# comfortable-looking number: a monthly job is legitimately 31 days old the
# moment before it runs, so a threshold at or below the gap would alarm on a
# healthy job every cycle and never on a fault. gen-cron refuses those outright.
[template:monthly]
	send_schedule  = 21 2 1 * *
	prefix         = automated_monthly_
	notify_word    = snapshot
	prune_schedule = 41 2 1 * *
	pattern        = automated_monthly
	retain         = -m12
	quiesce        = auto,degrade
	monitor_warn   = 35d
	monitor_crit   = 40d

# ---- YEARLY -----------------------------------------------------------------
# Runs on 1 January. Same threshold reasoning, one order of magnitude out.
[template:yearly]
	send_schedule  = 31 3 1 1 *
	prefix         = automated_yearly_
	notify_word    = snapshot
	prune_schedule = 51 3 1 1 *
	pattern        = automated_yearly
	retain         = -y5
	quiesce        = auto,degrade
	monitor_warn   = 400d
	monitor_crit   = 430d

# ---- WHAT EVERY GENERATED SECTION INHERITS ----------------------------------
# NO [prune] BLOCK: each tier prunes its own family through its own
# prune_schedule, so there is no separate section to emit.
[dataset]
	use_template = hourly,daily,monthly,yearly

# ---- RESERVED FAMILIES ------------------------------------------------------
# The floors every deployment on this estate carries, and on a Proxmox host they
# are not optional: __replicate_ is pvesr's, vzdump is the backup job's,
# __migration__ belongs to a live migration. None of them are ours to delete, so
# they are fenced with keep = 2 rather than left to a counter that does not know
# what they are.
[excluded:__replicate_]
	keep = 2

[excluded:vzdump]
	keep = 2

[excluded:__migration__]
	keep = 2
