# Built-in profile: d30h24-gfs -- 30 daily + 24 hourly, each family on its own GFS ladder.
#
# TWO FAMILIES, EACH ON ITS OWN LADDER. The `-gfs` suffix names the counting
# rule -- only the way retention is counted differs. See profiles/README.md for
# the suffix convention (a bare name always means the catalogue-default flat
# count).
#
# A LADDER ON EACH FAMILY (`gfs = yes` per tier, one -G line per prefix),
# because a flat count bounds retention by NUMBER and a ladder bounds it by
# TIME. Measured on pve9 with three snapshots taken inside one hour -- what a
# catch-up burst looks like -- flat `-H2` kept the two newest, two seconds of
# history, while `-G -H2` kept one per hourly bucket.
#
# So `keep = 24` here means "one an hour for the last twenty-four hours", not
# "the twenty-four newest" -- which is what a flat `d30h24` would have meant.
# That profile is not shipped: the owner deleted every non-GFS multi-retention
# profile on 2026-09-04, and the suffix is kept because the bare name stays
# reserved (profiles/README.md).
#
# WHY TWO FAMILIES: one family cannot be quiesced per tier. On a single family
# the "daily" snapshot IS one of the twenty-four hourly ones a counter decided
# to keep, so freezing the daily set means freezing all twenty-four -- every
# guest on the host stalled 24 times a day. Two families let the expensive tier
# be expensive once a day.
#
# WHICH TIER IS COHERENT: the daily one, via `quiesce = auto`. The hourly tier
# is never quiesced -- the catalogue-wide rule, and what makes an hourly cadence
# affordable at all.
#
# WHAT A FAILED FREEZE COSTS: a name, not a snapshot. `,degrade` stamps the set
# as `automated_daily_crash_<timestamp>` and exits 8, so the run is reported
# rather than filed as clean. See docs/design/quiesce-degrade.md.
#
# NOTHING IS SENT ANYWHERE: no `dst`, and a profile may not carry one. Pair it
# with `--target=''` for the single-host shape, or with a relationship to copy.

[profile]
	description = 30 dobowych + 24 godzinowe, dwie rodziny, kazda na wlasnej drabinie
	version     = 1

# ---- HOURLY: cheap, frequent, NOT quiesced -----------------------------------
[template:hourly]
	send_schedule  = 1 * * * *
	prefix         = automated_hourly_
	notify_word    = snapshot
	prune_schedule = 21 * * * *
	pattern        = automated_hourly
	gfs            = yes
	keep           = 24
	monitor_warn   = 90m
	monitor_crit   = 150m

# ---- DAILY: the coherent one -------------------------------------------------
[template:daily]
	send_schedule  = 11 1 * * *
	prefix         = automated_daily_
	notify_word    = snapshot
	prune_schedule = 31 1 * * *
	pattern        = automated_daily
	gfs            = yes
	keep           = 30
	quiesce        = auto,degrade
	monitor_warn   = 30h
	monitor_crit   = 48h

# ---- WHAT EVERY GENERATED SECTION INHERITS -----------------------------------
# NO [prune] BLOCK, and that is the whole difference from a ladder profile: each
# tier prunes its own family through its own prune_schedule, so there is no
# separate ladder section to emit. `default` needs one because its counters
# share a single family.
[dataset]
	use_template = hourly,daily

# ---- RESERVED FAMILIES -------------------------------------------------------
# Config-wide floors, identical in every shipped profile and identical on
# purpose: they are not this profile's opinion. __replicate_ is pvesr's, vzdump
# is the backup job's, __migration__ belongs to a live migration -- none of them
# ours to delete.
[excluded:__replicate_]
	keep = 2

[excluded:vzdump]
	keep = 2

[excluded:__migration__]
	keep = 2
