# Built-in profile: passive -- adopt a family somebody else creates.
#
# Same shape as `default` with one difference that runs through everything: this
# profile CREATES NO PREFIX. A passive relationship consumes the newest snapshot
# that is already there (`snapget -e`), whatever named it, so declaring a prefix
# would be declaring authorship of somebody else's family.
#
# That is also why `pattern = -` on every retention tier: the dash is CONFIG v4's
# "no pattern", i.e. prune the whole family it finds rather than one this profile
# named. Prefixless create and the single-series ladder are Phase 3.5.

[profile]
	description = pasywne przejmowanie cudzej rodziny snapshotow, bezprefiksowo
	version     = 1

# ---- CREATE (adopt, really) --------------------------------------------------
# No `prefix` line at all, and that omission is the declaration -- see the file
# header. A blank `prefix =` is still refused; the three states (a value, an
# omitted field, an empty one) are deliberately distinct.
[template:passive_hourly]
	send_schedule  = 1 * * * *
	notify_word    = backup

# ---- RETENTION: four counters over whatever family was adopted ---------------
[template:passive_keep_hourly]
	prune_schedule = 21 * * * *
	pattern        = -
	keep           = 24
	notify_word    = prune
	monitor_warn   = 90m
	monitor_crit   = 150m

[template:passive_keep_daily]
	prune_schedule = 21 * * * *
	pattern        = -
	keep           = 7
	notify_word    = prune

[template:passive_keep_weekly]
	prune_schedule = 21 * * * *
	pattern        = -
	keep           = 4
	notify_word    = prune

[template:passive_keep_monthly]
	prune_schedule = 21 * * * *
	pattern        = -
	keep           = 12
	notify_word    = prune

[dataset]
	use_template = passive_hourly

[prune]
	use_template = passive_keep_hourly,passive_keep_daily,passive_keep_weekly,passive_keep_monthly
	gfs          = yes

# ---- RESERVED FAMILIES -------------------------------------------------------
# Identical to `default` on purpose: these are config-wide floors, not this
# profile's opinion. Two profiles declaring the same family with the same keep
# deduplicate; declaring it with a DIFFERENT keep must be refused, because one
# config cannot fence a family two ways.
[excluded:__replicate_]
	keep = 2

[excluded:vzdump]
	keep = 2

[excluded:__migration__]
	keep = 2
