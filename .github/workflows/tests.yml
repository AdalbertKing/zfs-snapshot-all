# Dependency-free gate. REV-20260729-001 F5.
#
# Scope is deliberate: everything here needs bash and coreutils and nothing
# else. The suites that need root, a real ZFS pool, mbuffer or a second host are
# NOT run, and no green tick from this workflow should be read as saying they
# were -- see the reminder job at the bottom, which exists to keep that visible
# rather than tucked in a comment.
#
# This does not gate merges. Production here is administered from a phone and
# work lands directly on main by owner decision, so this runs on push as well as
# on pull requests: the point is to find out that something broke, not to stand
# in the way. That trade-off is the F4/F5 discussion, not something this file
# settles on its own.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck-syntax:
    name: bash -n on every tracked shell script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check every tracked *.sh
        run: |
          set -u
          fail=0
          # git ls-files, not find: only what is actually tracked, so a stray
          # scratch file in a working copy can never fail somebody's CI.
          while IFS= read -r f; do
            if bash -n "$f"; then
              echo "ok   $f"
            else
              echo "FAIL $f"; fail=1
            fi
          done < <(git ls-files '*.sh')
          exit "$fail"

  graph:
    name: dependency graph matches the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # REV-20260812-115 F1. This job is the ONLY one that needs history.
          # `--verify` runs reviewctl, which deliberately checks that every
          # commit-bearing review/delivery header names a SHA that exists and is
          # reachable from the published branch -- the REV-067 property that keeps
          # an orphan or never-pushed SHA from passing as evidence. actions/checkout
          # defaults to fetch-depth 1, so in CI those historical commits were simply
          # absent and every one of REV-065..114 reported "not a commit in this
          # repository". The gate was therefore measuring checkout depth, not the
          # repository, and its permanent red masked any real drift it might later
          # catch. Fetch the history instead of weakening the check.
          fetch-depth: 0
      # --verify is the anti-drift assertion: every tracked shell file must be
      # declared in test/deps.conf, every declared suite must exist and be
      # executable, contract membership must be symmetric. An unregistered new
      # script fails here, which is one of F5's acceptance criteria.
      - run: ./test/impact.sh --verify

  suites:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Exactly the suites whose deps.conf entry says `needs = nothing`.
        # Keep this list and that field in step.
        suite: [gencron, impact, quiesce, tune, statekey, join, selfupdate]
    steps:
      - uses: actions/checkout@v4
      # REV-20260812-115 F1, second instance of the same defect. The `impact` suite
      # asserts "the REAL deps.conf is consistent with the REAL tree" by running
      # impact.sh --verify, which reaches reviewctl's reachability check -- so it
      # fails on a shallow checkout for exactly the reason the graph job did.
      # Measured: 58/58 with full history, and the CI log fails on that one
      # assertion out of 58.
      #
      # Done as a conditional STEP, not a conditional fetch-depth. The obvious
      # `fetch-depth: ${{ matrix.suite == 'impact' && 0 || 1 }}` cannot work: in
      # GitHub expressions `&&`/`||` return an operand, and 0 is FALSY, so
      # `true && 0` yields 0, `0 || 1` then yields 1, and the impact leg silently
      # stayed shallow. The CI log said `fetch-depth: 1` on the very run that was
      # supposed to fix it. Only this suite unshallows; the other six do not
      # resolve review SHAs and stay at the default.
      - name: Fetch history (impact resolves durable review SHAs)
        if: matrix.suite == 'impact'
        run: git fetch --prune --unshallow
      - name: Run
        run: |
          case "${{ matrix.suite }}" in
            gencron) ./test/run.sh ;;
            *)       "./test/${{ matrix.suite }}/run.sh" ;;
          esac

  privileged-reminder:
    name: what this workflow did NOT run
    runs-on: ubuntu-latest
    needs: [shellcheck-syntax, graph, suites]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: List the obligations no green tick here can satisfy
        run: |
          echo "This workflow runs only the suites that need nothing but bash."
          echo "A green result does NOT cover:"
          echo
          ./test/impact.sh --all 2>/dev/null \
            | sed -n '/SUITES TO RUN/,$p' \
            | grep -E 'needs (root|a SECOND host)' || true
          echo
          echo "...nor the manual obligations (nonroot-account, force-full,"
          echo "deploy-check-only, monitor-live). Those are run by hand on a"
          echo "real host and recorded in the commit or the review response."
