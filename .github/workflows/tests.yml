# Dependency-free gate. REV-20260729-001 F5.
#
# Scope is deliberate: everything here needs bash and coreutils and nothing
# else. The suites that need root, a real ZFS pool, mbuffer or a second host are
# NOT run, and no green tick from this workflow should be read as saying they
# were -- see the reminder job at the bottom, which exists to keep that visible
# rather than tucked in a comment.
#
# This does not gate merges. Production here is administered from a phone and
# work lands directly on main by owner decision, so this runs on push as well as
# on pull requests: the point is to find out that something broke, not to stand
# in the way. That trade-off is the F4/F5 discussion, not something this file
# settles on its own.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck-syntax:
    name: bash -n on every tracked shell script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check every tracked *.sh
        run: |
          set -u
          fail=0
          # git ls-files, not find: only what is actually tracked, so a stray
          # scratch file in a working copy can never fail somebody's CI.
          while IFS= read -r f; do
            if bash -n "$f"; then
              echo "ok   $f"
            else
              echo "FAIL $f"; fail=1
            fi
          done < <(git ls-files '*.sh')
          exit "$fail"

  graph:
    name: dependency graph matches the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # REV-20260812-115 F1. This job is the ONLY one that needs history.
          # `--verify` runs reviewctl, which deliberately checks that every
          # commit-bearing review/delivery header names a SHA that exists and is
          # reachable from the published branch -- the REV-067 property that keeps
          # an orphan or never-pushed SHA from passing as evidence. actions/checkout
          # defaults to fetch-depth 1, so in CI those historical commits were simply
          # absent and every one of REV-065..114 reported "not a commit in this
          # repository". The gate was therefore measuring checkout depth, not the
          # repository, and its permanent red masked any real drift it might later
          # catch. Fetch the history instead of weakening the check.
          fetch-depth: 0
      # --verify is the anti-drift assertion: every tracked shell file must be
      # declared in test/deps.conf, every declared suite must exist and be
      # executable, contract membership must be symmetric. An unregistered new
      # script fails here, which is one of F5's acceptance criteria.
      - run: ./test/impact.sh --verify

  discover:
    name: which suites need nothing but bash
    runs-on: ubuntu-latest
    outputs:
      suites: ${{ steps.list.outputs.suites }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: echo "suites=$(./test/ci-suites.sh --json)" >> "$GITHUB_OUTPUT"

  suites:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        # DERIVED from deps.conf, never listed here. This used to be seven names
        # inline under a comment claiming they were "exactly the suites whose
        # deps.conf entry says needs = nothing". They were not -- twenty-nine
        # qualify -- and nothing checked it. The twenty-two that fell out did not
        # stop being run; they moved onto the implementer's machine, serially,
        # where a suite costs 13-25 minutes against seconds on a runner. See
        # test/ci-suites.sh, which is now the only list.
        suite: ${{ fromJSON(needs.discover.outputs.suites) }}
    steps:
      # fetch-depth: 0 for two reasons at once. (1) The gate below diffs
      # base...HEAD to decide whether this suite's layer was touched. (2) The
      # `impact` suite runs impact.sh --verify, which reaches reviewctl's SHA
      # reachability check and fails on a shallow checkout (REV-20260812-115 F1).
      # Full history serves both, and replaces the old conditional unshallow step
      # whose `fetch-depth: ${{ ... && 0 || 1 }}` form silently stayed shallow
      # because 0 is falsy in a GitHub expression.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Impact gate: run this suite's body only when the change actually reaches
      # its layer. The matrix of NAMES stays full (every required check still
      # posts), but an untouched suite exits 0 in seconds instead of spending a
      # runner. Selection is the SAME graph impact.sh --verify keeps honest, so a
      # skip here can never disagree with the declared dependency edges.
      #
      # Fail SAFE, never silently narrow coverage: a push to main or a manual
      # dispatch runs everything; a change to the graph or CI plumbing or a hub
      # library runs everything; a file the graph does not know about makes
      # impact.sh emit __ALL__, which also runs everything.
      - name: Gate on impact
        id: gate
        run: |
          set -u
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=1" >> "$GITHUB_OUTPUT"
            echo "event ${{ github.event_name }} -> full battery"; exit 0
          fi
          base='${{ github.event.pull_request.base.sha }}'
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "run=1" >> "$GITHUB_OUTPUT"; echo "no base sha -> full"; exit 0
          fi
          changed="$(git diff --name-only "$base"...HEAD)"
          echo "changed files:"; printf '  %s\n' $changed
          if printf '%s\n' "$changed" | grep -qE '^(test/deps\.conf|test/impact\.sh|test/ci-suites\.sh|\.github/workflows/tests\.yml|lib-zfs-snap\.sh|lib-cron\.sh|lib-scope\.sh)$'; then
            echo "run=1" >> "$GITHUB_OUTPUT"; echo "graph/hub/plumbing change -> full"; exit 0
          fi
          suites="$(./test/impact.sh --suites "$base"...HEAD)" || { echo "run=1" >> "$GITHUB_OUTPUT"; echo "impact.sh failed -> full"; exit 0; }
          if printf '%s\n' "$suites" | grep -qx '__ALL__'; then
            echo "run=1" >> "$GITHUB_OUTPUT"; echo "unknown file in graph -> full"; exit 0
          fi
          if printf '%s\n' "$suites" | grep -qx '${{ matrix.suite }}'; then
            echo "run=1" >> "$GITHUB_OUTPUT"; echo "${{ matrix.suite }} is impacted -> run"
          else
            echo "run=0" >> "$GITHUB_OUTPUT"; echo "${{ matrix.suite }} not impacted by this diff -> skip body (reports green)"
          fi
      - name: Run
        if: steps.gate.outputs.run == '1'
        run: |
          case "${{ matrix.suite }}" in
            gencron) ./test/run.sh ;;
            *)       "./test/${{ matrix.suite }}/run.sh" ;;
          esac

  privileged-reminder:
    name: what this workflow did NOT run
    runs-on: ubuntu-latest
    needs: [shellcheck-syntax, graph, suites]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: List the obligations no green tick here can satisfy
        run: |
          echo "This workflow runs only the suites that need nothing but bash."
          echo "A green result does NOT cover:"
          echo
          ./test/impact.sh --all 2>/dev/null \
            | sed -n '/SUITES TO RUN/,$p' \
            | grep -E 'needs (root|a SECOND host)' || true
          echo
          echo "...nor the manual obligations (nonroot-account, force-full,"
          echo "deploy-check-only, monitor-live). Those are run by hand on a"
          echo "real host and recorded in the commit or the review response."
