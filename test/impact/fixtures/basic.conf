# Minimal graph used by the resolution tests. Files named here must exist in
# the repo root, because --verify checks that -- these are the real ones.

[file:lib-zfs-snap.sh]
suites    = snapsend

[file:snapsend.sh]
suites    = snapsend
manual    = manual-thing
contracts = a-contract

[suite:snapsend]
cmd   = sudo ./test/snapsend/run.sh
needs = root, zfs

[manual:manual-thing]
why = something no suite can reach
how = by hand

[contract:a-contract]
members = snapsend.sh
why = a wrapped prose line follows, and it contains an equals sign so that
      canmount=on would fool a naive parser, but the
      tail of the sentence survives
check = read it
