# prune=no with no monitor thresholds -> the section emits nothing; must be rejected.
[defaults]
	host_label = t
[template:store_hourly]
	prune_schedule = 51 * * * *
	pattern        = automated_hourly
	retain         = -H24
[prune:tank/store/leaf]
	use_template = store_hourly
	prune        = no
	notify       = leaf
