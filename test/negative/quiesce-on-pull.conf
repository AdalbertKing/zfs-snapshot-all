# A pull dataset's snapshot is created on the REMOTE host (snapget.sh ssh's
# over and runs `zfs snapshot` there) -- quiescing the guest that owns it would
# mean freezing across that ssh hop. snapget.sh has no -q support at all, so
# this must be rejected at generation time, not surface as an "illegal option
# -- q" failure in the cron job at 3am.
[defaults]
	host_label = t
[template:hourly]
	send_schedule = 0 * * * *
	prefix        = a_
[dataset:tank/x]
	use_template = hourly
	src          = root@far:tank/x
	quiesce      = agent
