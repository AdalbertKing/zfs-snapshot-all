# A dataset section pushes (dst) or pulls (src), never both -- ambiguous
# direction is rejected rather than silently picked.
[defaults]
	host_label = t
[template:hourly]
	send_schedule = 0 * * * *
	prefix        = a_
[dataset:tank/x]
	use_template = hourly
	dst          = backup/x
	src          = root@far:tank/x
