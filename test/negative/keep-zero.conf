# keep=0 means "retain none of this tier" -- if that is truly meant, it must be
# said with an explicit retain= flag, not a count that reads like a typo.
[defaults]
	host_label = t
[template:hourly]
	prune_schedule = 51 * * * *
	pattern        = automated_hourly_
	keep           = 0
[prune:tank/vm1]
	use_template = hourly
	notify       = x
