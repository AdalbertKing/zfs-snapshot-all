# The same transport cannot come from two places: ssh_port set AND 'flags'
# also carrying -p would let snapsend.sh's last-wins getopts parsing decide
# silently which one wins.
[defaults]
	host_label = t
	dst        = backup@store:tank/x
[template:hourly]
	send_schedule = 0 * * * *
	prefix        = a_
[dataset:tank/x]
	use_template = hourly
	ssh_port     = 2222
	flags        = -p 2200
