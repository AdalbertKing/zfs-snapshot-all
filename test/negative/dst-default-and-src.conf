# A [defaults] dst meant for other push datasets is NOT automatically blanked
# for a pull dataset -- forgetting the explicit 'dst = ' override must be
# caught here, not silently resolved to whichever field happened to win.
[defaults]
	host_label = t
	dst        = backup/other-datasets
[template:hourly]
	send_schedule = 0 * * * *
	prefix        = a_
[dataset:tank/x]
	use_template = hourly
	src          = root@far:tank/x
