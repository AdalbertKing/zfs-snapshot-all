# gfs=yes where every tier has prune=no (monitor-carrier only) leaves nothing
# to build a combined -G ladder from -- must be rejected, not emit a -G line
# with no retain flags at all.
[defaults]
	host_label = t

[template:hourly]
	prune_schedule = 51 * * * *
	pattern        = automated_hourly
	retain         = -H24
	monitor_warn   = 90m
	monitor_crit   = 3h

[prune:tank/store]
	use_template = hourly
	gfs          = yes
	gfs_pattern  = automated_
	prune        = no
	notify       = x
