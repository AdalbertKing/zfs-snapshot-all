# A crontab time specification with the wrong number of fields.
#
# 'send_schedule = 0 2 *' used to generate with rc=0 and emit
#
#   0 2 * echo "$(date -Is) ZFS-JOB BEGIN ..." >>/root/scripts/cron.log; ...
#
# where cron reads the command's own first tokens as the month and day-of-week
# fields. SIX fields is worse than three: the command then starts with a bare
# '*', which the shell glob-expands against the job's working directory before
# running whatever it gets back.
#
# The only gate was crontab(1) at --install time -- the latest possible moment,
# on the far side of the host boundary, and it rejects the WHOLE crontab rather
# than the one line at fault, so a good block goes down with a bad one.
[defaults]
	host_label = testhost
	dst        = backup/store

[template:daily]
	send_schedule  = 0 2 *
	prefix         = automated_daily_
	prune_schedule = 30 2 * * *
	pattern        = automated_daily
	keep           = 7

[dataset:tank/x]
	use_template = daily
	notify       = x
