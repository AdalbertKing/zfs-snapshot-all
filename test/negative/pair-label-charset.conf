# Negative: pair_label must stay inside the label charset -- it becomes an
# -L argument and a directory name under /var/lib/zfs-snapshot-all, so a
# slash (or worse) here is a path, not a name.
[defaults]
	host_label = arc

[template:hourly]
	send_schedule = 59 * * * *
	prefix        = automated_

[dataset:tank/x]
	use_template = hourly
	pair_label   = ../alpha
	notify       = x
