# Basket A4, the [prune:] half (2026-08-21). build_dataset already refuses a
# tier that CREATES one family and prunes another; a [prune:] section does not
# create, so that guard never saw it. But when the tier's template carries a
# 'prefix', the template is declaring which family it is about -- and a pattern
# that cannot see that family means the family grows without bound while this
# prune reports success against whatever DOES match.
[defaults]
	host_label = t
[template:hourly]
	send_schedule  = 37 * * * *
	prefix         = automated_hourly_
	prune_schedule = 51 * * * *
	pattern        = automated_daily
	retain         = -H24
[prune:tank/vm1]
	use_template = hourly
	notify       = x
