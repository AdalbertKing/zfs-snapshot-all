# monitor_warn/monitor_crit written in [defaults], where nothing reads them.
#
# resolve_monitor looks at the section itself and then at the template, and
# stops. So this config used to generate with rc=0 and emit ZERO check-snap-age
# lines: the operator wrote "watch everything" at the top of the file and got no
# monitoring at all. Nothing could report that, because the thing that was
# missing IS the reporting.
#
# The unknown-field guard cannot catch this shape -- the field name is perfectly
# real, it is the POSITION that nobody reads. Which is why the per-kind
# allow-list has to mirror the lookups rather than hand every kind the whole
# policy vocabulary.
[defaults]
	host_label   = testhost
	dst          = backup/store
	monitor_warn = 90m
	monitor_crit = 3h

[template:daily]
	send_schedule  = 0 2 * * *
	prefix         = automated_daily_
	prune_schedule = 30 2 * * *
	pattern        = automated_daily
	keep           = 7

[dataset:tank/x]
	use_template = daily
	notify       = x
