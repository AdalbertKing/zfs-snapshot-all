# Same class of bug as blank-pattern.conf, for 'prefix': a blank value used to
# resolve successfully, producing "snapsend.sh -m ''" -- a bare-timestamp
# snapshot name that no pattern-based delsnaps.sh retention job can ever
# match, so it accumulates forever.
[defaults]
	host_label = t
[template:hourly]
	send_schedule = 1 * * * *
	prefix         =
[dataset:tank/vm1]
	use_template = hourly
