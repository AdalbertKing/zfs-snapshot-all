# A tier that CREATES one snapshot family and PRUNES a different one.
#
# 'prefix' is what snapsend.sh -m stamps onto the snapshots this tier creates;
# 'pattern' is the prefix delsnaps.sh matches when this tier prunes. delsnaps
# matches by PREFIX, so unless the created name starts with the pruned prefix,
# this tier's own snapshots can never be matched by this tier's own retention.
#
# The realistic way in is copy-paste between tiers: the new tier's 'prefix' was
# updated, its 'pattern' was not. Nothing catches it at run time either --
# every send succeeds, every prune succeeds (it just eats the OTHER tier's
# family), and the created family grows without bound until the pool fills.
# That is the same silent shape as REV-20260807-054 (replicated forever, never
# pruned, never watched, always green), so it is refused at generate time.
[defaults]
	host_label = arc
	dst        = root@far:backup/arc

[template:daily]
	send_schedule  = 0 2 * * *
	prefix         = automated_daily_
	prune_schedule = 30 2 * * *
	pattern        = automated_hourly_
	keep           = 7

[dataset:tank/x]
	use_template = daily
	notify       = x
