# delsnaps.sh consumes -p/-k/-c BEFORE the positional dataset list, so a
# transport flag buried in a raw 'retain'/'age' string would land after the
# list and be parsed as a dataset name instead. Named fields exist now --
# reject the raw form instead of emitting a line that fails at runtime.
[defaults]
	host_label = t
[template:daily]
	prune_schedule = 0 0 * * *
	pattern        = automated_daily
	retain         = -c aes128-gcm@openssh.com -D30
[prune:tank/x]
	use_template = daily
