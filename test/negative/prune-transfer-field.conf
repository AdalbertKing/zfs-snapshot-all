# Transfer-side fields written on a [prune:] section, which never sends.
#
# build_prune_section reads no 'flags' (that is the SEND line's, and a prune
# line's SSH options are 'ssh_flags'), no 'prefix', no dst/src, no autotune, no
# quiesce. Accepting them here only ever produced a line that reads like policy
# and changes nothing -- the same silent shape as a field in [defaults] that
# nothing inherits.
#
# 'flags' is the one that costs most: -w, -c, -b and friends are the difference
# between what the operator thinks goes over the wire and what does, and a prune
# section is a plausible-looking place to put them.
[defaults]
	host_label = testhost

[template:keep_hourly]
	prune_schedule = 21 * * * *
	pattern        = automated_hourly
	retain         = -H24

[prune:backup/store]
	use_template = keep_hourly
	recursive    = yes
	flags        = -w
	notify       = store
