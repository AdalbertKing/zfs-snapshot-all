# A gfs ladder that cannot see the tiers feeding it.
#
# Each tier in use_template hands the combined delsnaps.sh -G line a bucket
# letter and a count (-H24 -D7 -W4 here). delsnaps.sh matches by literal
# prefix, so unless each tier's 'pattern' starts with 'gfs_pattern', the ladder
# never sees that tier's snapshots: the count is spent on whatever gfs_pattern
# DOES match, and the tier's own family is pruned by nothing.
#
# Nothing downstream notices. Each tier's monitor keeps using its OWN 'pattern'
# and stays green, because fresh snapshots do keep arriving -- they just never
# leave. Same silent shape as the create/prune disagreement in [dataset:], and
# as REV-20260807-054.
#
# The too-NARROW spelling fails here too and for the same reason: gfs_pattern =
# automated_hourly would see the hourly family but not automated_daily or
# automated_weekly, whose counts are in the very same ladder.
[defaults]
	host_label = testhost

[template:store_hourly]
	prune_schedule = 51 * * * *
	pattern        = automated_hourly
	retain         = -H24

[template:store_daily]
	prune_schedule = 53 0 * * *
	pattern        = automated_daily
	retain         = -D7

[template:store_weekly]
	prune_schedule = 55 0 * * 0
	pattern        = automated_weekly
	retain         = -W4

[prune:backup/store]
	use_template = store_hourly,store_daily,store_weekly
	recursive    = yes
	gfs          = yes
	gfs_pattern  = zabbix_
	notify       = store
