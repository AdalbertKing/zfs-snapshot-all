# A yes/no field present but blank on a [prune-bookmarks:] section.
#
# Blank is not a default; it is a question nobody answered. It used to read as
# "not yes", i.e. no -- so an operator who started typing a policy and was
# interrupted got the opposite of the one they were reaching for, with no
# diagnostic. Same treatment [dataset:]'s 'recursive' already gives it.
[defaults]
	host_label = testhost

[prune-bookmarks:backup/store]
	schedule  = 40 3 * * *
	age       = -d30
	recursive =
	notify    = bm
