# check-snap-age.sh is local-only by design -- a monitor riding a REMOTE
# [prune:] scope would run `zfs list` locally against "user@host:path" and
# report a permanent false UNKNOWN. Rejected at generate time.
[defaults]
	host_label = t
[template:hourly]
	prune_schedule = 51 * * * *
	pattern        = automated_hourly
	retain         = -H24
	monitor_warn   = 90m
	monitor_crit   = 3h
[prune:root@host:tank/x]
	use_template = hourly
	notify       = x
