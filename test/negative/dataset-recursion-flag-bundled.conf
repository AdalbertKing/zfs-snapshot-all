# REV-054 cond.1: bundled short options are getopts too. -Rv is -R -v, and a check that only compared whole tokens would let the old shape back in under a different spelling.
[defaults]
	host_label = t

[template:hourly]
	send_schedule = 7 * * * *
	prefix        = automated_

[dataset:tank/data]
	use_template = hourly
	flags        = -Rv 3
