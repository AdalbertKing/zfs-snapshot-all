# check-snap-age.sh has no ssh mode -- a remote [prune:] scope can be pruned
# over ssh but never monitored. Setting monitor_warn/monitor_crit on one must
# be rejected at generate time, not discovered as a permanent "monitor BROKEN"
# alert once installed.
[defaults]
	host_label = t
[template:daily]
	prune_schedule = 0 0 * * *
	pattern        = automated_daily
	retain         = -D30
	monitor_warn   = 26h
	monitor_crit   = 48h
[prune:backup@store:tank/x]
	use_template = daily
