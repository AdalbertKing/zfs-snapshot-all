# Same class of bug as blank-pattern.conf/blank-prefix.conf, for
# 'gfs_pattern': a blank value used to resolve successfully (ini_has only
# tests key presence), which under Phase 3.5's new omitted-vs-blank
# distinction would otherwise be indistinguishable from the deliberate
# omitted case (see fixtures/gfs-no-pattern.conf) unless blank is still
# refused. It is.
[defaults]
	host_label = t

[template:hourly]
	prune_schedule = 51 * * * *
	pattern        = automated_hourly
	retain         = -H24

[prune:tank/store]
	use_template = hourly
	gfs          = yes
	gfs_pattern  =
	notify       = x
