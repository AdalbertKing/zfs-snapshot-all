# An [excluded:] section with no 'keep' says nothing at all -- it must not be
# silently ignored, because the operator clearly intended to change protection.
#
# The section is EMPTY on purpose. It used to carry `notify = irrelevant` as
# filler -- a field [excluded:] never read, whose own value said the author knew
# it did nothing. Once unknown fields started being rejected (v4.25) that filler
# tripped the new check first and this fixture stopped testing what it claims.
# 'keep' is the only field [excluded:] accepts, so there is no filler to use.
[defaults]
	host_label = t
[excluded:__replicate_]
[template:hourly]
	prune_schedule = 51 * * * *
	pattern        = automated_hourly_
	keep           = 24
[prune:tank/store]
	use_template = hourly
	notify       = s
