# A one-letter typo in a yes/no field on a [prune:] section.
#
# These fields were compared against the literal "yes" after a trim and a
# lowercase, so EVERY other spelling meant "no" -- silently, at rc=0, with a
# generated block that looks entirely reasonable. 'recursive = ture' turns a
# declared subtree sweep into a single dataset: every child quietly stops being
# pruned, and the only trace is a delsnaps line missing its -R. 'gfs = ture'
# turns one cascading ladder into N flat per-tier lines, which is a different
# retention shape rather than a smaller one.
#
# [dataset:]'s own 'recursive' has been fatal-on-unknown since
# REV-20260807-054 -- "an unrecognised value is fatal rather than falsy" -- and
# [prune:]/[prune-bookmarks:] are the sections that reform did not reach.
[defaults]
	host_label = testhost

[template:keep_hourly]
	prune_schedule = 21 * * * *
	pattern        = automated_hourly
	retain         = -H24

[prune:backup/store]
	use_template = keep_hourly
	recursive    = ture
	notify       = store
