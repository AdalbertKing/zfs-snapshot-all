# quiesce=agent/auto on a pull dataset is ALLOWED since snapget.sh v2.65, which
# implements remote quiesce (freeze/snapshot/thaw in ONE remote invocation with
# its own EXIT trap and a detached deadman -- see the REMOTE QUIESCE section in
# lib-zfs-snap.sh). This file used to assert that ALL quiescing was rejected on
# pull; that contract changed deliberately, and the positive case is now
# exercised in test/fixtures/pull-quiesce.
#
# What is still rejected, and what this file pins: quiesce=SYNC on pull. sync is
# the CONTAINER fallback -- a `pct exec <id> -- sync` flush, not a freeze -- and
# scheduling one across an ssh hop buys nothing that a push job on that same
# host would not do better.
[defaults]
	host_label = t
[template:hourly]
	send_schedule = 0 * * * *
	prefix        = a_
[dataset:tank/x]
	use_template = hourly
	src          = root@far:tank/x
	quiesce      = sync
