# keep must be a non-negative integer or "all" -- a typo here would otherwise
# be pasted into a -P flag that delsnaps.sh then rejects at runtime, in a cron
# job, where the only symptom is a nightly alert.
[defaults]
	host_label = t
[excluded:__replicate_]
	keep = banana
[template:hourly]
	prune_schedule = 51 * * * *
	pattern        = automated_hourly_
	keep           = 24
[prune:tank/store]
	use_template = hourly
	notify       = s
