# 'keep' is a COUNT and nothing else. Unvalidated it rode straight into the
# flag ("-H${keep}"), so keep=abc produced -Habc and surfaced as a delsnaps
# parse error at 3 a.m. instead of here.
[defaults]
	host_label = t
[template:hourly]
	prune_schedule = 51 * * * *
	pattern        = automated_hourly_
	keep           = abc
[prune:tank/vm1]
	use_template = hourly
	notify       = x
