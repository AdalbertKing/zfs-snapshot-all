# gfs=yes without gfs_pattern must be rejected -- there is no single shared
# prefix for the combined ladder to match against otherwise.
[defaults]
	host_label = t

[template:hourly]
	prune_schedule = 51 * * * *
	pattern        = automated_hourly
	retain         = -H24

[prune:tank/store]
	use_template = hourly
	gfs          = yes
	notify       = x
