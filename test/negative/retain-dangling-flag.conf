# The two-token form '-h 12' is legal (delsnaps' own parser takes it, and
# jobs.11.11.v4.conf carries it live) -- but a flag with NO number at all is a
# dangling switch delsnaps would pair with whatever follows on the real
# command line. Refused whole.
[defaults]
	host_label = t
[template:hourly]
	prune_schedule = 51 * * * *
	pattern        = automated_hourly_
	retain         = -h
[prune:tank/vm1]
	use_template = hourly
	notify       = x
