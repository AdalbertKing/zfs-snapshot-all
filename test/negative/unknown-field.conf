# A field name gen-cron.sh reads nowhere. Until v4.25 this was stored and never
# looked at, so the config generated cleanly and quietly did something else.
# The real case: deploy.sh --draft-config emitted `tiers = ...` for months, and
# the only symptom was gen-cron dying about 'use_template' -- a field the admin
# had never been told to write.
[defaults]
	host_label = t
[template:hourly]
	send_schedule = 0 * * * *
	prefix        = a_
[dataset:tank/x]
	tiers        = hourly
	use_template = hourly
