# A relative path here would resolve against cron's working directory, not the
# admin's -- i.e. somewhere different from where it was typed.
[defaults]
	host_label = t
	cron_log   = scripts/cron.log
[template:hourly]
	send_schedule = 0 * * * *
	prefix        = a_
[dataset:tank/x]
	use_template = hourly
