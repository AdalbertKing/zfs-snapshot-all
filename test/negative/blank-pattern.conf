# A key present but BLANK is not the same as the key being absent. ini_has
# only tests presence, so "pattern = " with nothing after it used to read as
# "resolved" with an empty string -- delsnaps.sh matches by prefix, so an
# empty pattern matches every snapshot on the scope. Rejected at generate time
# exactly like a missing pattern.
[defaults]
	host_label = t
[template:hourly]
	prune_schedule = 51 * * * *
	pattern        =
	retain         = -H24
[prune:tank/vm1]
	use_template = hourly
	notify       = x
