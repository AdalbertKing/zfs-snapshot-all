# A crontab field whose STRUCTURE is fine but whose value cannot happen.
#
# 'hour = 25' parses as a number and looks like a schedule, so nothing before
# crontab(1) had an opinion about it. The per-field check is deliberately
# permissive about structure -- lists, ranges, steps and the three-letter
# month/day names all pass -- and strict only about the alphabet and the ranges.
# A validator that invented a restriction cron does not have would reject a
# working config, which is a worse failure than the hole it closes.
[defaults]
	host_label = testhost

[template:keep_hourly]
	prune_schedule = 21 25 * * *
	pattern        = automated_hourly
	retain         = -H24

[prune:backup/store]
	use_template = keep_hourly
	notify       = store
