# Basket A3 (2026-08-21): 'retain' reaches delsnaps.sh VERBATIM, and delsnaps'
# option surface includes -F -- clear-cut, zfs destroy -R, taking linked clones
# with it. This field was the one raw-flag field with no lint at all: a flag
# that is an OPERATION, not a retention, must be refused at generate time, not
# discovered as a different command at 3 a.m.
[defaults]
	host_label = t
[template:hourly]
	prune_schedule = 51 * * * *
	pattern        = automated_hourly_
	retain         = -F
[prune:tank/vm1]
	use_template = hourly
	notify       = x
