# ',degrade' does not make a wrong MODE right. `sync` is the container fallback
# -- a `pct exec <id> -- sync` flush, not a freeze -- and scheduling one across
# an ssh hop buys nothing a push job on that host would not do better. The
# qualifier is split off before that rule is applied, which is the whole reason
# lint_quiesce parses the grammar instead of matching the field as one string.
[defaults]
	host_label = t
[template:hourly]
	send_schedule = 0 * * * *
	prefix        = a_
[dataset:tank/x]
	use_template = hourly
	src          = root@far:tank/x
	quiesce      = sync,degrade
