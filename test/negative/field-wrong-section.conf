# A REAL field, in a section type that never reads it. Different mistake from a
# typo and it needs a different fix, so it gets its own message naming where the
# field does belong.
[defaults]
	host_label = t
[template:hourly]
	send_schedule = 0 * * * *
	prefix        = a_
	recursive     = yes
[dataset:tank/x]
	use_template = hourly
