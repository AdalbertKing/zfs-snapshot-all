# Same class of bug as blank-pattern.conf, for 'retain': a blank value used to
# resolve successfully with RESOLVED_RETAIN="", producing "delsnaps.sh ... "
# with no threshold flag at all -- which silently defaults to age-mode with
# threshold=now, deleting virtually everything the dataset already has.
[defaults]
	host_label = t
[template:hourly]
	prune_schedule = 51 * * * *
	pattern        = automated_hourly_
	retain         =
[prune:tank/vm1]
	use_template = hourly
	notify       = x
