# ssh_flags accepts ONLY -p/-k/-c/-K/-O -- -R belongs to this section's own
# 'recursive = yes' field, not a raw flag anyone can smuggle in a second way.
[defaults]
	host_label = t
[template:hourly]
	prune_schedule = 51 * * * *
	pattern        = automated_hourly
	retain         = -H24
[prune:root@host:tank/x]
	use_template = hourly
	ssh_flags    = -R
	notify       = x
