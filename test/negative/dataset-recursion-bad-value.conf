# REV-054: an unrecognised value is fatal, never falsy. 'ture' silently meaning 'no' is exactly the fail-open this field exists to remove.
[defaults]
	host_label = t

[template:hourly]
	send_schedule = 7 * * * *
	prefix        = automated_

[dataset:tank/data]
	use_template = hourly
	recursive    = ture
