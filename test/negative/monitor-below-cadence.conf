# A staleness threshold shorter than the cadence it is watching.
#
# The tier snapshots once a day and warns at 90 minutes. A staleness monitor
# measures the age of the newest matching snapshot: zero right after a run,
# and exactly the gap between runs just before the next one. So this monitor
# reaches WARN about 90 minutes after every successful backup and stays there
# for the rest of the day -- on a perfectly healthy job, forever, while a real
# outage looks identical to the noise.
#
# It runs on monitor_schedule, which defaults to */15, so the arithmetic is
# ~76 alerts per day per dataset. That is not a projection: */15 against
# thresholds sized for the wrong cadence produced 384 mails in one night on
# this estate, and the same shape has been hit three separate times.
#
# Both numbers are in gen-cron's hand at generate time -- this tier's own
# send_schedule and its own monitor_warn -- so it is refused here rather than
# discovered in a mailbox.
#
# Checked ONLY where the cadence is known: a [prune:] section, or a dataset
# tier with no send_schedule, watches a family that arrives from somewhere
# else, and guessing its cadence would refuse monitors that are correctly
# sized for a two-hop chain.
[defaults]
	host_label = testhost
	dst        = backup/store

[template:daily]
	send_schedule  = 0 2 * * *
	prefix         = automated_daily_
	prune_schedule = 30 2 * * *
	pattern        = automated_daily
	keep           = 7
	monitor_warn   = 90m
	monitor_crit   = 3h

[dataset:tank/x]
	use_template = daily
	notify       = x
