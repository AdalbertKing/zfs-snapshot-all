# Blank is rejected rather than ignored, same as pattern=/retain=/prefix=: a
# field someone bothered to write and left empty is a mistake, not a request
# for the default.
[defaults]
	host_label    = t
	notify_script =
[template:hourly]
	send_schedule = 0 * * * *
	prefix        = a_
[dataset:tank/x]
	use_template = hourly
