# gfs=yes only takes count-based single-letter retain flags -- an age-based
# retain= under gfs must be rejected, not silently misinterpreted.
[defaults]
	host_label = t

[template:hourly]
	prune_schedule = 51 * * * *
	pattern        = automated_hourly
	retain         = -h24

[prune:tank/store]
	use_template = hourly
	gfs          = yes
	gfs_pattern  = automated_
	notify       = x
