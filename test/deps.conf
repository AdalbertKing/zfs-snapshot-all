[suite:reviewctl]
cmd   = ./test/reviewctl/run.sh
needs = git (a checkout with origin/main; no root, no network)
note  = REVIEW PROTOCOL V2. Pins the state machine, not the wording: every case
        builds a throwaway artifact tree and asks what state is derived. The
        two cases that matter most are the ones a hand-maintained ledger could
        never have caught -- an approval naming a different commit than the one
        submitted, and a closure with no approval behind it. Since
        REV-20260807-067 it also pins that a commit-bearing header names a
        commit REACHABLE FROM THE PUBLISHED BRANCH. Reachability, not
        resolvability: the SHA that triggered that review is a real commit in
        the implementer's clone, orphaned by a rewrite, so a cat-file check
        passes it while the reviewer still gets "No commit found" from GitHub.
        The orphan case builds its own dangling commit with git commit-tree
        rather than depending on one that happens to exist locally.

[file:test/reviewctl.sh]
suites    = reviewctl

[file:test/remote-suite.sh]
suites    = impact
note      = Thin wrapper: runs ONE named suite on the test host. No suite of its
            own because it carries no product logic. Its whole job is the
            constraint: a permission rule matches a command PREFIX, so everything
            after the matched prefix is unconstrained -- granting an unattended
            agent a plink rule against a host would be indistinguishable from
            granting it root there. So the remote command is built HERE from a
            validated suite name, and the name must be one this checkout actually
            has, which is what stops it being an argument that carries a second
            command.

[file:test/ci-suites.sh]
suites    = impact
note      = Derives the CI matrix from the `needs` field in THIS file, so the
            workflow cannot carry a second, drifting copy of it. It carried one:
            seven names inline under a comment promising they were exactly the
            `needs = nothing` set, while twenty-nine qualified. The twenty-two
            left out did not stop being run -- they became manual work on the
            implementer's machine at 13-25 minutes a suite, against seconds on a
            runner. A suite now joins CI by declaring what it needs, which is
            something it has to do anyway. impact.sh --verify checks that the
            workflow still DERIVES the list rather than restating it.

[file:test/gh-api.sh]
suites    = impact
note      = Thin wrapper: builds a GitHub API URL under THIS repository and reads
            the token from git credential fill. Same reasoning as remote-suite.sh.
            Call sites used to start with a TOKEN= assignment, which no permission
            rule can match usefully, so the only workable rule would have been one
            permitting curl outright: any URL, any method, with the user's
