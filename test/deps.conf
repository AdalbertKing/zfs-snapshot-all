suites    = cleanrel
manual    = project-status
contracts = hold-tag
note      = 2026-08-20: audits and removes relationship TRACES. Deliberately no
            source edge to zfs-backup.sh or deploy.sh -- it must run on a host
            whose package state is already inconsistent, which is exactly when
            sourcing 6000 lines is the wrong move, so peer_label is mirrored
            rather than shared. It CALLS deploy.sh --leave when a join manifest
            is still present (the tool first, by hand only for what the tool
            demonstrably leaves), so a change to --leave's contract is a reason
            to re-read this file. The artefact list is not derivable from any
            code: it was measured by inventorying three hosts before and after
            every removal call during the 2026-08-20 teardown, which is how the
            two asymmetries it exists for were found -- peers/ is keyed BOTH by
            address and by label and remove-client removes only the former, and
            exactly one of the four pairing key files (_alias_known_hosts, the
            one the cron lines pass to -k) survives it.

