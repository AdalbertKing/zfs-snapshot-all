manual    = project-status
note      = the single crontab writer. Sourced by the three programs that
            install cron lines; nothing else may call crontab(1) directly.
            Its own suite stubs crontab(1), so it never touches a real one.
            deploy.sh's --pause/--resume (REV-20260803, see [file:deploy.sh])
            are one more requester of cron_lock_acquire/cron_read/cron_write,
            so a change to any of those three is a reason to run test/pause
            too, not just test/cron.

