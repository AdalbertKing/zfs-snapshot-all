# deps.conf -- what has to be re-tested when a given file changes.
#
# Read by test/impact.sh. The point is to remove judgement from the question
# "did I test enough?": you change files, the tool answers with a list.
#
# THREE KINDS OF EDGE, and only one of them is derivable from the code:
#
#   1. source edges -- snapsend.sh/snapget.sh `. lib-zfs-snap.sh`. impact.sh
#      finds these itself by parsing the scripts, and --verify fails if what it
#      finds disagrees with what is declared here. Nothing to maintain by hand.
#
#   2. suite edges -- which suite exercises which file. Declared, because a
#      suite's subject is a variable ($SNAPSEND, $LIB) that no parser can
#      reliably follow, and because "exercises" is a claim about intent.
#
#   3. CONTRACTS -- two files that must agree although neither includes the
#      other: gen-cron.sh emits cron lines that hardcode check-snap-age.sh's
#      exit codes; deploy.sh delegates the exact ZFS permissions the scripts
#      invoke; delsnaps.sh duplicates the lib's hold tag. Nothing in the code
#      links them. These are invisible to every tool that reads code, they are
#      where the expensive mistakes live, and they are the reason this file is
#      hand-written rather than generated.
#
# Also declared: MANUAL obligations. Some code paths have no automated coverage
# and cannot get any (ssh needs a second host; the delegated-account paths need
# a non-root account with zfs allow). Pretending otherwise is how a green suite
# becomes a false alibi -- 2026-07-25, four defects found by one delegated run
# after the suite went 161/161.
#
# Adding a file to the repo without listing it here makes --verify fail. That
# is deliberate: an unlisted file is an untested file nobody decided about.

# ---------------------------------------------------------------------------
# Files
# ---------------------------------------------------------------------------

[file:lib-zfs-snap.sh]
suites    = quiesce, tune, snapsend
manual    = remote-ssh, nonroot-account
contracts = hold-tag, recv-side-creation
note      = sourced by snapsend/snapget, so their suites cover it too

[file:snapsend.sh]
suites    = snapsend
manual    = remote-ssh, nonroot-account, force-full
contracts = gen-cron-flags, recv-side-creation, delegation-verbs, account-paths

[file:snapget.sh]
suites    = snapsend
manual    = remote-ssh, nonroot-account, force-full
contracts = recv-side-creation, delegation-verbs, account-paths
note      = snapget has no suite of its own; test/snapsend/run.sh covers both

[file:delsnaps.sh]
suites    = delsnaps
manual    = nonroot-account
contracts = hold-tag, gen-cron-flags, account-paths

[file:check-snap-age.sh]
suites    =
manual    = monitor-live
contracts = monitor-exit-codes
note      = no suite: it is a thin `zfs list` + threshold parse, and its real
            contract is the exit code, pinned by the gen-cron golden files

[file:gen-cron.sh]
suites    = gencron
manual    = crontab-diff
contracts = monitor-exit-codes, gen-cron-flags

[file:deploy.sh]
suites    =
manual    = deploy-check-only
contracts = delegation-verbs, account-paths, notify-markers

# The suites themselves. Editing a suite is a reason to run it -- a test that
# no longer runs is worse than a missing one, because the summary still says
# PASS. impact.sh's own suite is here for the same reason.

[file:test/run.sh]
suites    = gencron

[file:test/snapsend/run.sh]
suites    = snapsend

[file:test/delsnaps/run.sh]
suites    = delsnaps

[file:test/quiesce/run.sh]
suites    = quiesce

[file:test/tune/run.sh]
suites    = tune

[file:test/impact.sh]
suites    = impact
note      = this tool; its suite also re-runs --verify against the real tree

[file:test/impact/run.sh]
suites    = impact

[file:test/deps.conf]
suites    = impact
note      = this graph; the impact suite asserts --verify on it

# A section name ending in "/" covers every file beneath it. The golden files
# ARE the gen-cron test -- editing an expected output changes what passes, so it
# has to pull the suite in, and enumerating them one by one would go stale.

[file:test/fixtures/]
suites    = gencron

[file:test/negative/]
suites    = gencron

[file:test/impact/fixtures/]
suites    = impact

# ---------------------------------------------------------------------------
# Suites
# ---------------------------------------------------------------------------

[suite:impact]
cmd   = ./test/impact/run.sh
needs = nothing
covers = impact.sh parsing, resolution and drift detection, plus a live
         --verify of this very graph

[suite:gencron]
cmd   = ./test/run.sh
needs = nothing
covers = gen-cron.sh config parsing: golden fixtures + negative cases

[suite:quiesce]
cmd   = ./test/quiesce/run.sh
needs = nothing
covers = quiesce (-q) bookkeeping: guest ownership, dedup

[suite:tune]
cmd   = ./test/tune/run.sh
needs = nothing
covers = -A autotune cache bookkeeping (stubbed zfs on PATH)

[suite:snapsend]
cmd   = sudo ./test/snapsend/run.sh
needs = root, zfs, mbuffer
covers = snapsend.sh + snapget.sh, LOCAL mode only -- never the ssh path

[suite:delsnaps]
cmd   = sudo ./test/delsnaps/run.sh
needs = root, zfs
covers = delsnaps.sh incl. -B bookmark pruning

# ---------------------------------------------------------------------------
# Manual obligations -- no suite can do these
# ---------------------------------------------------------------------------

[manual:remote-ssh]
why = validate_remote_host() refuses a loopback "replication" to the same
      machine by design, so no single-host suite can ever exercise ssh. Every
      remote code path is therefore covered by hand or not at all.
how = real send pve1 -> pve2 and a real pull back, with -v2, checking what
      landed on the far side; scratch datasets under hdd/backuptest*

[manual:nonroot-account]
why = a delegated account cannot mount (no CAP_SYS_ADMIN on Linux, and no
      `zfs allow` grants it) and cannot read /root (0700). Root cannot reach
      either failure. On 2026-07-25 one such run found four defects after the
      suite was green.
how = su - zfsbackup, run the same command with NO environment overrides, on
      a multi-level target path that does not exist yet

[manual:force-full]
why = -f and -F destroy and recreate the target, which needs mount/unmount --
      root-only by nature, and destructive, so no suite does it automatically
how = on a throwaway target only; confirm the PVE-reserved-snapshot refusal
      still triggers

[manual:monitor-live]
why = staleness is a function of wall-clock time; a suite would have to fake
      the clock or wait
how = run check-snap-age.sh against a real dataset at each threshold and check
      the exit code, then confirm the cron line reacts

[manual:crontab-diff]
why = the generated block only matters once installed, and the install is
      idempotent replacement -- the risk is what it silently drops
how = regenerate from each host's config and diff against the live crontab
      BEFORE --install; expect zero unexplained lines

[manual:deploy-check-only]
why = deploy.sh mutates a host; the audit mode is the only safe exercise
how = bash deploy.sh --check-only on BOTH host shapes (with and without a
      delegated account) -- they take different phases

# ---------------------------------------------------------------------------
# Contracts -- agreements the code itself does not express
# ---------------------------------------------------------------------------

[contract:monitor-exit-codes]
members = check-snap-age.sh, gen-cron.sh
why = gen-cron.sh emits `[ $rc -eq 1 ] && notify-warn; [ $rc -eq 2 ] && ...;
      [ $rc -ge 3 ] && ...` -- check-snap-age.sh's exit codes are hardcoded in
      a string in another file. Add a code on one side and the other silently
      misroutes it.
check = grep the emitted monitor line for the rc arms and compare against
        check-snap-age.sh's exits; the golden fixtures pin the emitted form

[contract:gen-cron-flags]
members = gen-cron.sh, snapsend.sh, delsnaps.sh
why = gen-cron.sh validates and injects flags it does not own (-f/-n rejected,
      -A auto-added for remote dst, -z warned about on local dst). Rename or
      re-mean a flag in snapsend/delsnaps and the generator keeps emitting the
      old one, or rejects a valid config.
check = every flag gen-cron.sh names must still parse in the target script's
        getopts, with the same meaning

[contract:hold-tag]
members = lib-zfs-snap.sh, delsnaps.sh
why = the hold tag `zfssnapall_inflight` is DUPLICATED: the lib sets it,
      delsnaps.sh recognises it to report "in-flight, skipped" instead of a
      generic dependent-object error. delsnaps.sh does not source the lib.
check = the literal tag must match in both files

[contract:recv-side-creation]
members = snapsend.sh, snapget.sh, lib-zfs-snap.sh
why = anything that creates a dataset on the receive side has to work for a
      user who cannot mount. `zfs create -p` applies -o to the final dataset
      only, so every level it invents gets canmount=on and a delegated receive
      dies "Insufficient privileges" -- invisible to root.
check = MANDATORY nonroot-account run; every created level must be
        canmount=noauto

[contract:delegation-verbs]
members = deploy.sh, snapsend.sh, snapget.sh
why = deploy.sh's ZFS_PERMS must cover every zfs verb the scripts invoke.
      A missing verb fails non-fatally and therefore silently: `bookmark` was
      missing until 2026-07-25, which disabled the whole bookmark fallback
      without a single alert.
check = every `zfs <verb>` the scripts call on a delegated dataset must appear
        in ZFS_PERMS

[contract:account-paths]
members = deploy.sh, snapsend.sh, snapget.sh, delsnaps.sh
why = deploy.sh PROVISIONS $HOME/run, $HOME/zfs-snapshot-stats.log and
      $HOME/notify-fail.sh (its logrotate stanza rotates that stats path), and
      the scripts DEFAULT to them when not run as root. The two sides drifted
      apart unnoticed for as long as no account had jobs.
check = the paths deploy.sh creates/rotates must equal the non-root defaults
        in the scripts

[contract:notify-markers]
members = deploy.sh
why = notify-fail.sh / notify-warn.sh / alert-digest.sh live in deploy.sh
      heredocs and are upgraded by a version MARKER comment. Change a body
      without bumping its marker and deploy reports "already current" while
      every host keeps the old copy.
check = any edited heredoc body must come with a bumped *_MARKER
