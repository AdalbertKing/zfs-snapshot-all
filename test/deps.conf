[suite:recursion]
cmd   = ./test/recursion/run.sh
needs = nothing
covers = exactly ONE recursion declaration per invocation (stage 2.2). Runs the
         REAL engines: the property is that the refusal lands while parsing
         argv, before any dependency, dataset or SSH work, which is also why it
         needs no root and no ZFS. Pins that -r -R is refused in EITHER order
         -- that was already true and the stage 2 contract wrongly claimed
         otherwise, so it is pinned rather than assumed -- and that a repeat of
         the SAME mode is refused too, which is what 2.2 actually added. A
         repeat is harmless today; the rule is about the declaration, not its
         effect, because once --recursive=<mode> exists (2.3) a spelling that
         "collapses harmlessly" is how --recursive=no -r would quietly become
