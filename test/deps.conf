            literal shape, and its `check` names the round-trip fixtures as
            what catches drift -- but the contract only tells a reader to look,
            it does not run anything. Without the edge, aa66674 (the digest
            line leaving the managed block) changed that output, no CI job
            selected cron2conf, and the suite was already failing 10 cases on
