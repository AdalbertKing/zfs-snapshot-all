# ---------------------------------------------------------------------------
# Manual obligations -- no suite can do these
# ---------------------------------------------------------------------------

[manual:nonroot-account]
why = a delegated account cannot mount (no CAP_SYS_ADMIN on Linux, and no
      `zfs allow` grants it) and cannot read /root (0700). Root cannot reach
      either failure. On 2026-07-25 one such run found four defects after the
      suite was green.
how = su - zfsbackup, then run the remote campaign as that account with NO
      environment overrides:
      ./test/remote/run.sh --peer zfsbackup@<host> --local-parent hdd/backuptest
      A multi-level target path that does not exist yet is the case that bites.

[manual:force-full]
why = -f and -F destroy and recreate the target, which needs mount/unmount --
      root-only by nature, and destructive, so no suite does it automatically
how = on a throwaway target only; confirm the PVE-reserved-snapshot refusal
      still triggers

[manual:mediagate-live]
why = the stub suite proves which branch the gate takes and, above all, which
      pools it exports and which it refuses to. What a stub cannot reach is the
      half that decides whether the feature is worth anything: that an EXPORTED
      pool really presents to zpool as absent, that importing it back makes the
      dataset usable, and that a disk returning after a long absence takes an
      INCREMENT off its bookmark anchor instead of a full re-seed. The anchor
      surviving the collector's own retention is the whole promise; a stub can
      only assert the code path that would use it.
how = on a host with a spare disk (or a file-backed pool, which is enough for
      everything except the physical unplug): create the pool, sync a replica
      onto it, export it, let the collector's retention run long enough to prune
      the snapshot the replica holds, re-import and sync again. The pass
      condition is that the second sync is an increment and the log says so --
      not merely that it succeeded, because a full re-seed also succeeds.
      Measure the bookmark before and after: zfs list -t bookmark -d 1 <copy>.

[manual:pairgate-live]
why = the stub suite proves the gate's own logic, but not the thing that
      makes it a security boundary: that sshd really routes a real key
      through it, that the account cannot reach a shell around it, and that
      a genuinely manual transfer attempt from the collector is refused at
      the peer. Only a real key on a real sshd can show that.
how = test plan section C on scratch data, two relationships (the second on a
      throwaway LXC peer -- one relationship per host pair, see the REV-045
      response): active transfer succeeds; disable A and run A's exact cron
      line AND a hand-written snapget with no -L, both refused before any zfs
      command; B unaffected; refusal reason/exit code observed as documented;
      enable restores A; confirm no cron, authorized_keys, account or ZFS
      grant mutation happened during the cycle.

[manual:monitor-live]
why = staleness is a function of wall-clock time; a suite would have to fake
      the clock or wait
how = run check-snap-age.sh against a real dataset at each threshold and check
      the exit code, then confirm the cron line reacts

[manual:quiesce-helper-live]
why = every stub in the suite fakes exactly the thing that has to be true on a
      real host: that sudo strips $ZFS_QUIESCE_ALLOW_DIR, that a delegated
      account can actually reach the helper through the generated rule, and
      that qm answers as expected. None of that can be proven off a PVE host,
      and `writers` needs a real Windows guest with a real VSS state.
how = on a source host after --join --allow-quiesce, AS the delegated account:
      `sudo -n /usr/local/sbin/zfs-quiesce-helper status` must answer OK;
      `sudo ZFS_QUIESCE_ALLOW_DIR=/tmp/mine ...` must NOT honour the override;
      `... freeze <id>` on a whitelisted guest must freeze and `thaw` restore
      it (verify with `qm guest cmd <id> fsfreeze-status`). Two rules for that
      one, both learned doing it on 2026-07-31: (a) check `pvesr status` for
      the guest and WAIT OUT its window first -- PVE replication freezes the
      same guest through the same agent, and colliding with it is the worst
      possible moment to be holding a freeze; VM 106 replicates every 3h and
      the test began 23s after its slot. (b) run the freeze and the thaw in ONE
      invocation, under a root `qm guest cmd <id> fsfreeze-thaw` EXIT trap, so
      a dropped connection cannot leave a production guest frozen. A guest
      outside the delegated datasets must be refused; `writers <id>` must list writers on
      a Windows guest in BOTH an English and a localised (e.g. Polish) guest --
      vssadmin is translated, and a label-matching parser silently reported
      total=0 on a Polish guest while vssadmin had succeeded. Do NOT treat
      class=failed as a fault: a freeze-only quiesce leaves writers failed, so
      the verb reports state and renders no verdict. `sqlfreeze <id>` on a SQL
      guest right after a quiesce must report verdict=engaged with frozen and
      resumed EQUAL -- that pair (events 3197/3198) is the only positive signal
      of application consistency we have, but it is scoped to a WINDOW, not to a
      run: another job quiescing the same guest inside that window produces the
      same answer, so do not quote engaged as proof that one particular backup
      froze SQL. Note that PowerShell-based verbs are
      unusable on very old guests: on a Server 2008 guest here even
      `$PSVersionTable` exceeds a 120s qm timeout, and the verb correctly fails
      rather than reporting an empty all-clear.

[manual:crontab-diff]
why = the generated block only matters once installed, and the install is
      idempotent replacement -- the risk is what it silently drops
how = regenerate from each host's config and diff against the live crontab
      BEFORE --install; expect zero unexplained lines

[manual:project-status]
why = docs/PROJECT_STATUS.md is the one place the owner and the reviewer look for
      "what is true right now". Everything else in docs/internal/reviews/ is chronological
      -- a correct record of what was decided when, and a bad way to find out
      what the tree does today. The reviewer works from GitHub, not from this
      session, so a status doc that lags behind main is not a stale document, it
      is a reviewer reading a design that no longer exists. That happened on
      2026-07-31: three response files still carried a literal `<SHA>`, and one
      described a cp -p/mktemp mechanism that a later commit had replaced.
      No suite can check "is this description still true", so it is an
      obligation, not a test.
how = refresh docs/PROJECT_STATUS.md before reporting a stage as done: the
      "Stan na" commit and date, the host/version tables, the suite counts, and
      the open-items split (reviewer / owner / known gaps). If a design section
      describes code the change replaced, rewrite it -- do not append. Historical
      accuracy belongs in the review responses, current truth belongs here.

[manual:deploy-check-only]
why = deploy.sh mutates a host; the audit mode is the only safe exercise
how = bash deploy.sh --check-only on BOTH host shapes (with and without a
      delegated account) -- they take different phases. If the host's sudo was
      upgraded, re-confirm the one assumption install_quiesce_grant stages on:
      that sudoers.d IGNORES a filename containing a '.'. Never test that in the
      real /etc/sudoers.d -- build an isolated tree, `@includedir <tmp>/dir` in a
      throwaway sudoers file, put deliberate garbage in `<name>.zqg-new` (visudo
      -cf must PASS) and then in a dotless `<name>` (must FAIL, which is what
      proves the includedir was live). Verified on sudo 1.9.5p2, 2026-07-31. If
      that ever flips, a staged rule becomes live sudoers the moment it is
      written, and the staging design has to change before the next release.

[manual:zfsbackup-live-pair]
why = add-client/activate-client's real work (deploy.sh --pair/--join/
      --draft-config, snapget.sh -n against a real remote dataset,
      gen-cron.sh --install) needs two hosts, root, and ZFS -- none of which
      exist in the local test box
how = end-to-end on two live hosts already used for --pair/--join testing:
      setup-server, add-client against a THROWAWAY dataset on the peer,
      manual --join on the peer, activate-client (expect a clean dry-run and
      one confirmation), verify the installed cron line and crontab
      before/after diff, then remove-client and confirm the peer-side
      --unpair instructions work and nothing is left behind

[manual:rux-live-chain]
why = RUX-4 (docs/project/OWNER-REMOTE-DEPLOY-UX-REDUCTION-2026-08-12.md):
      test/rux/run.sh pins the parser/planner and the orchestration CONTRACT
      with add-client/seed/activate stubbed -- it cannot prove the real
      chained topology the decision was motivated by, which needs three real
      hosts and a live --join over SSH
how = LIVE-PROVEN 2026-08-16 (see docs/PROJECT_STATUS.md `rux` row for the
      full account). The literal three-host chain from the decision doc is
      not reachable on this estate -- the two clusters sit on separate VPNs
      with no route between them (measured: ping/ssh from metropolis to the
      11.x cluster times out). Substituted two independent two-host proofs
      instead, each on throwaway datasets and fully torn down afterward:
      backup (pve2-metropolis collector <- pve1-metropolis source, real
      --join-remotely, md5-verified) and sync (pve0 collector <- pve1 11.x
      source, identity-preserving mapping confirmed, md5-verified). Found
      and worked around a real pre-existing engine property along the way:
      `deploy.sh --pair` keys pairing state to the PEER ADDRESS, not the
      relationship name, so one peer cannot carry two independent
      relationships (backup + sync) at once today -- rux_verify_requested_scope
      correctly refused rather than silently seeding the wrong dataset, which
      is exactly the property this obligation asked to be checked. Re-run
      this whenever the pairing/join/scope machinery changes underneath RUX;
      the two-proof substitution above remains the template until a third
      mutually-reachable host exists.

# ---------------------------------------------------------------------------
# Contracts -- agreements the code itself does not express
# ---------------------------------------------------------------------------

[contract:monitor-exit-codes]
members = check-snap-age.sh, gen-cron.sh
why = gen-cron.sh emits `[ $rc -eq 1 ] && notify-warn; [ $rc -eq 2 ] && ...;
      [ $rc -ge 3 ] && ...` -- check-snap-age.sh's exit codes are hardcoded in
      a string in another file. Add a code on one side and the other silently
      misroutes it.
check = grep the emitted monitor line for the rc arms and compare against
        check-snap-age.sh's exits; the golden fixtures pin the emitted form

[contract:gen-cron-flags]
members = gen-cron.sh, snapsend.sh, snapget.sh, delsnaps.sh
why = gen-cron.sh validates and injects flags it does not own (-f/-n rejected,
      -A auto-added for remote dst, -z warned about on local dst). Rename or
      re-mean a flag in snapsend/delsnaps and the generator keeps emitting the
      old one, or rejects a valid config. snapget.sh was missing from this
      list until 2026-07-29 -- gen-cron.sh's maybe_add_quiesce/-q injection ran
      identically for push and pull, but snapget.sh had no -q at all, and
      nothing here caught it. Fixed same day by making lint_quiesce
      direction-aware and rejecting quiesce on pull outright.
      CHANGED AGAIN 2026-07-30: snapget.sh v2.65 DOES implement -q (and -Q) for
      a remote source -- the whole freeze/snapshot/thaw runs in one remote
      invocation with its own EXIT trap and a detached deadman, see the REMOTE
      QUIESCE section in lib-zfs-snap.sh. So lint_quiesce now allows
      agent/auto on pull and rejects only sync (the container `pct exec` flush,
      pointless across an ssh hop). Fixtures: fixtures/pull-quiesce (positive,
      pins that -q agent IS emitted on a snapget line) and
      negative/quiesce-sync-on-pull (what is still refused).
      One thing this contract deliberately does NOT cover: whether the SOURCE
      account may actually run qm/pct. Since 2026-07-31 there are TWO ways to
      satisfy that: be root, or have zfs-quiesce-helper reachable over sudo
      (installed by `deploy.sh --join --allow-quiesce` on the source host).
      gen-cron.sh can know neither; the remote script picks its route at run
      time and fails loudly when it has neither, rather than silently taking
      the crash-consistent snapshot -q exists to prevent.
check = every flag gen-cron.sh names must still parse in the target script's
        getopts, with the same meaning

[contract:profile-config-schema]
members = zfs-backup.sh, gen-cron.sh, profiles/
why = zfs-backup.sh WRITES the config gen-cron.sh reads: the standard_*/keep_*
      template families, and a [prune:] section carrying gfs/gfs_pattern. None
      of that is a function call, so nothing links them -- and the schema is
      sharper than it looks. gfs= is accepted ONLY in [prune:]; a [dataset:]
      prunes exactly when its tiers resolve prune_schedule, which is why the
      profile is split in two families at all; and gen-cron's [dataset:]
      monitor block is nested INSIDE that prune branch, so a dataset that stops
      pruning silently stops being monitored. Rename a field, move a validation,
      or change where monitors are emitted, and the wrapper keeps writing a
      config that no longer means what it meant -- with the failure landing in
      activate-client on a live host.
check = the zfsbackup suite renders the emitted profile through the REAL
      gen-cron.sh and asserts exactly one `delsnaps.sh -G` ladder and no flat
      per-tier prune; keep that assertion honest rather than loosening it

[contract:ssh-flag-parity]
members = gen-cron.sh, delsnaps.sh, snapsend.sh, snapget.sh, deploy.sh
why = all three scripts deliberately expose the SAME five SSH options
      (-p/-k/-c/-K/-O), and gen-cron.sh's 'ssh_flags' field hardcodes exactly
      that set as its accept-list before pasting it into a delsnaps.sh line.
      Drop or rename one of those flags in any script and gen-cron keeps
      emitting a config field that no longer parses -- in a cron job, where
      the failure is a nightly alert at best. delsnaps.sh's own --help also
      claims parity ("same as snapsend.sh/snapget.sh") and would start lying.
      deploy.sh joined the set in 2026-07-29: --draft-config WRITES '-K' and
      '-k' into the flags it suggests, so a rename there lands in a config a
      human copies without checking.
check = the five flags must parse identically in all three scripts, and
        gen-cron.sh's lint_ssh_flags accept-list must match that set exactly;
        the flags deploy.sh's --draft-config emits must be in that set too

[contract:twin-functions]
members = snapsend.sh, snapget.sh
why = TWELVE functions are defined in BOTH scripts under the same name.
      EIGHT carry the direction and share a signature --
      get_sorted_snapshots, find_conflicting_snapshots,
      find_recursive_name_collisions, validate_snapshot, find_common_snapshot,
      create_snapshot, transfer_data, process_dataset. Neither script sources
      the other, so nothing in the code links them: a bug fixed in the pull
      direction stays broken in push until someone remembers. This is not
      hypothetical -- snapget.sh's copies carry `local x; x=$(...)` where
      snapsend.sh still has `local x=$(...)`, which masks the command's exit
      status. They are deliberately NOT merged into lib-zfs-snap.sh: the
      bodies differ in which side the remote coordinates attach to, the
      signatures are identical, and a direction parameter got backwards fails
      OPEN on common-base detection -- which test/snapsend/run.sh, being LOCAL
      MODE ONLY by design, structurally cannot catch.
      The remaining FOUR -- translate_long_options, opt_takes_arg,
      cluster_needs_next, declare_recursion -- carry no direction at all and
      are byte-identical today. They were listed nowhere until 2026-08-20,
      although test/twins/run.sh's own comment requires its list to be
      exhaustive ("a name that exists in both and is NOT watched here is the
      one place drift gets to happen unobserved"). Being direction-free does
      not make them candidates for the lib either: the 2026-08-04 decision was
      to alarm on drift INSTEAD of merging, so a gap in the alarm was a hole in
      that decision. Both engines now carry a THE TWIN header pointing here,
      because the duplication is deliberate and reads like an oversight.
check = test/twins asserts a pinned hash per copy; one side moving without the
        other is a reviewed decision, recorded by --bless, not a silent pass

[contract:hold-tag]
members = lib-zfs-snap.sh, delsnaps.sh, clean-relationships.sh
why = the hold tag `zfssnapall_inflight` is DUPLICATED in three files: the lib
      sets it, delsnaps.sh recognises it to report "in-flight, skipped" instead
      of a generic dependent-object error, and clean-relationships.sh reports a
      hold that outlived the relationship that placed it. Neither of the other
      two sources the lib -- deliberately, in clean-relationships.sh's case,
      because it must run on a host whose package state is already broken.
      A tag that drifts makes the third one silently report nothing, which is
      indistinguishable from a healthy host.
check = the literal tag must match in all three files

[contract:recv-side-creation]
members = snapsend.sh, snapget.sh, lib-zfs-snap.sh
why = anything that creates a dataset on the receive side has to work for a
      user who cannot mount. `zfs create -p` applies -o to the final dataset
      only, so every level it invents gets canmount=on and a delegated receive
      dies "Insufficient privileges" -- invisible to root.
check = MANDATORY nonroot-account run; every created level must be
        canmount=noauto

[contract:delegation-verbs]
members = deploy.sh, snapsend.sh, snapget.sh
why = deploy.sh's ZFS_PERMS must cover every zfs verb the scripts invoke.
      A missing verb fails non-fatally and therefore silently: `bookmark` was
      missing until 2026-07-25, which disabled the whole bookmark fallback
      without a single alert.
check = every `zfs <verb>` the scripts call on a delegated dataset must appear
        in ZFS_PERMS

[contract:account-paths]
members = deploy.sh, snapsend.sh, snapget.sh, delsnaps.sh, gen-cron.sh
why = deploy.sh PROVISIONS $HOME/run, $HOME/cron.log, $HOME/zfs-snapshot-stats.log
      and $HOME/notify-fail.sh (its logrotate stanza rotates those log paths),
      and the scripts DEFAULT to them when not run as root. The two sides drifted
      apart unnoticed for as long as no account had jobs -- which is precisely
      the window this project has now left. gen-cron.sh joined the members in
      2026-08-01: it is the side that DECIDES $CRON_LOG, and every generated job
      line redirects into it. The account stanza rotated git-pull.log and
      zfs-snapshot-stats.log but not cron.log, so the one file an account-owned
      cron block actually writes was the one nothing rotated (~250 KB/day
      measured on metropolis pve1). Nothing alerts on a large log.
check = the paths deploy.sh creates/rotates must equal the non-root defaults
        in the scripts, and root's logrotate stanza and the account's must
        cover the same three logical files
        (test/zfsbackup/run.sh section 20 pins the logrotate half)

[contract:notify-markers]
members = deploy.sh
why = notify-fail.sh / notify-warn.sh / alert-digest.sh live in deploy.sh
      heredocs and are upgraded by a version MARKER comment. Change a body
      without bumping its marker and deploy reports "already current" while
      every host keeps the old copy.
check = any edited heredoc body must come with a bumped *_MARKER

[contract:cron-line-shape]
members = gen-cron.sh, cron2conf.sh
why = cron2conf.sh parses job_cron_line()'s wrapper and each emit_*()
      function's literal command shape (the exact "e=$(mktemp); ... 2>\"$e\";
      rc=$?; cat ..." template, the quoting snapsend.sh/delsnaps.sh/
      check-snap-age.sh's args are wrapped in, the "-G"/"-B"/"-R"/"-F"/"-P"
      flag ORDER delsnaps.sh lines are built in) as fixed literal delimiter
      strings, not by calling anything in gen-cron.sh. There is no source
      edge -- reading the OUTPUT format is the entire point of an inverse
      tool -- so any change to how gen-cron.sh assembles a line (a new flag
      inserted before the scope argument, a reworded wrapper, a new [prune:]
      flag order) breaks cron2conf.sh SILENTLY unless something runs both.
check = test/cron2conf/run.sh's round-trip fixtures feed cron2conf.sh's own
        output back through the REAL gen-cron.sh and diff against the
        fixture the parser started from; a shape drift fails there first
