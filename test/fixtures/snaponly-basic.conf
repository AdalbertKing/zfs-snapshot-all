# REV-20261017-152 round 1: [snaponly:<user@host:dataset>] -- snapshots on a
# REMOTE source with no copy anywhere. One `snapget.sh -s` line per tier (never
# grouped), the remote monitor over ssh (round 2), and the source's own
# retention in its [prune:] (side = source) as for any remote source.
[defaults]
	host_label = t
[template:snaponly-hourly]
	send_schedule = 7 * * * *
	prefix        = zsalab_hourly_
	monitor_warn  = 90m
	monitor_crit  = 3h
[template:snaponly-daily]
	send_schedule = 13 1 * * *
	prefix        = zsalab_daily_
	quiesce       = agent,degrade
[template:src-hourly]
	prune_schedule = 37 * * * *
	pattern        = zsalab_hourly_
	retain         = -H24
[template:src-daily]
	prune_schedule = 43 1 * * *
	pattern        = zsalab_daily_
	retain         = -D7
[snaponly:zbk-a@hostA:hdd/vm-disks/subvol-990-disk-0]
	use_template = snaponly-hourly,snaponly-daily
	pair_label   = clu
	recursive    = flat
	notify       = ct990
	ssh_flags    = -K /k/a -k /k/a_known -O HostKeyAlias=zfs-client-a
[prune:zbk-a@hostA:hdd/vm-disks/subvol-990-disk-0]
	use_template = src-hourly,src-daily
	recursive    = yes
	pair_label   = clu
	notify       = ct990
	ssh_flags    = -K /k/a -k /k/a_known -O HostKeyAlias=zfs-client-a
