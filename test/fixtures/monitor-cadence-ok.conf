# Golden: thresholds correctly sized against several different cadences, none
# of which the monitor-vs-cadence guard may refuse.
#
# The interesting cases are the ones where the longest gap is NOT the naive
# "interval" an operator would say out loud:
#
#   weekly   0 3 * * 0        7 days, not 1
#   monthly  20 3 1 * *       31 days -- the longest month, not the average
#   workday  0 3 * * 1-5      72 hours across the weekend, not 24
#
# A guard that reasoned from the field that "looks like" the interval would
# pass the workday tier at 30h and start alerting every Sunday. The gap is
# computed by walking a real calendar instead.
[defaults]
	host_label = testhost
	dst        = backup/store

[template:hourly]
	send_schedule  = 37 * * * *
	prefix         = automated_hourly_
	prune_schedule = 51 * * * *
	pattern        = automated_hourly
	keep           = 24
	monitor_warn   = 90m
	monitor_crit   = 3h

[template:weekly]
	send_schedule  = 0 3 * * 0
	prefix         = automated_weekly_
	prune_schedule = 40 3 * * 0
	pattern        = automated_weekly
	keep           = 4
	monitor_warn   = 9d
	monitor_crit   = 12d

[template:monthly]
	send_schedule  = 20 3 1 * *
	prefix         = automated_monthly_
	prune_schedule = 50 3 1 * *
	pattern        = automated_monthly
	keep           = 6
	monitor_warn   = 33d
	monitor_crit   = 40d

[template:workday]
	send_schedule  = 0 3 * * 1-5
	prefix         = automated_workday_
	prune_schedule = 40 3 * * 1-5
	pattern        = automated_workday
	retain         = -D10
	monitor_warn   = 80h
	monitor_crit   = 96h

[dataset:tank/x]
	use_template = hourly,weekly,monthly,workday
	notify       = x
