# Golden: quiesce = <mode>,degrade -> snapsend.sh -q <mode>,degrade.
#
# The qualifier travels to the engine INSIDE the same field, unchanged. That is
# the whole point of extending `quiesce` rather than adding a second field: two
# fields could disagree, and a cron line is the last place to discover that they
# do.
#
# What this fixture pins is the RENDER. Whether the engine then degrades, and
# from which failures, is decided at run time and pinned by test/quiesce.
[defaults]
	host_label = arc
	dst        = backup/arc

[template:hourly]
	send_schedule = 59 * * * *
	prefix        = automated_

# The three accepted forms, one per dataset.
[dataset:tank/vm-201-disk-0]
	use_template = hourly
	quiesce      = auto,degrade
	notify       = vm201

[dataset:tank/vm-202-disk-0]
	use_template = hourly
	quiesce      = agent,degrade
	notify       = vm202

[dataset:tank/subvol-203-disk-0]
	use_template = hourly
	quiesce      = sync,degrade
	notify       = ct203

# NEGATIVE CONTROL, in the golden itself: the same modes WITHOUT the qualifier
# must render exactly as they always did. If the parser ever started attaching
# the qualifier by default, these two lines are where it would show.
[dataset:tank/plain-auto]
	use_template = hourly
	quiesce      = auto
	notify       = plainauto

[dataset:tank/plain-none]
	use_template = hourly
	notify       = plainnone
