# Golden: -E (excluded snapshot family) written in its BUNDLED spelling.
#
# `-Erepl_` and `-E repl_` are the same invocation; getopts accepts both, and
# both engines were measured accepting both. gen-cron's own option walk read
# only the spaced one, because -E was missing from FLAGS_ARG_LETTERS -- so it
# treated E as a boolean and then read the FAMILY NAME as further option
# letters. The letters it invented are what this fixture pins, one dataset per
# consequence:
#
#   bundled-r   -Erepl_  -> phantom `r`, and lint_flags refused the config for
#                           declaring a recursion nobody wrote
#   bundled-b   -Ebulk_  -> phantom `b`, and the link field's one-option-one-home
#                           check refused a `bandwidth` that collided with
#                           nothing
#   spaced      -E repl_ -> the control: the same option, spaced, which the old
#                           walk read correctly. It must keep rendering, and it
#                           must render the same option the bundled one does.
#
# Both refusals are FALSE, and both are silent about their real cause -- the
# message names recursion or bandwidth, neither of which appears in the config.
# Against the previous gen-cron.sh this whole file produces an error and no
# crontab at all, which is the negative control.
[defaults]
	host_label = lab

[template:hourly]
	send_schedule = 5 * * * *
	prefix        = automated_hourly_

[dataset:tank/bundled-r]
	use_template = hourly
	dst          =
	src          = zfsbackup@far:bundled-r
	flags        = -Erepl_
	notify       = bundled r

[dataset:tank/bundled-b]
	use_template = hourly
	dst          =
	src          = zfsbackup@far:bundled-b
	flags        = -Ebulk_
	bandwidth    = 2M
	notify       = bundled b

[dataset:tank/spaced]
	use_template = hourly
	dst          =
	src          = zfsbackup@far:spaced
	flags        = -E repl_
	notify       = spaced
