# Golden: pair_label (REV-20260804-045, logical pause). The label must reach
# THREE places and no others:
#   - the pull line's flags as -L <label> (before the src argument);
#   - the pulled dataset's own monitor line as check-snap-age -L <label>;
#   - the recursive [prune:] section's monitor line -- while the prune
#     (delsnaps) line itself stays label-free: retention keeps running for a
#     paused relationship, only transfers and their staleness alarms stop.
# Two different clients must keep separate monitor lines even with identical
# thresholds (pair_label is part of the monitor group key), and an unlabeled
# dataset alongside them must generate exactly as before the field existed.
[defaults]
	host_label = arc

[template:hourly]
	send_schedule   = 59 * * * *
	prefix          = automated_
	pattern         = automated_
	prune_schedule  = 30 2 * * *
	keep            = 24
	monitor_warn    = 90m
	monitor_crit    = 3h

[dataset:hdd/backups/arc/alpha/tank/data]
	use_template = hourly
	src          = zfsbackup-arc@10.0.0.1:tank/data
	flags        = -i -K /root/.ssh/pairing/alpha_ed25519
	pair_label   = alpha
	notify       = alpha-data

[dataset:hdd/backups/arc/beta/tank/data2]
	use_template = hourly
	src          = zfsbackup-arc@10.0.0.2:tank/data2
	flags        = -i -K /root/.ssh/pairing/beta_ed25519
	pair_label   = beta
	notify       = beta-data2

[dataset:tank/plain]
	use_template = hourly
	notify       = plain

[template:keep_daily]
	prune_schedule = 45 3 * * *
	pattern        = automated_daily
	retain         = -d7
	monitor_warn   = 30h
	monitor_crit   = 48h

[prune:hdd/backups/arc/alpha]
	use_template = keep_daily
	recursive    = yes
	pair_label   = alpha
	notify       = alpha
