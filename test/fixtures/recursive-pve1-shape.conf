# Golden: the real pve1 (192.168.11.11) deployment, migrated to 'recursive'.
#
# This is not a synthetic case. It is the shape of the ONE host in the fleet
# that replicates a whole subtree, and before REV-20260807-054 it could only
# reach that shape by working around the tool: the five send templates
# deliberately carried NO prune_schedule, so the [dataset:] section would emit
# no inline prune to race the recursive [prune:] one. (Two delsnaps lines on
# the same pattern and schedule race; the loser reports "could not find any
# snapshots to destroy" and alerts.)
#
# Migration was exactly: `flags = -r -v 3` -> `recursive = atomic` + `flags = -v 3`.
#
# Verified live 2026-08-07 on the host itself: old gen-cron.sh + the old config
# and new gen-cron.sh + this migration produce BYTE-IDENTICAL output under the
# same environment, and the new generator REFUSES the unmigrated config with
# the -r message. Nothing was installed; the live config and crontab were
# md5-checked unchanged afterwards.
#
# What this pins, beyond that one migration:
#   - atomic reaches the transfer as -r while prune and monitor still get -R;
#   - a separate [prune:] section keeps working alongside a recursive dataset,
#     and is NOT merged into or replaced by it;
#   - the template split above remains legal -- this change removes the NEED
#     for the workaround, it does not outlaw the configs built on it.
[defaults]
	host_label = pve1.11

[template:hourly]
	send_schedule = 1 * * * *
	prefix        = automated_hourly_
	notify_word   = snapshot

[template:daily]
	send_schedule = 12 0 * * *
	prefix        = automated_daily_
	notify_word   = snapshot
	quiesce       = agent

[template:annual]
	send_schedule = 59 23 30 04 *
	prefix        = automated_annual_
	notify_word   = snapshot
	quiesce       = agent

[dataset:rpool/data]
	use_template = hourly,daily,annual
	recursive    = atomic
	flags        = -v 3
	notify       = rpool-data

[template:flat_prune]
	prune_schedule = 58 * * * *
	pattern        = automated_
	retain         = -h 12
	tier_label     = flat
	monitor_warn   = 90m
	monitor_crit   = 3h

[prune:rpool/data]
	use_template = flat_prune
	recursive    = yes
	notify       = rpool-data
