# Remote quiesce on a PULL dataset -- allowed since snapget.sh v2.65, which
# runs the whole freeze/snapshot/thaw on the source host in ONE remote
# invocation (own EXIT trap + detached deadman, so the thaw survives a dropped
# connection). See the REMOTE QUIESCE section in lib-zfs-snap.sh.
#
# This pins that the generator EMITS `-q agent` on the snapget.sh line. It
# cannot check the one thing that actually decides whether the job works at
# run time -- whether the SOURCE account may run qm/pct there, which needs
# root or a sudo rule on the peer -- so snapget.sh checks that itself and fails
# loudly. A config generating cleanly here is therefore necessary, not
# sufficient.
#
# The companion negative case (quiesce=sync on pull, still rejected) lives in
# test/negative/quiesce-sync-on-pull.conf.
[defaults]
	host_label = collector

[template:pq_daily]
	send_schedule  = 0 0 * * *
	prefix         = automated_daily_
	quiesce        = agent
	prune_schedule = 10 0 * * *
	pattern        = automated_daily
	retain         = -D7

[dataset:hdd/backups/pve2/rpool/data]
	use_template = pq_daily
	src          = zfsbackup-collector@192.0.2.55:rpool/data
	notify       = pve2-data
