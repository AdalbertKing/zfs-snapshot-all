# Built-in profile: Y5M12D31H24 -- 5 years of history, ONE snapshot family,
# nothing ever frozen.
#
# THE NAME IS UPPERCASE AND THAT IS THE WHOLE DECLARATION. Owner rule
# 2026-08-27, profiles/README.md: lowercase means one family per tier, each with
# its own prefix and its own counter; UPPERCASE means one family with several
# counters over it -- the GFS ladder. This is the catalogue's first uppercase
# profile. The rule had no citizen until now: `default` is that shape but is a
# named constant rather than a described one, and every other shipped profile is
# lowercase. No new suffix was invented for this file, because the convention
# for it already existed.
#
# WHY IT IS NEVER QUIESCED, AND WHY THAT IS STRUCTURE RATHER THAN A SETTING.
# On one family the "daily" snapshot IS one of the twenty-four hourly ones the
# ladder decided to keep. There is no separate daily set to freeze, so quiesce
# here cannot be per-tier: it is all twenty-four a day, or none. Twenty-four
# freezes a day is exactly the cost the lowercase profiles are split up to
# avoid -- so for one family the honest answer is none, and that is why this
# file sets no `quiesce` anywhere rather than setting one to off.
#
# WHO THIS IS FOR, and it is the gap it was added to close (2026-09-01): an
# estate that cannot quiesce at all -- guests with no agent, plain filesystems,
# datasets that are not VM disks (file shares, databases dumped by their own
# tooling), and the LVM/ext4 adaptation when it lands. The only unquiesced
# profile was `default`, and `default` stops at about a month: everything longer
# (`m12`, `y5`) existed solely in lowercase profiles that freeze every tier
# above hourly. So "five years, and I cannot freeze anything" had no answer in
# the catalogue and meant hand-editing a profile.
#
# WHAT YOU GIVE UP against `y5m12d31h24-gfs`: named series. There is no
# `automated_monthly_` here to point a restore at or to prune on its own -- the
# ladder keeps hourly snapshots and thins them with age, so an eleven-month-old
# snapshot is simply an `automated_hourly_` that survived. If the families must
# be nameable, take the lowercase sibling, and you will be freezing guests to
# get it.
#
# COVERAGE: 24 hourly buckets, then 31 daily, then 12 monthly, then 5 yearly --
# consecutive and non-overlapping, exactly the `-G` cascade delsnaps.sh
# implements. `keep = 24` means "one an hour for the last twenty-four hours",
# not "the twenty-four newest".
#
# NOTHING IS SENT ANYWHERE: no `dst`, and a profile may not carry one. Pair it
# with `--target=''` for the single-host shape, or with a relationship to copy.

[profile]
	description = 5 lat historii, JEDNA rodzina, drabina GFS, nic nie zamrazane
	version     = 1

# ---- THE ONE FAMILY ----------------------------------------------------------
# Created hourly and never frozen. Every rung below thins THIS family; nothing
# else is created.
[template:solo_hourly]
	send_schedule  = 5 * * * *
	prefix         = automated_hourly_
	notify_word    = backup

# ---- THE LADDER --------------------------------------------------------------
# Four rungs, one cadence each, all pruning the same family. The retention
# letter is derived from the tier cadence (keep_yearly -> -Y), so these names
# are load-bearing, not decoration.
[template:keep_hourly]
	prune_schedule = 25 * * * *
	pattern        = automated_hourly
	keep           = 24
	notify_word    = prune
	monitor_warn   = 90m
	monitor_crit   = 150m

[template:keep_daily]
	prune_schedule = 25 * * * *
	pattern        = automated_hourly
	keep           = 31
	notify_word    = prune

[template:keep_monthly]
	prune_schedule = 25 * * * *
	pattern        = automated_hourly
	keep           = 12
	notify_word    = prune

[template:keep_yearly]
	prune_schedule = 25 * * * *
	pattern        = automated_hourly
	keep           = 5
	notify_word    = prune

[dataset]
	use_template = solo_hourly

# gfs_pattern is `automated_` and not `automated_hourly_`, deliberately and for
# the same reason `default` does it: the ladder then also adopts any other
# `automated_*` family already on the scope instead of leaving it unpruned
# beside a ladder that ignores it. Every contributing tier's `pattern` must
# start with it, which `automated_hourly` does.
[prune]
	use_template = keep_hourly,keep_daily,keep_monthly,keep_yearly
	gfs          = yes
	gfs_pattern  = automated_

# ---- RESERVED FAMILIES -------------------------------------------------------
# Config-wide floors, identical in every shipped profile and identical on
# purpose: they are not this profile's opinion. __replicate_ is pvesr's, vzdump
# is the backup job's, __migration__ belongs to a live migration -- none of them
# ours to delete.
[excluded:__replicate_]
	keep = 2

[excluded:vzdump]
	keep = 2

[excluded:__migration__]
	keep = 2
