# A leaf already covered by a recursive [prune:<parent>] must be able to carry a
# monitor WITHOUT emitting a second, racing delsnaps line: prune = no.
[defaults]
	host_label = t
[template:store_hourly]
	prune_schedule = 51 * * * *
	pattern        = automated_hourly
	retain         = -H24
	tier_label     = hourly
[prune:tank/store]
	use_template = store_hourly
	recursive    = yes
	notify       = store
[prune:tank/store/leaf]
	use_template = store_hourly
	prune        = no
	notify       = leaf
	monitor_warn = 200m
	monitor_crit = 260m
