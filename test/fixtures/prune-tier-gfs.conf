# Golden (2026-10-18): a tier's `gfs = yes` in its TEMPLATE reaches a SOURCE-side
# [prune:] (side = source) that sets no gfs of its own -- that tier's line carries
# -G (a per-tier ladder, as in [dataset:]). Until then [prune:] read gfs from the
# section only, so a GFS relationship's source prune ran as flat counts.
#  - source [prune:] over two tiers, hourly gfs=yes, daily without -> -G only on hourly
#  - a LANDING (no side) with the same templates -> flat: a per-tier ladder empties a
#    family after downtime, and a landing is the backup itself
#  - a source section that says `gfs = no` -> flat (the section wins)
[defaults]
	host_label = arc

[template:h_gfs]
	prune_schedule = 21 * * * *
	pattern        = automated_hourly
	retain         = -H24
	tier_label     = hourly
	gfs            = yes

[template:d_flat]
	prune_schedule = 31 1 * * *
	pattern        = automated_daily
	retain         = -D7
	tier_label     = daily

[prune:zfsbackup-arc@10.0.0.9:hdd/src]
	use_template = h_gfs,d_flat
	side         = source
	ssh_flags    = -K /k -k /kh
	notify       = src

[prune:tank/landing]
	use_template = h_gfs,d_flat
	notify       = landing

[prune:zfsbackup-arc@10.0.0.8:hdd/flatwins]
	use_template = h_gfs,d_flat
	side         = source
	gfs          = no
	notify       = flat
