# Golden: quiesce = <mode>,strict -> snapsend.sh -q <mode>,strict.
#
# The qualifier that survived the 2026-08-27 default flip. Before it, `,degrade`
# was the field that changed something and a bare mode meant "refuse"; now a bare
# mode degrades and `,strict` is the field that changes something. The RENDER
# rule is unchanged either way: whatever the operator wrote in `quiesce` reaches
# the engine inside the same `-q` argument, unaltered.
#
# What this fixture pins is the render. Whether the engine then refuses, and from
# which failures, is decided at run time and pinned by test/quiesce.
[defaults]
	host_label = arc
	dst        = backup/arc

[template:hourly]
	send_schedule = 59 * * * *
	prefix        = automated_

# The three accepted forms, one per dataset.
[dataset:tank/vm-301-disk-0]
	use_template = hourly
	quiesce      = auto,strict
	notify       = vm301

[dataset:tank/vm-302-disk-0]
	use_template = hourly
	quiesce      = agent,strict
	notify       = vm302

[dataset:tank/subvol-303-disk-0]
	use_template = hourly
	quiesce      = sync,strict
	notify       = ct303

# NEGATIVE CONTROL, in the golden itself: the same modes WITHOUT the qualifier
# must render exactly as they always did. A generator that started appending
# `,strict` -- or `,degrade` -- to spell out the default would show up here, and
# it would matter: the cron line is what an operator reads to find out which
# answer this tier gets.
[dataset:tank/plain-auto]
	use_template = hourly
	quiesce      = auto
	notify       = plainauto

[dataset:tank/plain-none]
	use_template = hourly
	notify       = plainnone
