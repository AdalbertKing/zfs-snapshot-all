# X27 (wlasciciel 2026-10-14): relacja local w NOWYM zapisie -- blok [relation:] + 'relation ='.
# Para z relation-local-old.conf -- ten sam .expected.
[defaults]
	host_label = pve9b

[excluded:vzdump]
	keep = 2

[relation:L]
	tiers = hourly, daily
	hourly.send_schedule  = 1 * * * *
	hourly.prefix         = automated_hourly_
	hourly.notify_word    = snapshot
	hourly.prune_schedule = 21 * * * *
	hourly.pattern        = automated_hourly
	hourly.target_retain  = -H24
	hourly.source_retain  = -H12
	hourly.monitor        = 90m 150m
	daily.send_schedule   = 11 1 * * *
	daily.prefix          = automated_daily_
	daily.notify_word     = snapshot
	daily.prune_schedule  = 31 1 * * *
	daily.pattern         = automated_daily
	daily.retain          = -D30
	daily.quiesce         = auto,degrade
	daily.monitor         = 30h 48h

[dataset:hdd/ct]
	relation     = L
	side         = source
	dst          = hdd/backups
	recursive    = flat
	exclude_family = vzdump
	notify       = local-ct

[prune:hdd/backups/hdd/ct]
	relation     = L
	side         = target
	recursive    = yes
	notify       = local-ct
