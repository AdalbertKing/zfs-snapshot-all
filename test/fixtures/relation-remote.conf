# X27 (wlasciciel 2026-10-14): relacja remote w NOWYM zapisie -- blok [relation:] + 'relation ='.
# Para z relation-remote-old.conf -- ten sam .expected.
[defaults]
	host_label = pve10

[relation:R]
	tiers = hourly
	hourly.pattern               = automated_hourly
	hourly.prune_schedule        = 21 * * * *
	hourly.target_send_schedule  = 1 * * * *
	hourly.target_prefix         = automated_hourly_
	hourly.target_retain         = -H24
	hourly.target_monitor        = 90m 150m
	hourly.source_retain         = -H12

[dataset:hdd/backups/192.168.28.98/hdd/data]
	relation     = R
	side         = target
	src          = zfsbackup-pve10@192.168.28.98:hdd/data
	notify       = r-data

[prune:zfsbackup-pve10@192.168.28.98:hdd/data]
	relation     = R
	side         = source
	prune_schedule_hourly = 27 * * * *
	notify       = r-data
