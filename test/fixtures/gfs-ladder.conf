# Golden: gfs=yes on a [prune:] section -- one combined delsnaps.sh -G line
# covering every tier in use_template, instead of one flat-count line per
# tier. Each tier's own 'pattern' must still drive its own monitor untouched
# (monitor_warn/crit on store_hourly/store_daily below) -- gfs does not
# change monitoring, only how retention pruning is grouped.
[defaults]
	host_label = testhost

[template:store_hourly]
	prune_schedule = 51 * * * *
	pattern        = automated_hourly
	retain         = -H24
	monitor_warn   = 90m
	monitor_crit   = 3h

[template:store_daily]
	prune_schedule = 53 0 * * *
	pattern        = automated_daily
	retain         = -D7

[template:store_weekly]
	prune_schedule = 55 0 * * 0
	pattern        = automated_weekly
	retain         = -W4

[prune:backup/store]
	use_template = store_hourly,store_daily,store_weekly
	recursive    = yes
	gfs          = yes
	gfs_pattern  = automated_
	notify       = store
