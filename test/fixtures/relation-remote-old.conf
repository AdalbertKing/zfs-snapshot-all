# X27 (wlasciciel 2026-10-14): relacja remote w STARYM zapisie ([template:] + use_template).
# Para z relation-remote.conf -- ten sam .expected (ten sam crontab z obu zapisow).
[defaults]
	host_label = pve10

[template:relacja-R__hourly]
	send_schedule  = 1 * * * *
	prefix         = automated_hourly_
	prune_schedule = 21 * * * *
	pattern        = automated_hourly
	retain         = -H24
	monitor_warn   = 90m
	monitor_crit   = 150m

[template:relacja-R__src_hourly]
	prune_schedule = 21 * * * *
	pattern        = automated_hourly
	retain         = -H12

[dataset:hdd/backups/192.168.28.98/hdd/data]
	use_template = relacja-R__hourly
	src          = zfsbackup-pve10@192.168.28.98:hdd/data
	pair_label   = R
	notify       = r-data

[prune:zfsbackup-pve10@192.168.28.98:hdd/data]
	use_template = relacja-R__src_hourly
	pair_label   = R
	prune_schedule_relacja-R__src_hourly = 27 * * * *
	notify       = r-data
