# Golden: Phase 3.5 -- gfs=yes with 'gfs_pattern' omitted across the whole
# section/defaults chain is now the deliberate prefixless single-series GFS
# case: it reaches delsnaps.sh as an explicit empty positional PATTERN
# argument (matches every otherwise-eligible snapshot on the scope, subject
# to the same protected-prefix/overlap guards as always), not a refusal.
# Was test/negative/gfs-no-pattern.conf before Phase 3.5 -- see
# negative/blank-gfs-pattern.conf for the still-refused present-but-blank
# case this is distinct from.
[defaults]
	host_label = t

[template:hourly]
	prune_schedule = 51 * * * *
	pattern        = automated_hourly
	retain         = -H24

[prune:tank/store]
	use_template = hourly
	gfs          = yes
	notify       = x
