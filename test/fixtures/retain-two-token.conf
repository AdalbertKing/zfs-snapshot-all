# The two-token retain form '-h 12' -- flag, space, number -- is legal:
# delsnaps' own parser accepts it and jobs.11.11.v4.conf carries it live.
# The first version of the basket-A3 lint refused it, caught only because
# every fleet config is rendered as a regression control before shipping a
# generator change. This golden makes that control repo-local.
[defaults]
	host_label = t
[template:hourly]
	send_schedule  = 37 * * * *
	prefix         = automated_hourly_
	prune_schedule = 51 * * * *
	pattern        = automated_hourly_
	retain         = -h 12
	monitor_warn   = 90m
	monitor_crit   = 3h
[dataset:tank/vm1]
	use_template = hourly
	notify       = x
