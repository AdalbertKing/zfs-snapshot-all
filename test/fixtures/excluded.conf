# Golden: [excluded:<prefix>] sections. They set how many of the NEWEST
# snapshots carrying a Proxmox-reserved prefix delsnaps.sh must leave alone,
# per dataset -- and the resulting -P flags ride on EVERY snapshot-prune line
# the config produces, because protection is a property of the snapshot name
# rather than of any one scope.
#
# Deliberately NOT emitted onto the -B (bookmark) line: the reserved-prefix
# guard never applied to bookmarks in the first place.
[defaults]
	host_label = arc

[excluded:__replicate_]
	keep = 1

[excluded:vzdump]
	keep = all

[template:hourly]
	prune_schedule = 51 * * * *
	pattern        = automated_hourly_
	keep           = 24

[dataset:tank/vm1]
	use_template = hourly

[prune:tank/store]
	use_template = hourly
	notify       = store

[prune-bookmarks:tank/vm1]
	schedule = 30 4 * * *
	age      = -d30
	notify   = orphans
