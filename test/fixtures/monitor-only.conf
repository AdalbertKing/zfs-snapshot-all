# Golden: a config made ONLY of monitor carriers. Every [prune:] section here
# sets prune = no, so zero send rules and zero prune rules resolve -- and the
# block is still valid and useful: a host that WATCHES datasets whose
# retention is run somewhere else (a backup target pruned by the sender, a
# read-only replica). Counting only send/prune rules used to reject this as
# "no rules resolved" while sitting on a block it had already generated.
[defaults]
	host_label = watchonly

[template:hourly]
	prune_schedule = 51 * * * *
	pattern        = automated_hourly_
	keep           = 24
	monitor_warn   = 90m
	monitor_crit   = 3h

[prune:tank/watched1]
	use_template = hourly
	prune        = no
	notify       = watched1

[prune:tank/watched2]
	use_template = hourly
	prune        = no
	notify       = watched2
