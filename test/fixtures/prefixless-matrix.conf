# Golden: Phase 3.5 -- all four create/existing x prefix/no-prefix cells at
# the generated-command boundary. 'prefix' omitted across the whole
# ds/tmpl/defaults chain is the new deliberate no-prefix case (resolves to
# "", reaching snapsend.sh as an explicit -m "" -- identical to -m never
# given at all). Present-but-blank still refuses (see negative/blank-prefix
# and negative/blank-gfs-pattern) -- unchanged since c90f6d1.
#
# create-prefixed   tank/create-prefixed   flags has no -e, prefix set
# create-noprefix   tank/create-noprefix   flags has no -e, prefix omitted
# existing-prefixed tank/existing-prefixed flags has -e,    prefix set
# existing-noprefix tank/existing-noprefix flags has -e,    prefix omitted
[defaults]
	host_label = arc
	dst        = backup/arc

[template:create-prefixed]
	send_schedule = 0 * * * *
	prefix        = automated_

[template:create-noprefix]
	send_schedule = 0 * * * *

[template:existing-prefixed]
	send_schedule = 15 * * * *
	prefix        = automated_

[template:existing-noprefix]
	send_schedule = 15 * * * *

[dataset:tank/create-prefixed]
	use_template = create-prefixed
	notify       = cp

[dataset:tank/create-noprefix]
	use_template = create-noprefix
	notify       = cn

[dataset:tank/existing-prefixed]
	use_template = existing-prefixed
	flags        = -e
	notify       = ep

[dataset:tank/existing-noprefix]
	use_template = existing-noprefix
	flags        = -e
	notify       = en
