# Golden, not negative: unlike pattern/retain/prefix above, [prune-bookmarks:]
# already has a sensible non-empty DEFAULT ("tgt-") when 'pattern' is omitted
# entirely. A BLANK value ("pattern = " with nothing after it) must fall back
# to that same default, not die -- it is the one field where "blank" and
# "absent" both mean the same forgiving thing by design.
[defaults]
	host_label = arc
[prune-bookmarks:tank/blankpat]
	schedule  = 30 4 * * *
	age       = -d30
	pattern   =
	notify    = orphans
