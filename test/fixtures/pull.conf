# Golden: snapget.sh (pull) generation alongside a normal push dataset in the
# same config -- this is the coverage gap that was missing entirely before
# v4.22 (gen-cron only ever emitted snapsend.sh). Three datasets:
#
# push        ordinary push, inherits [defaults] dst        -> snapsend.sh, -A
# pull        blanks the inherited dst, sets a REMOTE src    -> snapget.sh, -A
# pull-local  blanks dst, sets a LOCAL src                   -> snapget.sh, no -A
[defaults]
	host_label = pve1
	dst        = root@far:backup/pve1

[template:hourly]
	send_schedule = 59 * * * *
	prefix        = automated_

[dataset:tank/push]
	use_template = hourly
	flags        = -e -v 3
	notify       = push

[dataset:tank/pull]
	use_template = hourly
	dst          =
	src          = root@source:tank/remote
	flags        = -e -v 3
	notify       = pull

[dataset:tank/pull-local]
	use_template = hourly
	dst          =
	src          = tank/localsrc
	flags        = -e -v 3
	notify       = pull local
