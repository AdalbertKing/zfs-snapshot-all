# Golden: snapget.sh (pull) generation alongside a normal push dataset in the
# same config. Four datasets, covering v4.24's flipped addressing (src='s
# path is now the LITERAL remote name, and the section's own path must end
# with it -- gen-cron derives the local base automatically):
#
# push          ordinary push, inherits [defaults] dst          -> snapsend.sh, -A
# pull          local path ends with src's literal remote name  -> snapget.sh, -A, base derived
# pull-noauto   same shape, autotune=no                         -> snapget.sh, no -A
# syncsrc       local path EQUALS src's remote name exactly     -> snapget.sh, sync (no base arg)
[defaults]
	host_label = pve1
	dst        = root@far:backup/pve1

[template:hourly]
	send_schedule = 59 * * * *
	prefix        = automated_

[dataset:tank/push]
	use_template = hourly
	flags        = -e -v 3
	notify       = push

[dataset:tank/pull]
	use_template = hourly
	dst          =
	src          = root@source:pull
	flags        = -e -v 3
	notify       = pull

[dataset:tank/pull-noauto]
	use_template = hourly
	dst          =
	src          = root@source:pull-noauto
	autotune     = no
	flags        = -e -v 3
	notify       = pull no autotune

[dataset:tank/syncsrc]
	use_template = hourly
	dst          =
	src          = root@source:tank/syncsrc
	flags        = -e -v 3
	notify       = pull sync
