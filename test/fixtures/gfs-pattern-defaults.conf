# Golden: gfs_pattern inherited from [defaults].
#
# The other direction of the allow-list/lookup drift. build_prune_section has
# always resolved gfs_pattern with 'defaults' as its last layer, but the
# allow-list refused the field there, so that layer was unreachable: a host that
# runs one ladder prefix across several [prune:] sections had to repeat it in
# every one of them, and writing it once at the top was rejected with "does not
# read it here" even though the code did.
#
# This pins that the inherited value actually reaches the emitted -G line, not
# merely that the config is accepted -- "the text parses" is the appearance this
# project keeps mistaking for the property.
[defaults]
	host_label  = testhost
	gfs_pattern = automated_

[template:keep_hourly]
	prune_schedule = 21 * * * *
	pattern        = automated_hourly
	retain         = -H24

[template:keep_daily]
	prune_schedule = 23 0 * * *
	pattern        = automated_daily
	retain         = -D7

[prune:backup/one]
	use_template = keep_hourly,keep_daily
	gfs          = yes
	notify       = one

[prune:backup/two]
	use_template = keep_hourly,keep_daily
	recursive    = yes
	gfs          = yes
	notify       = two
