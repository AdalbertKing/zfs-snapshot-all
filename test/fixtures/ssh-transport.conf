# Golden: the ssh transport fields (-p/-k/-c) on all three kinds of line that
# can open a connection -- a send with a remote dst, a remote [prune:] scope, and
# a remote [prune-bookmarks:] scope -- plus the two things that must NOT happen:
#
#   * tank/b sets a different ssh_port, so it must NOT merge into tank/a's send
#     line even though schedule, dst, prefix and flags all match.
#   * [prune:tank/local] is a local scope, so the inherited [defaults] transport
#     must be dropped from that line entirely (it warns to stderr, which the
#     golden comparison also captures).
#
# known_hosts points at /dev/null on purpose: gen-cron warns when the file does
# not exist yet, and that warning would otherwise make this golden depend on
# whether the machine running the suite happens to have the path. /dev/null is
# absolute and exists everywhere, so the output is the same on every box.
[defaults]
	host_label  = testhost
	dst         = backup@store:hdd/backups/testhost
	ssh_port    = 2222
	known_hosts = /dev/null

[template:hourly]
	send_schedule  = 5 * * * *
	prefix         = automated_hourly_
	notify_word    = snapshot
	prune_schedule = 35 * * * *
	pattern        = automated_hourly
	keep           = 24

[template:store_daily]
	prune_schedule = 50 0 * * *
	pattern        = automated_daily
	retain         = -D30
	tier_label     = daily

[dataset:tank/a]
	use_template = hourly
	notify       = groupA
	ssh_cipher   = aes128-gcm@openssh.com

[dataset:tank/b]
	use_template = hourly
	notify       = groupB
	ssh_port     = 2200
	ssh_cipher   = aes128-gcm@openssh.com

# Remote store: pruned over ssh on the same port as the sends. No monitor
# thresholds here -- check-snap-age.sh cannot reach a remote scope, and setting
# them would be rejected.
[prune:backup@store:hdd/backups/testhost]
	use_template = store_daily
	recursive    = yes
	notify       = store

# Local scope inheriting remote defaults: the flags must not appear.
[prune:tank/local]
	use_template = store_daily
	notify       = local

# Bookmarks live on the source, which here is the far side.
[prune-bookmarks:backup@store:hdd/backups/testhost]
	schedule    = 15 4 * * *
	age         = -d30
	recursive   = yes
	ssh_cipher  = aes128-gcm@openssh.com
	notify      = marks
