# X27 (wlasciciel 2026-10-14): relacja local w STARYM zapisie ([template:] + use_template).
# Para z relation-local.conf -- ten sam .expected (ten sam crontab z obu zapisow).
[defaults]
	host_label = pve9b

[excluded:vzdump]
	keep = 2

[template:relacja-L__hourly]
	send_schedule  = 1 * * * *
	prefix         = automated_hourly_
	notify_word    = snapshot
	prune_schedule = 21 * * * *
	pattern        = automated_hourly
	retain         = -H24
	monitor_warn   = 90m
	monitor_crit   = 150m

[template:relacja-L__daily]
	send_schedule  = 11 1 * * *
	prefix         = automated_daily_
	notify_word    = snapshot
	prune_schedule = 31 1 * * *
	pattern        = automated_daily
	retain         = -D30
	quiesce        = auto,degrade
	monitor_warn   = 30h
	monitor_crit   = 48h

[template:relacja-L__lsrc_hourly]
	send_schedule  = 1 * * * *
	prefix         = automated_hourly_
	notify_word    = snapshot
	prune_schedule = 21 * * * *
	pattern        = automated_hourly
	retain         = -H12
	monitor_warn   = 90m
	monitor_crit   = 150m

[template:relacja-L__lsrc_daily]
	send_schedule  = 11 1 * * *
	prefix         = automated_daily_
	notify_word    = snapshot
	prune_schedule = 31 1 * * *
	pattern        = automated_daily
	retain         = -D30
	quiesce        = auto,degrade
	monitor_warn   = 30h
	monitor_crit   = 48h

[dataset:hdd/ct]
	use_template = relacja-L__lsrc_hourly,relacja-L__lsrc_daily
	dst          = hdd/backups
	recursive    = flat
	pair_label   = L
	exclude_family = vzdump
	notify       = local-ct

[prune:hdd/backups/hdd/ct]
	use_template = relacja-L__hourly,relacja-L__daily
	recursive    = yes
	pair_label   = L
	notify       = local-ct
