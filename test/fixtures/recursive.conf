# Golden: the 'recursive' field (REV-20260807-054).
#
# The defect this pins: recursion used to be smuggled into a [dataset:] as
# `flags = -R`, which reached ONLY the transfer. The inline prune and the
# monitor generated from the same section stayed on the named dataset, so a
# newly created child was replicated forever, never pruned, never watched --
# and every run reported success. One declaration must now move all three.
#
# What must hold in the expected output:
#   - recursive = no (or absent) -> no -R/-r anywhere for that dataset;
#   - flat   -> snapsend/snapget -R, delsnaps -R, check-snap-age -R;
#   - atomic -> snapsend/snapget -r, but STILL delsnaps -R / check-snap-age -R
#     (neither has an atomic mode, and neither needs one);
#   - BOTH directions carry it: push (dst) and pull (src) alike. It is a
#     property of the dataset, not of which way the bytes move;
#   - a recursive dataset never merges into a non-recursive prune or monitor
#     line, and vice versa -- 'recursive' is part of both group keys, because
#     a delsnaps line carries -R for every dataset it names or for none;
#   - two datasets that agree on recursion DO still merge (flat+atomic share
#     the same -R prune line here) -- the scope is what has to match, not the
#     transfer mode that produced it.
[defaults]
	host_label = arc

[template:hourly]
	send_schedule   = 7 * * * *
	prefix          = automated_
	pattern         = automated_
	prune_schedule  = 30 2 * * *
	keep            = 24
	monitor_warn    = 90m
	monitor_crit    = 3h

# --- push side ---------------------------------------------------------------

[dataset:tank/single]
	use_template = hourly
	notify       = single

[dataset:tank/flatpush]
	use_template = hourly
	recursive    = flat
	notify       = flatpush

[dataset:tank/atompush]
	use_template = hourly
	recursive    = atomic
	notify       = atompush

# Explicit 'no' must read exactly like an absent field, not like a third state.
[dataset:tank/explicitno]
	use_template = hourly
	recursive    = no
	notify       = explicitno

# --- pull side ---------------------------------------------------------------
# Same field, same meaning, on a snapget line.

[dataset:hdd/backups/arc/flatpull/tank/data]
	use_template = hourly
	src          = zfsbackup-arc@10.0.0.1:tank/data
	recursive    = flat
	notify       = flatpull

[dataset:hdd/backups/arc/atompull/tank/data2]
	use_template = hourly
	src          = zfsbackup-arc@10.0.0.2:tank/data2
	recursive    = atomic
	notify       = atompull
