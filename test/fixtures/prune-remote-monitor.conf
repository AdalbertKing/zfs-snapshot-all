# REV-20261017-152 (round 2): a monitor on a REMOTE [prune:] scope is read over
# ssh by check-snap-age.sh, with the section's ssh_flags. It used to be refused
# (check-snap-age.sh was local-only). Two scopes with a DIFFERENT identity must
# give two monitor lines -- one line carries one set of ssh options; a third
# scope with the SAME identity and host as the first joins the first's line.
[defaults]
	host_label = t
[template:hourly]
	prune_schedule = 51 * * * *
	pattern        = automated_hourly
	retain         = -H24
	monitor_warn   = 90m
	monitor_crit   = 3h
[prune:zb@hostA:tank/x]
	use_template = hourly
	notify       = x
	ssh_flags    = -K /k/a -k /k/a_known -O HostKeyAlias=zfs-client-a
[prune:zb@hostA:tank/y]
	use_template = hourly
	notify       = x
	ssh_flags    = -K /k/a -k /k/a_known -O HostKeyAlias=zfs-client-a
[prune:zb@hostB:tank/x]
	use_template = hourly
	notify       = x
	ssh_flags    = -K /k/b -k /k/b_known -O HostKeyAlias=zfs-client-b
