# Golden: sync-mode dst/src (bare user@host, no ':') must be recognized as
# remote for -A/compression-warning purposes exactly like host:base is --
# gen-cron does its OWN remote-ness guess (it never calls into
# snapsend.sh/snapget.sh's parser), so this is a separate thing to get right.
#
# push-base    dst = host:base       -> -A added (existing behavior)
# push-sync    dst = bare user@host  -> -A added (the fix)
# push-local   dst = local path      -> -A NOT added
# pull-sync    src = host:<local path's own name>, no local base emitted (v4.24+
#              flipped addressing: src is always a literal remote name now,
#              never a bare host; sync is the local path matching it exactly)
[defaults]
	host_label = pve1

[template:hourly]
	send_schedule = 59 * * * *
	prefix        = automated_

[dataset:tank/push-base]
	use_template = hourly
	dst          = user@far:backup/base
	notify       = push base

[dataset:tank/push-sync]
	use_template = hourly
	dst          = user@far
	notify       = push sync

[dataset:tank/push-local]
	use_template = hourly
	dst          = backup/local
	notify       = push local

[dataset:tank/pull-sync]
	use_template = hourly
	src          = user@far:tank/pull-sync
	notify       = pull sync
