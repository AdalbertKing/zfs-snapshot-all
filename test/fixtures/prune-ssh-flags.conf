# Golden: ssh_flags on [prune:]/[prune-bookmarks:] sections. Covers:
#  - a remote [prune:] scope with ssh_flags -> flags land in the emitted line
#  - ssh_flags on a LOCAL [prune:] scope -> WARNING (stderr, not fatal)
#  - two remote [prune-bookmarks:] scopes sharing schedule/pattern/age/recursive
#    but with DIFFERENT ssh_flags -> must NOT merge into one delsnaps.sh line
#  - a third bookmark scope with the SAME ssh_flags as the first -> DOES merge
[defaults]
	host_label = arc

[template:hourly]
	prune_schedule = 51 * * * *
	pattern        = automated_hourly
	retain         = -H24
	tier_label     = hourly

[prune:root@192.168.28.9:hdd/pulled]
	use_template = hourly
	ssh_flags    = -p 2222 -k /etc/zfs-known-hosts -K /etc/zfs-backup-id_ed25519
	notify       = pulled

[prune:tank/local]
	use_template = hourly
	ssh_flags    = -c aes128-gcm@openssh.com
	notify       = local

[prune-bookmarks:root@pve9:tank/src1]
	schedule  = 30 4 * * *
	age       = -d30
	ssh_flags = -p 2222
	notify    = orphans

[prune-bookmarks:root@pve9:tank/src1b]
	schedule  = 30 4 * * *
	age       = -d30
	ssh_flags = -p 2222
	notify    = orphans

[prune-bookmarks:root@pve10:tank/src2]
	schedule  = 30 4 * * *
	age       = -d30
	ssh_flags = -p 2200
	notify    = orphans
