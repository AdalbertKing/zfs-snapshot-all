# Expert example: hand-authored prune schedules/patterns on a pure backup store
# (a host that RECEIVES pushes and never creates snapshots of its own).
#
# There is no [dataset:] section here at all -- nothing is snapshotted or sent.
# Retention is expressed directly with standalone [prune:] sections whose
# templates carry only prune_schedule + pattern + retain. Three things worth
# copying:
#   * two independent prune rules on the same subtree, each on its own cron and
#     its own snapshot-name pattern (automated_hourly vs automated_weekly);
#   * a monitor-only carrier: [prune:backup/store/hot] sets prune = no, so it
#     emits NO delsnaps line (the recursive parent already prunes that subtree)
#     but DOES emit a staleness check. Repeating the prune rule here instead
#     would race the parent's line on the same snapshots and alert;
#   * [prune-bookmarks:] cleaning orphaned send bookmarks on an age threshold,
#     unrelated to any snapshot tier -- pick an age well past your longest real
#     backup gap.
#
# Validate/preview:  ./gen-cron.sh -c docs/examples/manual-prune.conf
[defaults]
	host_label = store1

[template:store_hourly]
	prune_schedule = 51 * * * *
	pattern        = automated_hourly
	retain         = -H72
	monitor_warn   = 90m
	monitor_crit   = 3h

[template:store_weekly]
	prune_schedule = 55 3 * * 0
	pattern        = automated_weekly
	retain         = -W12

[prune:backup/store]
	use_template = store_hourly,store_weekly
	recursive    = yes
	notify       = store

# Covered by the recursive prune above; here only to watch a hot leaf's freshness.
[prune:backup/store/hot]
	use_template = store_hourly
	prune        = no
	notify       = hot-monitor

[prune-bookmarks:tank/akta]
	schedule = 30 4 * * *
	age      = -d30
	notify   = orphans
