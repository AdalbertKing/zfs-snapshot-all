# Expert example: independent hourly + daily retention, count-based, NO GFS.
#
# Two tiers on one dataset, each with its own send cadence AND its own
# count-based retention (keep = N -> -<TIER_LETTER><N> on delsnaps.sh). The
# tiers do not cascade into a grandfather-father-son ladder: 24 hourly and 14
# daily snapshots are kept as two independent counts. Reach for gfs = yes on a
# [prune:] section only when you actually want a single cascading ladder.
#
# Validate/preview:  ./gen-cron.sh -c docs/examples/independent-tiers.conf
[defaults]
	host_label = office1

[template:hourly]
	send_schedule  = 5 * * * *
	prefix         = automated_hourly_
	notify_word    = snapshot
	prune_schedule = 35 * * * *
	pattern        = automated_hourly
	keep           = 24

[template:daily]
	send_schedule  = 10 0 * * *
	prefix         = automated_daily_
	notify_word    = snapshot
	prune_schedule = 40 0 * * *
	pattern        = automated_daily
	keep           = 14

[dataset:tank/vm-100-disk-0]
	use_template = hourly,daily
	flags        = -e
	notify       = vm100
