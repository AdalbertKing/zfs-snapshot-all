# Expert example: intentionally shorter LOCAL retention than the backup store
# keeps (the "Kancelaria" pattern).
#
# The source dataset holds only a short local safety window -- 48 hourly
# snapshots (two days) -- because the working pool is not where long history is
# supposed to live. Every snapshot is still sent to the store, and the store's
# own [prune:] keeps a long daily history (-D90). Local disk stays lean; the
# archive is deep. This file shows both sides on one host for clarity; the
# common production shape is the same two rules split across two hosts (source
# self-prune short, store prune long), which is fine -- retention is per-dataset
# and each side owns its own.
#
# Validate/preview:  ./gen-cron.sh -c docs/examples/short-local-long-store.conf
[defaults]
	host_label = kancelaria
	dst        = backup/kancelaria

[template:hourly]
	send_schedule  = 7 * * * *
	prefix         = automated_hourly_
	prune_schedule = 37 * * * *
	pattern        = automated_hourly
	keep           = 48

[template:store_daily]
	prune_schedule = 50 1 * * *
	pattern        = automated_daily
	retain         = -D90

[dataset:tank/akta]
	use_template = hourly
	flags        = -e
	notify       = akta

[prune:backup/kancelaria]
	use_template = store_daily
	recursive    = yes
	notify       = store
