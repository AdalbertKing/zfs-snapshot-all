# Expert example: quiesce only where a guest can tolerate a freeze.
#
# quiesce is per-dataset and never inferred (unlike -A): whether a guest can be
# briefly frozen, and what that write stall costs, is not visible from a dataset
# name. So it is opt-in, dataset by dataset, and becomes -q <mode> on the send.
#   agent  -> qemu-guest-agent fsfreeze (a VM that runs the agent)
#   sync   -> pct/container-level quiesce (an LXC container)
#   auto   -> let snapsend.sh pick per guest type
# A dataset with no quiesce line snapshots exactly as before (crash-consistent).
# Because the three datasets resolve different -q, they stay three separate send
# lines instead of merging into one.
#
# Validate/preview:  ./gen-cron.sh -c docs/examples/selective-quiesce.conf
[defaults]
	host_label = office1
	dst        = backup/office1

[template:hourly]
	send_schedule = 59 * * * *
	prefix        = automated_

[dataset:tank/vm-101-disk-0]
	use_template = hourly
	quiesce      = agent
	notify       = vm101

[dataset:tank/subvol-102-disk-0]
	use_template = hourly
	quiesce      = sync
	notify       = ct102

# No quiesce line: crash-consistent snapshot, unchanged command.
[dataset:tank/scratch]
	use_template = hourly
	notify       = scratch
