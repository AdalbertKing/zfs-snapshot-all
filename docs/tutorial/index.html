<title>zfs-snapshot-all: tutorial</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:14px/1.5 "DejaVu Sans Mono",Consolas,"Liberation Mono","Courier New",monospace}
a{color:var(--link)}
code{color:var(--hot)}
.top{position:sticky;top:0;z-index:5;background:var(--bar);color:var(--barfg);display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:4px 16px;border-bottom:2px solid var(--frame)}
.top b{color:var(--barhot)}
.seg button{font:inherit;background:var(--panel);color:var(--fg);border:1px solid var(--frame);padding:0 8px;margin-left:-1px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--hot);color:var(--bar)}
main{max-width:1180px;margin:0 auto;padding:12px 16px 40px}
.box{border:2px double var(--frame);background:var(--panel);margin:16px 0;padding:0 12px 12px;position:relative}
.box>h2,.box>h3{display:inline-block;margin:0 0 4px;transform:translateY(-.8em);background:var(--panel);padding:0 6px;color:var(--title);font-size:15px}
.box>h3{font-size:14px}
p{margin:.4em 0 .7em}
.muted{color:var(--muted)}
.warn{color:var(--warn)}
table.t{border-collapse:collapse;width:100%;margin:6px 0}
table.t td,table.t th{border:1px solid var(--line);padding:2px 8px;vertical-align:top;text-align:left}
table.t th{color:var(--title);font-weight:normal}
.build{display:grid;grid-template-columns:minmax(260px,360px) 1fr;gap:14px;align-items:start}
@media (max-width:820px){.build{grid-template-columns:1fr}}
.build>*,.both>*,.pane{min-width:0}
.row{margin:0 0 10px}
.row .lbl{color:var(--title);display:block;margin-bottom:3px}
.blocks{display:flex;flex-wrap:wrap;gap:6px}
.blk{font:inherit;text-align:left;background:var(--bg);color:var(--fg);border:2px solid var(--frame);padding:3px 8px;cursor:pointer;max-width:100%}
.blk small{display:block;color:var(--muted);font-size:12px}
.blk[aria-pressed=true]{background:var(--hot);color:var(--bar);border-color:var(--hot)}
.blk[aria-pressed=true] small{color:var(--bar)}
.blk:disabled{opacity:.42;cursor:not-allowed;border-style:dashed}
.why{font-size:12px;color:var(--warn);margin:4px 0 0}
.dwrap{overflow-x:auto;max-width:100%;border:1px solid var(--line);background:var(--bg)}
.diagram{width:100%;min-width:600px;display:block}
.steps{counter-reset:st}
.tabs{display:flex;flex-wrap:wrap;gap:0;border-bottom:2px solid var(--frame);margin-top:6px}
.tabs button{font:inherit;background:var(--bg);color:var(--fg);border:2px solid var(--frame);border-bottom:none;padding:4px 12px;margin:0 4px -2px 0;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--hot);color:var(--bar)}
button:focus-visible{outline:2px solid var(--title);outline-offset:1px}
.pane{border:1px solid var(--frame);border-top:none;padding:10px;background:var(--bg)}
.scrwrap{overflow-x:auto;max-width:100%;border:1px solid var(--line);background:var(--a4)}
pre.scr{margin:0;padding:4px 6px;font-family:"DejaVu Sans Mono",Consolas,"Liberation Mono",monospace;font-size:clamp(7px,1.15vw,13px);line-height:1.18;color:var(--afd);background:var(--abd);width:max-content;min-width:100%}
.nav{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
.nav button{font:inherit;background:var(--panel);color:var(--fg);border:1px solid var(--frame);padding:1px 10px;cursor:pointer}
.nav button:disabled{opacity:.4;cursor:default}
.cap{color:var(--hot)}
pre.cli{margin:6px 0;padding:8px 10px;background:var(--term);color:var(--termfg);border-left:3px solid var(--hot);overflow-x:auto;white-space:pre}
pre.cli .c{color:var(--muted)}
pre.out{margin:6px 0;padding:6px 10px;background:var(--term);color:var(--warn);border-left:3px solid var(--warn);white-space:pre-wrap;word-break:break-word}
.copy{float:right;font:inherit;font-size:12px;background:var(--panel);color:var(--fg);border:1px solid var(--frame);cursor:pointer;padding:0 6px}
.k{display:inline-block;background:var(--a6);color:var(--a0);padding:0 3px}
.src{font-size:12px;color:var(--muted)}
.both{display:grid;grid-template-columns:1fr;gap:8px}
.f0{color:var(--a0)}.f1{color:var(--a1)}.f2{color:var(--a2)}.f3{color:var(--a3)}.f4{color:var(--a4)}.f5{color:var(--a5)}.f6{color:var(--a6)}.f7{color:var(--a7)}.f9{color:var(--abd)}
.b0{background:var(--a0)}.b1{background:var(--a1)}.b2{background:var(--a2)}.b3{background:var(--a3)}.b4{background:var(--a4)}.b5{background:var(--a5)}.b6{background:var(--a6)}.b7{background:var(--a7)}.b9{background:var(--abd)}
.B{font-weight:bold}.B.f7{color:var(--a15)}.B.f3{color:var(--a11)}.B.f2{color:var(--a10)}.B.f1{color:var(--a9)}.B.f6{color:var(--a14)}
@media (max-width:640px){body{font-size:13px}.tabs button{padding:3px 8px}}
</style>

// ---- paleta: jedno miejsce -----------------------------------------------------------
const C = {
  bg: "#0c0c14", fg: "#c8c8c8", panel: "#14142a", bar: "#00a8a8", barfg: "#000000", barhot: "#ffffff",
  frame: "#5c5cff", line: "#33335a", title: "#ffff55", hot: "#55ffff", muted: "#8a8aa8",
  warn: "#ff8a55", ok: "#55ff55", link: "#55ffff", term: "#000000", termfg: "#e0e0e0",
  // terminal (xterm/PuTTY): a0..a7 zwykle, a9..a15 jasne; abd/afd = tło i tekst domyślne
  a0: "#000000", a1: "#aa0000", a2: "#00aa00", a3: "#aa5500", a4: "#0000aa", a5: "#aa00aa", a6: "#00aaaa", a7: "#aaaaaa",
  a9: "#ff5555", a10: "#55ff55", a11: "#ffff55", a14: "#55ffff", a15: "#ffffff",
  abd: "#0000aa", afd: "#d0d0d0"
};
for (const [k, v] of Object.entries(C)) document.documentElement.style.setProperty("--" + k, v);

// ---- klocki: co z czym wolno (logika, bez tekstów) -----------------------------------------
// hosts: 1 = jeden host, 2 = dwa hosty, kl = klaster Proxmox (pvesr), abc = A > B <> C
const KINDS = {
  "1": ["ml", "ka", "kp"],
  "2": ["bk", "lu", "sz"],
  kl: ["szkp", "bk", "lu"],
  abc: ["abc"]
};
const OFF = { kl: { lu: true } };          // lustro w obrębie jednego klastra: odmowa pakietu
const HAS_COPY = { ml: false, sz: false };  // bez kopii nie ma z czego odtwarzać
const state = { h: "2", k: "bk", r: 1, g: 1, c: 1, v: "gui" };
let LANG = "pl";
function readHash() {
  try {
    const q = new URLSearchParams(location.hash.slice(1));
    if (KINDS[q.get("h")]) state.h = q.get("h");
    if (KINDS[state.h].includes(q.get("k"))) state.k = q.get("k"); else if (!KINDS[state.h].includes(state.k)) state.k = KINDS[state.h][0];
    for (const f of ["r", "g", "c"]) if (q.has(f)) state[f] = q.get(f) === "1" ? 1 : 0;
    if (["gui", "cli", "both"].includes(q.get("v"))) state.v = q.get("v");
    if (q.get("l") === "en" || q.get("l") === "pl") LANG = q.get("l");
    else if ((navigator.language || "").slice(0, 2) !== "pl") LANG = "en";
  } catch (e) {}
}
readHash();
const saveHash = () => { try { history.replaceState(null, "", "#" + new URLSearchParams({ h: state.h, k: state.k, r: state.r, g: state.g, c: state.c, v: state.v, l: LANG })); } catch (e) {} };

// ---- schemat z klocków (inline SVG) -----------------------------------------------------
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const mk = (col) => `<marker id="ah${col.slice(1)}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${col}"/></marker>`;
const box = (x, y, w, h, name, sub, lines) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${C.panel}" stroke="${C.frame}" stroke-width="2"/>`
  + `<rect x="${x}" y="${y}" width="${w}" height="22" fill="${C.frame}"/>`
  + `<text x="${x + 8}" y="${y + 16}" fill="${C.title}" font-weight="bold">${esc(name)}</text>`
  + `<text x="${x + w - 8}" y="${y + 16}" fill="${C.fg}" text-anchor="end">${esc(sub)}</text>`
  + lines.map((l, i) => `<text x="${x + 10}" y="${y + 42 + i * 18}" fill="${l[1] || C.fg}">${esc(l[0])}</text>`).join("");
const arr = (x1, y1, x2, y2, label, col, dash, both) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="2" ${dash ? 'stroke-dasharray="6 4"' : ""} marker-end="url(#ah${col.slice(1)})" ${both ? `marker-start="url(#ah${col.slice(1)})"` : ""}/>`
  + (label ? `<text x="${(x1 + x2) / 2}" y="${Math.min(y1, y2) - 6}" fill="${col}" text-anchor="middle" font-size="12">${esc(label)}</text>` : "");
const shields = (x, y, list) => list.map((s, i) => `<g><rect x="${x + i * 92}" y="${y}" width="86" height="20" fill="${C.bg}" stroke="${C.ok}" stroke-width="1"/><text x="${x + i * 92 + 43}" y="${y + 14}" fill="${C.ok}" text-anchor="middle" font-size="11">${esc(s)}</text></g>`).join("");
const flag = (x, y, w, txt) => `<rect x="${x}" y="${y}" width="${w}" height="20" fill="${C.title}"/><text x="${x + w / 2}" y="${y + 14}" fill="${C.bar === "" ? C.bg : "#000"}" text-anchor="middle" font-size="12" font-weight="bold">${esc(txt)}</text>`;
const disk = (x, y, t) => `<rect x="${x}" y="${y}" width="210" height="44" fill="${C.bg}" stroke="${C.muted}" stroke-width="2" stroke-dasharray="5 3"/>`
  + `<text x="${x + 10}" y="${y + 18}" fill="${C.title}">${esc(t[0])}</text><text x="${x + 10}" y="${y + 36}" fill="${C.muted}">${esc(t[1])}</text>`;

function diagram(T) {
  const D = T.dia, k = state.k, h = state.h;
  const W = 860, two = h !== "1", three = h === "abc";
  let s = "", H = 250;
  const gs = [];
  if (state.g) gs.push(D.shG);
  if (state.c) gs.push(D.shC);
  // hosty
  if (!two) {
    const L = D.solo[k];
    s += flag(240, 8, 380, D.init) + box(240, 30, 380, 150, "pve1", D.only, L);
    s += shields(250, 186, gs);
    if (state.r) s += arr(430, 210, 430, 236, "", C.muted, true) + disk(325, 238, D.disk);
    H = state.r ? 300 : 230;
  } else if (!three) {
    const A = D.a[h + k] || D.a[k], B = D.b[h + k] || D.b[k];
    s += box(20, 40, 280, 140, "pve1", h === "kl" ? D.node1 : D.src, A);
    s += flag(560, 16, 280, D.init) + box(560, 40, 280, 140, "pve2", h === "kl" ? D.node2 : D.col, B);
    if (h === "kl") s += `<line x1="300" y1="58" x2="560" y2="58" stroke="${C.muted}" stroke-width="2" stroke-dasharray="2 4"/><text x="430" y="52" fill="${C.muted}" text-anchor="middle">corosync</text>`;
    for (const a of (D.ar[h + k] || D.ar[k])) s += arr(...a.xy, a.t, C[a.c], a.d, a.both);
    const sh = gs.slice(); if (h === "kl") sh.push(D.shP);
    s += shields(570, 186, sh);
    if (state.r) s += arr(700, 210, 700, 236, "", C.muted, true) + disk(595, 238, D.disk);
    H = state.r ? 300 : 230;
  } else {
    s += box(10, 40, 220, 130, "pve1 (A)", D.src, D.abc.a);
    s += box(320, 40, 220, 130, "pve2 (B)", D.col, D.abc.b);
    s += box(630, 40, 220, 130, "pve3 (C)", D.peer, D.abc.c);
    s += flag(320, 16, 220, D.init) + flag(630, 16, 220, D.init);
    s += arr(230, 100, 318, 100, D.abcL[0], C.hot);
    s += arr(540, 85, 628, 85, D.abcL[1], C.hot) + arr(628, 140, 542, 140, D.abcL[2], C.hot);
    s += shields(330, 176, gs);
    if (state.r) s += arr(430, 200, 430, 226, "", C.muted, true) + disk(325, 228, D.disk);
    H = state.r ? 290 : 220;
  }
  const leg = (D.leg[three ? "abc" : !two ? "solo" : h + k] || D.leg[k] || []).concat([D.legAll]);
  leg.forEach((l, i) => { s += `<text x="16" y="${H + 18 + i * 18}" fill="${i === leg.length - 1 ? C.muted : C.fg}">${esc(l)}</text>`; });
  H += 14 + leg.length * 18;
  return `<svg class="diagram" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(T.ui.dia)}" xmlns="http://www.w3.org/2000/svg" font-family="Consolas,'DejaVu Sans Mono',monospace" font-size="13"><defs>${[C.hot, C.title, C.warn, C.muted].map(mk).join("")}</defs>${s}</svg>`;
}

// ---- kroki wariantu: składane z katalogu TXT[..].st ----------------------------------------
function stepsFor(T) {
  const k = state.k, h = state.h, S = T.st, out = [];
  if (h === "1") out.push(S["c_" + k]);
  else if (k === "abc") out.push(S.c_bk, S.c_lu, S.v_abc);
  else if (k === "szkp") out.push(S.c_sz, S.c_kp2, S.v_kl);
  else out.push(S["c_" + k], S.v_2);
  if (HAS_COPY[k] === false) out.push(S.r_none);
  else if (h === "1") out.push(S.r_local);
  else if (k === "lu") out.push(S.r_lu);
  else if (k === "szkp") out.push(S.r_kl);
  else out.push(S.r_bk);
  if (state.r) out.push(S.rep);
  if (h === "kl") out.push(S.guest);
  if (state.g || state.c) out.push(h === "1" ? S.guards1 : S.guards);
  return out.filter(Boolean);
}

// ---- render -------------------------------------------------------------------------------
const SCRL = () => (typeof SCR !== "undefined" && (SCR[LANG] || SCR.pl)) || {};
function screenBox(id, cap) { return `<div class="scrwrap"><pre class="scr" aria-label="${esc(cap)}">${SCRL()[id] || ""}</pre></div>`; }
function slides(list, ui, key) {
  if (!list || !list.length) return `<p class="muted">${ui.noScr}</p>`;
  return `<div class="slides" data-key="${key}" data-i="0">
    <div class="nav"><button type="button" data-d="-1" disabled>${ui.prev}</button><span class="cnt">${ui.screen} 1/${list.length}</span><button type="button" data-d="1" ${list.length < 2 ? "disabled" : ""}>${ui.next}</button></div>
    <p class="cap">${esc(list[0][1])}</p>${screenBox(list[0][0], list[0][1])}</div>`;
}
function cliBlocks(st, ui) {
  let h = st.cliLead ? `<p>${st.cliLead}</p>` : "";
  for (const [c, cmd] of st.cli || []) h += `<pre class="cli"><button type="button" class="copy" data-cmd="${esc(cmd)}">${ui.copy}</button><span class="c"># ${esc(c)}</span>\n${esc(cmd)}</pre>`;
  if (st.out) h += `<pre class="out">${esc(st.out)}</pre>`;
  return h;
}
let STEPS = [];
function render() {
  const T = TXT[LANG] && TXT[LANG].ui ? TXT[LANG] : TXT.pl, ui = T.ui;
  document.documentElement.lang = LANG;
  document.getElementById("ttl").textContent = ui.title;
  document.getElementById("viewsel").innerHTML = ["gui", "cli", "both"].map(v => `<button type="button" data-view="${v}" aria-pressed="${state.v === v}">${ui.v[v]}</button>`).join("");
  document.getElementById("viewsel").setAttribute("aria-label", ui.vLbl);
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === LANG));
  let h = `<div class="box"><h2>${ui.introH}</h2>${T.intro}</div>`;
  // klocki
  const blk = (grp, val, on, label, small, dis) => `<button type="button" class="blk" data-${grp}="${val}" aria-pressed="${on}" ${dis ? "disabled" : ""}>${esc(label)}${small ? `<small>${esc(small)}</small>` : ""}</button>`;
  let b = `<div class="row"><span class="lbl">${ui.b1}</span><div class="blocks">${Object.keys(KINDS).map(x => blk("h", x, state.h === x, T.hosts[x][0], T.hosts[x][1])).join("")}</div></div>`;
  b += `<div class="row"><span class="lbl">${ui.b2}</span><div class="blocks">${KINDS[state.h].map(x => blk("k", x, state.k === x, T.kinds[x][0], T.kinds[x][1], OFF[state.h] && OFF[state.h][x])).join("")}</div>`;
  for (const x of KINDS[state.h]) if (OFF[state.h] && OFF[state.h][x]) b += `<p class="why">${T.off[state.h + x]}</p>`;
  b += `</div><div class="row"><span class="lbl">${ui.b3}</span><div class="blocks">${blk("r", 1, !!state.r, T.add.r[0], T.add.r[1])}${blk("g", 1, !!state.g, T.add.g[0], T.add.g[1])}${blk("c", 1, !!state.c, T.add.c[0], T.add.c[1])}</div></div>`;
  h += `<div class="box"><h2>${ui.buildH}</h2><div class="build"><div>${b}</div><div><div class="dwrap">${diagram(T)}</div><p>${T.kinds[state.k][2]}</p></div></div></div>`;
  // kroki
  STEPS = stepsFor(T);
  STEPS.forEach((st, i) => {
    const key = "s" + i;
    const gui = `<div class="pane" data-pane="${key}-gui">${st.gui && st.gui.length ? slides(st.gui, ui, key) : `<p class="muted">${st.noGui || ui.noScr}</p>`}</div>`;
    const cli = `<div class="pane" data-pane="${key}-cli">${cliBlocks(st, ui) || `<p class="muted">${ui.noCli}</p>`}</div>`;
    const body = state.v === "gui" ? gui : state.v === "cli" ? cli : `<div class="both">${gui}${cli}</div>`;
    h += `<div class="box"><h3>${i + 1}. ${st.h}</h3>${st.lead ? `<p>${st.lead}</p>` : ""}${body}${st.note ? `<p class="muted">${st.note}</p>` : ""}</div>`;
  });
  h += T.eng ? `<div class="box"><h2>${T.eng.h}</h2>${T.eng.body}</div>` : "";
  h += `<p class="src">${ui.foot}</p>`;
  document.getElementById("app").innerHTML = h;
  saveHash();
}
document.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b || b.disabled) return;
  const ui = (TXT[LANG] && TXT[LANG].ui ? TXT[LANG] : TXT.pl).ui;
  if (b.dataset.h) { state.h = b.dataset.h; if (!KINDS[state.h].includes(state.k) || (OFF[state.h] || {})[state.k]) state.k = KINDS[state.h][0]; render(); return; }
  if (b.dataset.k) { state.k = b.dataset.k; render(); return; }
  for (const f of ["r", "g", "c"]) if (b.dataset[f]) { state[f] = state[f] ? 0 : 1; render(); return; }
  if (b.dataset.view) { state.v = b.dataset.view; render(); return; }
  if (b.dataset.lang) { LANG = b.dataset.lang; render(); return; }
  if (b.dataset.d) {
    const sl = b.closest(".slides"), list = STEPS[+sl.dataset.key.slice(1)].gui;
    const i = Math.max(0, Math.min(list.length - 1, +sl.dataset.i + +b.dataset.d));
    sl.dataset.i = i;
    sl.querySelector(".cnt").textContent = `${ui.screen} ${i + 1}/${list.length}`;
    sl.querySelector('[data-d="-1"]').disabled = i === 0;
    sl.querySelector('[data-d="1"]').disabled = i === list.length - 1;
    sl.querySelector(".cap").textContent = list[i][1];
    sl.querySelector(".scrwrap").outerHTML = screenBox(list[i][0], list[i][1]);
    return;
  }
  if (b.classList.contains("copy") && navigator.clipboard) {
    navigator.clipboard.writeText(b.dataset.cmd).then(() => { b.textContent = ui.copied; setTimeout(() => b.textContent = ui.copy, 1200); }, () => {});
  }
});

<table class="t"><tr><th>rodzaj relacji</th><th>jak pakiet woła snapget</th></tr>

<ul>
<li>wspólną migawkę źródła i celu rozpoznaje po GUID, nie po nazwie; bez wspólnej i bez celu robi pierwszą pełną kopię; gdy cel istnieje, a wspólnej nie ma, <b>odmawia</b> (nadpisanie tylko jawnie, <code>-f</code>);</li>

<li>przy źródle zdalnym kompresuje strumień zstd -3 (pomiar w nagłówku silnika: lepszy współczynnik i ok. 3× szybciej niż dawny pigz -6); przy źródle lokalnym nie kompresuje;</li>

  guest: { h: "Strażnik gościa: VM przeniesiona na kolektor",
    lead: "Gdy gość przejdzie z pve1 na pve2 (migracja, HA), jego dysk na pve1 staje się celem replikacji pvesr. Migawki i sprzątanie na nim zostałyby cofnięte albo zepsułyby replikację. Strażnik sprawdza przed każdym biegiem w /etc/pve/nodes, gdzie gość stoi. Na innym węźle: polecenie NIE rusza, kod 76 i alarm.",
    noGui: "Strażnik nie ma okna: działa sam w każdej linii crona dysku gościa. Wynik widać w F2 Przebiegi (błąd biegu) i w mailu z alarmem.",

    out: "zfs-job: NOT RUN -- <gość>, not on <węzeł>: the disk there is a replication target (pvesr), and our snapshots or prunes on it would be undone or would break replication. Back this guest up where it runs …",

eng: { h: "The snapget engine: what it does underneath",
  body: `<p><code>snapget.sh</code> is the PULL engine. It is started by the cron of the host that pulls the data (the collector). Its twin <code>snapsend.sh</code> does the same the other way round: it SENDS from the source. The wizard does not tell you to call them, because the package writes the cron lines with them itself. Call: <code>snapget.sh [options] [account@]host:dataset[,…] [TARGET_BASE]</code>. Without a base the target has the same name as the source (this is how a mirror works).</p>
<table class="t"><tr><th>relation kind</th><th>how the package calls snapget</th></tr>
<tr><td>backup</td><td><code>-m automated_…</code>: a snapshot on the source over ssh, then an incremental <code>zfs send -I</code> to the target</td></tr>
<tr><td>mirror</td><td><code>-M</code>: after a successful pull it deletes older snapshots in the target that the source no longer has; never the base or newer ones</td></tr>
<tr><td>remote snapshots</td><td><code>-s</code>: only a snapshot on the source; it sends nothing, receives nothing and creates nothing on the collector</td></tr>
<tr><td>passive copy</td><td><code>-e</code>: takes the newest existing source snapshot instead of making its own</td></tr></table>
<p><b>What it always does, without flags:</b></p>
<ul>
<li>it recognises the common snapshot of the source and the target by GUID, not by name; with no common snapshot and no target it makes the first full copy; when the target exists and there is no common snapshot, it <b>refuses</b> (overwriting only explicitly, <code>-f</code>);</li>
<li>an interrupted transfer is resumed from where it stopped (<code>receive_resume_token</code>), and the source snapshot is kept under <code>zfs hold</code> for the whole transfer, also across following cron runs (except datasets replicated by pvesr);</li>
<li>with a remote source it compresses the stream with zstd -3 (measurement in the engine header: a better ratio and about 3× faster than the former pigz -6); with a local source it does not compress;</li>
<li>it does not touch Proxmox snapshots (<code>__replicate_*</code>, <code>vzdump*</code>, <code>__migration__*</code>) and in a mirror it does not receive onto the disk of a running guest;</li>
<li>after a recursive pull it checks that every descendant has a snapshot; one run at a time goes to one target (flock), the second one ends with code 75.</li></ul>
<p><b>Options the package sets from the relation</b> (selected): <code>-r</code> atomically with descendants, <code>-R</code> each dataset separately (<code>-X</code> excludes, <code>-S</code> skips the parent); <code>-z</code>/<code>-g</code>/<code>-N</code>/<code>-l</code> compression; <code>-A</code> measures the link itself and picks the compression; <code>-b</code> bandwidth limit; <code>-w</code> raw stream of an encrypted dataset; <code>-q</code> quiesce guests before the snapshot (<code>-Q</code> time limit); <code>-p</code>/<code>-K</code>/<code>-k</code>/<code>-O</code> ssh (port, key, known_hosts, options); <code>-H</code> full history at the first copy; <code>-i</code>/<code>-T</code> increment only instead of the whole snapshot chain; <code>-n</code> dry run; <code>-L</code> relation (pause = run skipped); <code>-V</code> version.</p>
<p><b>What snapget does not do:</b> it does not prune snapshots by retention. That is done by the separate retention engine <code>delsnaps.sh</code>; apart from it only the pool safety valve (capacity-guard.sh) deletes, and only above guard_at.</p>
<p><b>Exit codes:</b> 0 OK; 1 error or refusal; 3 quiesce refused; 8 snapshot made but the guest was not quiesced (consistent as after a power loss); 75 another run holds the lock.</p>
<p class="src">Source: header and getopts of snapget.sh (v2.77), docs/pl/REFERENCJA.md (section snapget.sh), docs/pl/KOMENDY.md (delsnaps.sh).</p>` },
