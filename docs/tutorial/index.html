*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:14px/1.5 "DejaVu Sans Mono",Consolas,"Liberation Mono","Courier New",monospace}
a{color:var(--link)}
.top{position:sticky;top:0;z-index:5;background:var(--bar);color:var(--barfg);display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:4px 16px;border-bottom:2px solid var(--frame)}
.top b{color:var(--hot)}
.lang button{font:inherit;background:var(--panel);color:var(--fg);border:1px solid var(--frame);padding:0 8px;margin-left:4px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--hot);color:var(--bar)}
.lang button:disabled{opacity:.45;cursor:not-allowed}
main{max-width:1180px;margin:0 auto;padding:12px 16px 40px}
.box{border:2px double var(--frame);background:var(--panel);margin:14px 0;padding:0 12px 12px;position:relative}
.box>h2,.box>h3{display:inline-block;margin:0 0 6px;transform:translateY(-.8em);background:var(--panel);padding:0 6px;color:var(--title);font-size:15px}
.box>h3{font-size:14px}
p{margin:.4em 0 .7em}
.muted{color:var(--muted)}
.warn{color:var(--warn)}
table.t{border-collapse:collapse;width:100%;margin:6px 0}
table.t td,table.t th{border:1px solid var(--line);padding:2px 8px;vertical-align:top;text-align:left}
table.t th{color:var(--title);font-weight:normal}
.tabs{display:flex;flex-wrap:wrap;gap:0;border-bottom:2px solid var(--frame);margin-top:6px}
.tabs button{font:inherit;background:var(--bg);color:var(--fg);border:2px solid var(--frame);border-bottom:none;padding:4px 12px;margin:0 4px -2px 0;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--hot);color:var(--bar)}
.tabs button:focus-visible,.sub button:focus-visible,.nav button:focus-visible{outline:2px solid var(--title);outline-offset:1px}
.sub{display:flex;gap:0;margin:8px 0 0}
.sub button{font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--frame);padding:2px 14px;cursor:pointer;margin-right:-1px}
.sub button[aria-selected=true]{background:var(--title);color:var(--bar)}
.pane{border:1px solid var(--frame);border-top:none;padding:10px;background:var(--bg)}
.dwrap{overflow-x:auto;max-width:100%}
.diagram{width:100%;max-width:820px;min-width:620px;display:block;margin:6px auto}
.scrwrap{overflow-x:auto;max-width:100%;border:1px solid var(--line);background:var(--a4)}
pre.scr{margin:0;padding:4px 6px;font-family:"DejaVu Sans Mono",Consolas,"Liberation Mono",monospace;font-size:clamp(7px,1.15vw,13px);line-height:1.18;color:var(--afd);background:var(--abd);width:max-content;min-width:100%}
.nav{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
.nav button{font:inherit;background:var(--panel);color:var(--fg);border:1px solid var(--frame);padding:1px 10px;cursor:pointer}
.nav button:disabled{opacity:.4;cursor:default}
.cap{color:var(--hot)}
.keys{color:var(--title)}
pre.cli{margin:6px 0;padding:8px 10px;background:var(--term);color:var(--termfg);border-left:3px solid var(--hot);overflow-x:auto;white-space:pre}
pre.cli .c{color:var(--muted)}
pre.out{margin:6px 0;padding:6px 10px;background:var(--term);color:var(--warn);border-left:3px solid var(--warn);white-space:pre-wrap;word-break:break-word}
.copy{float:right;font:inherit;font-size:12px;background:var(--panel);color:var(--fg);border:1px solid var(--frame);cursor:pointer;padding:0 6px}
ol.steps{padding-left:22px;margin:4px 0}
.k{display:inline-block;background:var(--a6);color:var(--a0);padding:0 3px}
.src{font-size:12px;color:var(--muted)}
.f0{color:var(--a0)}.f1{color:var(--a1)}.f2{color:var(--a2)}.f3{color:var(--a3)}.f4{color:var(--a4)}.f5{color:var(--a5)}.f6{color:var(--a6)}.f7{color:var(--a7)}.f9{color:var(--abd)}

@media (max-width:640px){body{font-size:13px}.tabs button{padding:3px 8px}}
</style>

// ---- diagramy (inline SVG) --------------------------------------------------------------
const svgHead = (h) => `<svg class="diagram" viewBox="0 0 820 ${h}" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Consolas,'DejaVu Sans Mono',monospace" font-size="13">`;
const host = (x, y, w, h, name, sub, lines) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${C.panel}" stroke="${C.frame}" stroke-width="2"/>`
  + `<rect x="${x}" y="${y}" width="${w}" height="22" fill="${C.frame}"/>`
  + `<text x="${x + 8}" y="${y + 16}" fill="${C.title}" font-weight="bold">${name}</text>`
  + `<text x="${x + w - 8}" y="${y + 16}" fill="${C.fg}" text-anchor="end">${sub}</text>`
  + lines.map((l, i) => `<text x="${x + 10}" y="${y + 42 + i * 18}" fill="${l[1] || C.fg}">${l[0]}</text>`).join("");
const arrow = (x1, y1, x2, y2, label, col, dash) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="2" ${dash ? 'stroke-dasharray="6 4"' : ""} marker-end="url(#ah${col.slice(1)})"/>`
  + (label ? `<text x="${(x1 + x2) / 2}" y="${(y1 + y2) / 2 - 7}" fill="${col}" text-anchor="middle">${label}</text>` : "");
const marker = (col) => `<marker id="ah${col.slice(1)}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${col}"/></marker>`;
const defs = () => `<defs>${[C.hot, C.title, C.warn, C.muted].map(marker).join("")}</defs>`;
const usb = (x, y, what) => `<rect x="${x}" y="${y}" width="200" height="54" fill="${C.bg}" stroke="${C.muted}" stroke-width="2" stroke-dasharray="5 3"/>`
  + `<text x="${x + 10}" y="${y + 20}" fill="${C.title}">replika: USB / pula</text><text x="${x + 10}" y="${y + 40}" fill="${C.muted}">${what}</text>`;

// ---- render ------------------------------------------------------------------------------
let LANG = "pl";
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const state = { cfg: "a" };
try { const h = location.hash.slice(1); if ("abcd".includes(h) && h) state.cfg = h; } catch (e) {}

function screenBox(id, cap) {
  return `<div class="scrwrap"><pre class="scr" aria-label="${esc(cap)}">${SCR[id] || ""}</pre></div>`;
}
function slides(list, ui, key) {
  if (!list.length) return `<p class="muted">${ui.noScr}</p>`;
  return `<div class="slides" data-key="${key}" data-i="0">
    <div class="nav"><button type="button" data-d="-1" disabled>${ui.prev}</button><span class="cnt">${ui.screen} 1/${list.length}</span><button type="button" data-d="1" ${list.length < 2 ? "disabled" : ""}>${ui.next}</button></div>
    <p class="cap">${esc(list[0][1])}</p>${screenBox(list[0][0], list[0][1])}</div>`;
}
function cliBlocks(cli, ui) {
  let h = `<p>${cli.lead}</p>`;
  for (const [c, cmd] of cli.blocks) {
    h += `<pre class="cli"><button type="button" class="copy" data-cmd="${esc(cmd)}">${ui.copy}</button><span class="c"># ${esc(c)}</span>\n${esc(cmd)}</pre>`;
  }
  if (cli.out) h += `<pre class="out">${esc(cli.out)}</pre>`;
  return h + (cli.notes || "");
}
function safetyBox() {
  return `<div class="box"><h3>${SAFETY.h}</h3><table class="t">${SAFETY.rows.map(r => `<tr><th>${r[0]}</th><td>${r[1]}</td></tr>`).join("")}</table>
    <p class="muted">Treść odmów (przykład):</p><pre class="out">${esc(SAFETY.out)}</pre><p class="src">${SAFETY.src}</p></div>`;
}
function render() {
  const T = TXT[LANG], ui = T.ui, cfg = T.cfg.find(c => c.id === state.cfg);
  let h = `<div class="box"><h2>${T.intro.h}</h2>${T.intro.body}<p class="cap">${esc(T.intro.scr[1])}</p>${screenBox(T.intro.scr[0], T.intro.scr[1])}${T.intro.note}</div>`;
  h += `<div class="tabs" role="tablist">${T.cfg.map(c => `<button type="button" role="tab" data-cfg="${c.id}" aria-selected="${c.id === state.cfg}">${esc(c.tab)}</button>`).join("")}</div>`;
  h += `<div class="pane" role="tabpanel"><h2 style="color:${C.title};font-size:16px;margin:4px 0">${esc(cfg.title)}</h2><div class="dwrap">${SVG[cfg.id]()}</div>${cfg.lead}`;
  cfg.steps.forEach((s, i) => {
    const key = cfg.id + i;
    h += `<div class="box"><h3>${s.h}</h3>
      <div class="sub" role="tablist"><button type="button" role="tab" data-step="${key}" data-v="gui" aria-selected="true">${ui.gui}</button><button type="button" role="tab" data-step="${key}" data-v="cli" aria-selected="false">${ui.cli}</button></div>
      <div class="pane" data-pane="${key}-gui">${s.gui.lead.startsWith("<") ? s.gui.lead : `<p>${s.gui.lead}</p>`}${slides(s.gui.scr, ui, key)}</div>
      <div class="pane" data-pane="${key}-cli" hidden>${cliBlocks(s.cli, ui)}</div>
      ${s.safety ? safetyBox() : ""}</div>`;
  });
  h += `</div><p class="src">${ui.foot}</p>`;
  document.getElementById("app").innerHTML = h;
}
document.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  const T = TXT[LANG], ui = T.ui;
  if (b.dataset.cfg) { state.cfg = b.dataset.cfg; try { history.replaceState(null, "", "#" + state.cfg); } catch (x) {} render(); return; }
  if (b.dataset.step) {
    const k = b.dataset.step, v = b.dataset.v;
    document.querySelectorAll(`[data-step="${k}"]`).forEach(x => x.setAttribute("aria-selected", x.dataset.v === v));
    document.querySelector(`[data-pane="${k}-gui"]`).hidden = v !== "gui";
    document.querySelector(`[data-pane="${k}-cli"]`).hidden = v !== "cli";
    return;
  }
  if (b.dataset.d) {
    const sl = b.closest(".slides"), key = sl.dataset.key;
    const cfg = T.cfg.find(c => c.id === key[0]), list = cfg.steps[+key.slice(1)].gui.scr;
    let i = Math.max(0, Math.min(list.length - 1, +sl.dataset.i + +b.dataset.d));
    sl.dataset.i = i;
    sl.querySelector(".cnt").textContent = `${ui.screen} ${i + 1}/${list.length}`;
    sl.querySelector('[data-d="-1"]').disabled = i === 0;
    sl.querySelector('[data-d="1"]').disabled = i === list.length - 1;
    sl.querySelector(".cap").textContent = list[i][1];
    sl.querySelector(".scrwrap").outerHTML = screenBox(list[i][0], list[i][1]);
    return;
  }
  if (b.classList.contains("copy")) {
    const t = b.dataset.cmd;
    const done = () => { b.textContent = ui.copied; setTimeout(() => b.textContent = ui.copy, 1200); };
    if (navigator.clipboard) navigator.clipboard.writeText(t).then(done, () => {});
    return;
  }
  if (b.dataset.lang && TXT[b.dataset.lang]) { LANG = b.dataset.lang; document.documentElement.lang = LANG; render(); }
});
render();
</script>
